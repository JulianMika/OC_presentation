    <link rel="icon" type="image/png" href="assets/favicon_0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Saira+Stencil+One&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var lang = localStorage.getItem("oc-lang");
        localStorage.removeItem("oc-bg");
        document.documentElement.dataset.theme = "white";
        if (lang === "de" || lang === "en") {
          document.documentElement.dataset.lang = lang;
          document.documentElement.lang = lang === "de" ? "de" : "en";
        }
        document.documentElement.style.setProperty("--app-height", window.innerHeight + "px");
      })();
    </script>
    <style>
      @font-face {
        font-family: "Bauhaus 93";
        src: local("Bauhaus 93"), local("Bauhaus93"), local("Bauhaus 93 Regular");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Inter OC";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuI6fAZ9hiJ-Ek-_EeA.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Inter OC";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuFuYAZ9hiJ-Ek-_EeA.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        --widget: #fff;
        --ink: #111;
        --edge: #111;
        --glass: rgba(255, 255, 255, 0.48);
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
        --sans: "Inter", sans-serif;
        --app-height: 100dvh;
        --panel-ms: 0.85s;
        --panel-ease: cubic-bezier(0.4, 0, 0.2, 1);
      }

      html[data-theme="black"] {
        --widget: #111;
        --ink: #fff;
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }

      html[data-logo="light"] {
        --edge: #fff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        height: 100%;
        overflow: hidden;
        background: #1d2a1c;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }

      body {
        height: 100%;
        overflow: hidden;
        color: var(--ink);
        font-family: var(--sans);
      }

      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: #1d2a1c;
        pointer-events: none;
      }

      .bg > *,
      .bg-light > * {
        position: absolute;
        inset: 0;
      }

      .bg-photo {
        background: #1d2a1c url("assets/background.jpg") center / cover no-repeat;
      }

      html[data-bg="city"] .bg,
      html[data-bg="city"] .bg-photo {
        background-color: #07090d;
      }

      html[data-bg="city"] .bg-photo {
        background-image: url("assets/background-city.jpg");
      }

      html[data-bg="snow"] .bg,
      html[data-bg="snow"] .bg-photo {
        background-color: #d5e2ee;
      }

      html[data-bg="snow"] .bg-photo {
        background-image: url("assets/background-snow.jpg");
      }

      html[data-bg="forest"] .bg,
      html[data-bg="forest"] .bg-photo {
        background-color: #102418;
      }

      html[data-bg="forest"] .bg-photo {
        background-image: url("assets/background-forest.jpg");
      }

      .bg-water,
      .bg-fx,
      .bg-light,
      .bg-warm,
      .bg-grade {
        display: none;
        opacity: 0;
      }

      .bg.is-live .bg-water,
      .bg.is-live .bg-fx,
      .bg.is-live .bg-light,
      .bg.is-live .bg-warm,
      .bg.is-live .bg-grade {
        display: block;
      }

      html[data-bg="city"] .bg.is-live > :not(.bg-photo),
      html[data-bg="snow"] .bg.is-live > :not(.bg-photo),
      html[data-bg="forest"] .bg.is-live > :not(.bg-photo) {
        display: none;
      }

      .bg.is-live .bg-cam {
        will-change: transform;
      }

      .bg-water {
        right: auto;
        bottom: auto;
      }

      .bg-fx {
        width: 100%;
        height: 100%;
        opacity: 1;
      }

      .bg-light {
        mix-blend-mode: screen;
      }

      .bg-sun {
        background: radial-gradient(
          circle at var(--sun-x, 85%) var(--sun-y, 0%),
          rgba(255, 251, 238, 1) 0,
          rgba(255, 242, 210, 0.75) 5%,
          rgba(255, 226, 172, 0.34) 14%,
          rgba(255, 212, 150, 0.1) 28%,
          rgba(255, 212, 150, 0) 46%
        );
      }

      .bg-rays {
        transform-origin: var(--sun-x, 85%) var(--sun-y, 0%);
        background: conic-gradient(
          from 0deg at var(--sun-x, 85%) var(--sun-y, 0%),
          rgba(255, 238, 206, 0) 0deg 177.5deg,
          rgba(255, 238, 206, 0.18) 179.25deg,
          rgba(255, 238, 206, 0.5) 181deg,
          rgba(255, 238, 206, 0.18) 182.75deg,
          rgba(255, 238, 206, 0) 184.5deg 188.5deg,
          rgba(255, 238, 206, 0.11) 190.75deg,
          rgba(255, 238, 206, 0.32) 193deg,
          rgba(255, 238, 206, 0.11) 195.25deg,
          rgba(255, 238, 206, 0) 197.5deg 200.5deg,
          rgba(255, 238, 206, 0.2) 202deg,
          rgba(255, 238, 206, 0.58) 203.5deg,
          rgba(255, 238, 206, 0.2) 205deg,
          rgba(255, 238, 206, 0) 206.5deg 212deg,
          rgba(255, 238, 206, 0.13) 214.5deg,
          rgba(255, 238, 206, 0.36) 217deg,
          rgba(255, 238, 206, 0.13) 219.5deg,
          rgba(255, 238, 206, 0) 222deg 225.5deg,
          rgba(255, 238, 206, 0.18) 227deg,
          rgba(255, 238, 206, 0.5) 228.5deg,
          rgba(255, 238, 206, 0.18) 230deg,
          rgba(255, 238, 206, 0) 231.5deg 237.5deg,
          rgba(255, 238, 206, 0.1) 240.25deg,
          rgba(255, 238, 206, 0.28) 243deg,
          rgba(255, 238, 206, 0.1) 245.75deg,
          rgba(255, 238, 206, 0) 248.5deg 252deg,
          rgba(255, 238, 206, 0.15) 253.5deg,
          rgba(255, 238, 206, 0.42) 255deg,
          rgba(255, 238, 206, 0.15) 256.5deg,
          rgba(255, 238, 206, 0) 258deg 360deg
        );
        -webkit-mask-image: radial-gradient(
          circle at var(--sun-x, 85%) var(--sun-y, 0%),
          #000 0,
          rgba(0, 0, 0, 0.85) 25%,
          rgba(0, 0, 0, 0.4) 55%,
          rgba(0, 0, 0, 0) 85%
        );
        mask-image: radial-gradient(
          circle at var(--sun-x, 85%) var(--sun-y, 0%),
          #000 0,
          rgba(0, 0, 0, 0.85) 25%,
          rgba(0, 0, 0, 0.4) 55%,
          rgba(0, 0, 0, 0) 85%
        );
      }

      .bg-rays-back {
        background: conic-gradient(
          from 0deg at var(--sun-x, 85%) var(--sun-y, 0%),
          rgba(255, 228, 186, 0) 0deg 174deg,
          rgba(255, 228, 186, 0.12) 179.5deg,
          rgba(255, 228, 186, 0.34) 185deg,
          rgba(255, 228, 186, 0.12) 190.5deg,
          rgba(255, 228, 186, 0) 196deg 202deg,
          rgba(255, 228, 186, 0.09) 207.5deg,
          rgba(255, 228, 186, 0.26) 213deg,
          rgba(255, 228, 186, 0.09) 218.5deg,
          rgba(255, 228, 186, 0) 224deg 226deg,
          rgba(255, 228, 186, 0.1) 233deg,
          rgba(255, 228, 186, 0.3) 240deg,
          rgba(255, 228, 186, 0.1) 247deg,
          rgba(255, 228, 186, 0) 254deg 360deg
        );
      }

      .bg-warm {
        mix-blend-mode: soft-light;
        background:
          radial-gradient(
            circle at var(--sun-x, 85%) var(--sun-y, 0%),
            rgba(255, 186, 104, 0.95) 0,
            rgba(255, 196, 128, 0.45) 35%,
            rgba(255, 196, 128, 0) 75%
          ),
          linear-gradient(200deg, rgba(255, 196, 120, 0.5) 0%, rgba(255, 204, 140, 0) 50%, rgba(18, 58, 72, 0) 62%, rgba(18, 58, 72, 0.6) 100%);
      }

      .bg-grade {
        background:
          radial-gradient(130% 100% at 50% 42%, rgba(5, 14, 10, 0) 52%, rgba(5, 14, 10, 0.42) 100%),
          linear-gradient(180deg, rgba(5, 14, 10, 0) 64%, rgba(5, 14, 10, 0.24) 100%);
      }

      .slides {
        position: relative;
        z-index: 1;
        height: var(--app-height);
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y pinch-zoom;
      }

      .slide {
        position: relative;
        z-index: 1;
        height: var(--app-height);
        min-height: var(--app-height);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding:
          5.5rem
          calc(1.25rem + env(safe-area-inset-right, 0px))
          calc(2.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.25rem + env(safe-area-inset-left, 0px));
      }

      .lang-wrap {
        position: fixed;
        z-index: 3;
        top: calc(1.1rem + env(safe-area-inset-top, 0px));
        right: calc(0.9rem + env(safe-area-inset-right, 0px));
        display: flex;
        align-items: center;
        height: 2.75rem;
        pointer-events: auto;
      }

      .lang-button,
      .lang-option {
        appearance: none;
        -webkit-appearance: none;
        display: inline-block;
        box-sizing: border-box;
        width: max-content;
        max-width: 100%;
        padding: 0.55rem 1.15rem;
        color: #111;
        font-family: "Inter OC", "Inter", system-ui, sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        font-optical-sizing: none;
        -webkit-font-smoothing: auto;
        letter-spacing: 0.01em;
        text-align: left;
        background: var(--glass);
        border: none;
        border-radius: 999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .lang-button {
        display: inline-flex;
        align-items: center;
        height: 2.55rem;
        padding-top: 0;
        padding-bottom: 0;
        white-space: nowrap;
      }

      .background-option {
        appearance: none;
        -webkit-appearance: none;
        display: block;
        box-sizing: border-box;
        width: 8.25rem;
        height: 4.75rem;
        padding: 0.18rem;
        border: none;
        border-radius: 1.05rem;
        overflow: hidden;
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        line-height: 0;
      }

      .background-option img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 0.88rem;
        pointer-events: none;
      }

      .lang-wrap.is-open .lang-button,
      .background-wrap.is-open .background-button,
      .lang-option:hover,
      .lang-option:active,
      .lang-option:focus-visible,
      .lang-option.is-active,
      .background-option:hover,
      .background-option:active,
      .background-option:focus-visible,
      .background-option.is-active,
      .background-button:hover,
      .background-button:active,
      .background-button:focus-visible {
        background: #fff;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        outline: none;
      }

      .lang-menu,
      .background-menu {
        position: absolute;
        top: calc(100% + 0.55rem);
        left: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: max-content;
        gap: 0.45rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      html.lang-open .slides,
      html.bg-open .slides {
        visibility: hidden;
        pointer-events: none;
      }

      html.lang-open .lang-wrap,
      html.lang-open .background-wrap,
      html.bg-open .lang-wrap,
      html.bg-open .background-wrap {
        visibility: visible;
      }

      .lang-wrap,
      .background-wrap {
        visibility: hidden;
      }

      .lang-button,
      .background-button {
        opacity: 0;
        transition: opacity 0.7s ease;
      }

      html.is-chrome .lang-wrap,
      html.is-chrome .background-wrap,
      html.is-chrome-leave .lang-wrap,
      html.is-chrome-leave .background-wrap {
        visibility: visible;
      }

      html.is-chrome-leave .lang-wrap,
      html.is-chrome-leave .background-wrap {
        pointer-events: none;
      }

      html.is-chrome .lang-button,
      html.is-chrome .background-button {
        opacity: 1;
      }

      .background-wrap {
        position: fixed;
        z-index: 3;
        top: calc(1.1rem + env(safe-area-inset-top, 0px));
        left: calc(0.9rem + env(safe-area-inset-left, 0px));
        display: flex;
        align-items: center;
        height: 2.75rem;
        pointer-events: auto;
      }

      .background-button {
        appearance: none;
        -webkit-appearance: none;
        display: inline-flex;
        align-items: center;
        box-sizing: border-box;
        height: 2.55rem;
        padding: 0 1.15rem;
        color: #111;
        font-family: "Inter OC", "Inter", system-ui, sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        font-optical-sizing: none;
        -webkit-font-smoothing: auto;
        letter-spacing: 0.01em;
        white-space: nowrap;
        background: var(--glass);
        border: none;
        border-radius: 999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .lang-menu[hidden],
      .background-menu[hidden] {
        display: none;
      }

      .lang-option,
      .background-option {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.7s ease;
      }

      .lang-wrap.is-open .lang-option,
      .background-wrap.is-open .background-option {
        opacity: 1;
        pointer-events: auto;
      }

      @media (min-width: 768px) {
        .lang-wrap {
          top: calc(1.5rem + env(safe-area-inset-top, 0px));
          right: calc(1.85rem + env(safe-area-inset-right, 0px));
          height: 3rem;
        }

        .lang-button,
        .lang-option {
          padding: 0.65rem 1.35rem;
          font-size: 1.05rem;
        }

        .lang-button {
          height: 2.69rem;
          padding-top: 0;
          padding-bottom: 0;
        }

        .background-wrap {
          top: calc(1.5rem + env(safe-area-inset-top, 0px));
          left: calc(1.85rem + env(safe-area-inset-left, 0px));
          height: 3rem;
        }

        .background-button {
          height: 2.69rem;
          padding: 0 1.35rem;
          font-size: 1.05rem;
        }

        .background-option {
          width: 10.5rem;
          height: 6rem;
        }
      }

      .slide[data-slide="start"] {
        padding:
          calc(1.5rem + env(safe-area-inset-top, 0px))
          calc(1.5rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.5rem + env(safe-area-inset-left, 0px));
      }

      .lockup {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: max-content;
        max-width: 100%;
        transform-origin: center center;
      }

      .logo-widget {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        width: min(46.2vw, 242px);
        height: min(46.2vw, 242px);
        aspect-ratio: 1;
        overflow: hidden;
        background: transparent;
        border-radius: 50%;
      }

      .logo-widget > * {
        grid-area: 1 / 1;
      }

      .logo-flow {
        position: relative;
        z-index: 2;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .logo-widget img {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        -webkit-touch-callout: none;
        user-select: none;
      }

      html[data-theme="black"] .logo-widget img,
      html[data-logo="light"] .logo-widget img {
        filter: invert(1);
      }

      .slogan {
        margin-top: 2.3rem;
        width: fit-content;
        max-width: 100%;
        padding: 0.45rem 0.7rem;
        background: var(--glass);
        color: #111;
        border-radius: 0.75rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-family: var(--sans);
        font-size: clamp(1.9rem, 4.4vw, 2.3rem);
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.15;
        text-align: center;
        text-wrap: balance;
      }

      .slogan-mark {
        font-family: "Saira Stencil One", "Bauhaus 93", sans-serif;
        font-weight: 400;
        font-synthesis: none;
      }

      .slide-pair {
        align-items: center;
        justify-content: center;
        height: var(--app-height);
        padding: 0;
        container-type: size;
        transition: padding var(--panel-ms) var(--panel-ease);
      }

      .pair {
        --gap: 1.25rem;
        --edge-x: max(var(--gap), env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
        --edge-y: max(var(--gap), env(safe-area-inset-top, 0px), env(safe-area-inset-bottom, 0px));
        --s: min(
          calc((100cqw - 2 * var(--edge-x) - var(--gap)) / 2),
          calc(100cqh - 2 * var(--edge-y))
        );
        --g: max(var(--edge-x), calc((100cqw - 2 * var(--s)) / 3));
        position: relative;
        z-index: 1;
        align-self: stretch;
        width: 100%;
        height: 100%;
      }

      .panel {
        position: absolute;
        width: var(--s);
        height: var(--s);
        aspect-ratio: 1;
        top: calc(50% - var(--s) / 2);
        left: var(--g);
        overflow: hidden;
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 2px solid var(--edge);
        border-radius: 1.5rem;
        transition:
          width var(--panel-ms) var(--panel-ease),
          left var(--panel-ms) var(--panel-ease),
          top var(--panel-ms) var(--panel-ease);
      }

      .panel:last-child {
        left: calc(100% - var(--g) - var(--s));
      }

      .panel-copy {
        --copy: clamp(0.805rem, calc(var(--s) * 0.0283), 1.38rem);
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding: calc(var(--s) * 0.062);
        color: #111;
        font-size: var(--copy);
        text-align: left;
        container-type: size;
      }

      .panel-title {
        font-family: "Bauhaus 93", "Saira Stencil One", sans-serif;
        font-weight: 400;
        font-synthesis: none;
        margin: 0 0 0.55em;
        font-size: 1.55em;
        line-height: 1.15;
      }

      .panel-text {
        font-family: "Inter OC", "Inter", system-ui, sans-serif;
        font-weight: 500;
        flex: 1 1 auto;
        min-height: 0;
        margin: 0;

      attribute vec2 aPos;
      attribute vec2 aUv;

        vUv = aUv;
        gl_Position = vec4(aPos, 0.0, 1.0);

    <script type="x-shader/x-fragment" id="water-fragment">
      #ifdef GL_FRAGMENT_PRECISION_HIGH
      precision highp float;
      #else
      precision mediump float;
      #endif

      uniform sampler2D uPhoto;
      uniform sampler2D uMask;
      uniform vec2 uSize;
      uniform float uTime;
      uniform float uGlint;
      uniform vec4 uRings[3];
      varying vec2 vUv;

      float hash(vec2 cell) {
        return fract(sin(dot(cell, vec2(12.9898, 78.233))) * 43758.5453);
      }

      void main() {
        vec4 mask = texture2D(uMask, vUv);
        if (mask.r < 0.004) {
          gl_FragColor = vec4(0.0);
          return;
        }

        vec2 p = vUv * uSize;
        float t = uTime;
        float near = clamp((p.y - 354.0) / 104.0, 0.0, 1.0);
        float f = mix(1.3, 0.75, near);
        float a = p.y * f + t * 2.0 + sin(p.x * 0.05 + t * 0.3) * 2.0 + sin(p.x * 0.13 - t * 0.5) * 0.8;
        float b = p.y * f * 1.9 - t * 2.8 + p.x * 0.08;
        float c = p.x * 0.021 - p.y * 0.35 + t * 0.9;
        float wave = sin(a) * 0.6 + sin(b) * 0.3 + sin(c) * 0.1;
        float slope = cos(a) * 0.6 * f + cos(b) * 0.57 * f - cos(c) * 0.035;

        vec2 push = vec2(0.0);
        float ring = 0.0;
        for (int i = 0; i < 3; i++) {
          vec4 r = uRings[i];
          if (r.w <= 0.0) continue;
          vec2 d = (p - r.xy) * vec2(1.0, 2.6);
          float dist = length(d);
          float edge = dist - r.z * 9.0;
          float h = sin(edge * 1.8) * exp(-edge * edge / 14.0) * exp(-r.z * 0.45) * r.w;
          ring += h;
          push += vec2(d.x, d.y / 2.6) / max(dist, 0.001) * h;
        }

        float gust = 0.75 + 0.25 * sin(p.x * 0.012 - t * 0.25);
        float amp = mix(1.8, 3.4, near) * gust * mask.g;
        vec2 shift = vec2(0.35, 1.0) * wave * amp + push * 2.4 * mask.g;
        vec3 color = texture2D(uPhoto, vUv + shift / uSize).rgb;
        float patch = 0.55 + 0.45 * sin(p.x * 0.09 + sin(p.y * 0.21 + t * 0.4) * 1.5 + t * 0.6);
        color *= 1.0 + (slope * 0.065 * mix(0.6, 1.0, near) * gust * patch + ring * 0.15) * mask.g;

        vec2 grid = p / vec2(5.0, 2.5);
        vec2 cell = floor(grid);
        float seed = hash(cell);
        float jitter = hash(cell + 17.0);
        vec2 center = 0.34 + 0.32 * vec2(seed, jitter);
        float spot = smoothstep(0.34, 0.0, length((fract(grid) - center) * vec2(1.0, 1.8)));
        float flash = pow(max(0.0, sin(t * (1.0 + 2.0 * jitter) + seed * 40.0)), 10.0);
        float crest = smoothstep(0.0, 0.8, wave);
        float glint = spot * flash * crest * step(0.5, seed) * mask.g * uGlint;
        color = mix(color, vec3(0.95, 0.97, 1.0), clamp(glint * 1.4, 0.0, 1.0));

        gl_FragColor = vec4(color * mask.r, mask.r);
      }

            if (titleLines(title) <= 2) {
              best = mid;

        function matchXWidget() {
          var board = document.querySelector(".end-board");
          var timer = document.querySelector(".timer-widget");
          var release = document.querySelector(".release-widget");
          var xWidget = document.querySelector(".x-widget");
          if (!release || !xWidget || !board || !timer) return;
          release.style.width = "max-content";
          release.style.height = "max-content";
          xWidget.style.width = "max-content";
          xWidget.style.height = "max-content";
          var relRect = release.getBoundingClientRect();
          var xRect = xWidget.getBoundingClientRect();
          var cardW = Math.max(relRect.width, xRect.width);
          var cardH = Math.max(relRect.height, xRect.height);
          setPx(release, "width", cardW);
          setPx(release, "height", cardH);
          setPx(xWidget, "width", cardW);
          setPx(xWidget, "height", cardH);

          var left = Infinity;
          var right = -Infinity;
          board.querySelectorAll(".end-widget").forEach(function (card) {
            var rect = card.getBoundingClientRect();
            left = Math.min(left, rect.left);
            right = Math.max(right, rect.right);
          });
          var width = right - left;
          if (!(width > 0)) return;

          var dayText = document.getElementById("timer-days").textContent || "";
          var dayCount = Math.max(dayText.length, 2);
          var daySample = "";
          for (var n = 0; n < dayCount; n++) daySample += "8";

          var digitAt100 = widestDigit(100);
          var probe = timer.cloneNode(true);
          probe.style.cssText = "position:fixed;left:0;top:0;visibility:hidden;width:max-content;max-width:none;height:auto;font-size:100px;";
          probe.style.setProperty("--digit", digitAt100 + "px");
          var values = probe.querySelectorAll(".timer-value");
          if (values[0]) fillDigits(values[0], daySample);
          for (var i = 1; i < values.length; i++) fillDigits(values[i], "88");
          document.body.appendChild(probe);
          var gridWidth = probe.querySelector(".timer-grid").getBoundingClientRect().width;
          var style = getComputedStyle(probe);
          var border = parseFloat(style.borderLeftWidth) + parseFloat(style.borderRightWidth);
          var pad = (parseFloat(style.paddingLeft) + parseFloat(style.paddingRight)) / 100;
          probe.remove();

          var natural = (width - border) / (gridWidth / 100 + pad);
          setPx(timer, "width", width);
          timer.style.fontSize = natural + "px";

          var slide = timer.closest(".slide");
          var slideStyle = getComputedStyle(slide);
          var available = slide.clientHeight - parseFloat(slideStyle.paddingTop) - parseFloat(slideStyle.paddingBottom);
          var timerRect = timer.getBoundingClientRect();
          var boardRect = board.getBoundingClientRect();
          var below = boardRect.bottom - timerRect.bottom;
          var maxTimer = available - 2 * below;
          if (timerRect.height > maxTimer && maxTimer > 0) {
            var timerStyle = getComputedStyle(timer);
            var borderY = parseFloat(timerStyle.borderTopWidth) + parseFloat(timerStyle.borderBottomWidth);
            var content = timerRect.height - borderY;
            var contentMax = maxTimer - borderY;
            if (content > 0 && contentMax > 0) {
              timer.style.fontSize = (natural * contentMax / content) + "px";
            }
          }
          timer.style.setProperty("--digit", (digitAt100 / 100) * parseFloat(timer.style.fontSize) + "px");
        }

        function widestDigit(fontSize) {
          var sample = document.createElement("span");
          sample.className = "timer-value";
          sample.style.cssText = "position:fixed;left:0;top:0;visibility:hidden;font-size:" + fontSize + "px;";
          document.body.appendChild(sample);
          var max = 0;
          for (var d = 0; d < 10; d++) {
            sample.textContent = String(d);
            max = Math.max(max, sample.getBoundingClientRect().width);
          }
          sample.remove();
          return max;
        }

        function fillDigits(node, text) {
          node.textContent = "";
          for (var i = 0; i < text.length; i++) {
            var digit = document.createElement("span");
            digit.className = "timer-digit";
            digit.textContent = text.charAt(i);
            node.appendChild(digit);
          }
        }

        function fitSlogan() {
          var slide = slogan.closest(".slide");
          var slideStyle = getComputedStyle(slide);
          var available =
            slide.clientWidth -
            parseFloat(slideStyle.paddingLeft) -
            parseFloat(slideStyle.paddingRight);

          var probe = slogan.cloneNode(true);
          probe.style.cssText =
            "position:fixed;left:0;top:0;visibility:hidden;width:max-content;max-width:none;white-space:nowrap;";
          document.body.appendChild(probe);
          var single = probe.getBoundingClientRect().width;
          probe.remove();

          if (single + 1 <= available) {
            slogan.style.width = Math.ceil(single + 1) + "px";
          } else {
            slogan.style.width = available + "px";
            var style = getComputedStyle(slogan);
            var pad = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
            var range = document.createRange();
            range.selectNodeContents(slogan);
            var wrapped = lineMetrics(range);
            if (wrapped.widest) {
              slogan.style.width = Math.min(Math.ceil(wrapped.widest + pad + 1), available) + "px";
            }
          }

          fitLockup();
        }

        function fitLockup() {
          var slide = lockup.closest(".slide");
          var slides = slide.parentElement;
          var slideStyle = getComputedStyle(slide);
          var availableWidth =
            slide.clientWidth -
            parseFloat(slideStyle.paddingLeft) -
            parseFloat(slideStyle.paddingRight);
          var availableHeight =
            slide.clientHeight -
            parseFloat(slideStyle.paddingTop) -
            parseFloat(slideStyle.paddingBottom);

          lockup.style.transform = "none";
          var scale = Math.min(1, availableWidth / lockup.offsetWidth, availableHeight / lockup.offsetHeight);
          var shift = (window.innerWidth - slides.clientWidth) / 2;
          var transform = "";
          if (Math.abs(shift) > 0.5) transform += "translateX(" + shift + "px)";
          if (scale < 0.999) transform += (transform ? " " : "") + "scale(" + scale + ")";
          lockup.style.transform = transform || "none";
        }

        function lineMetrics(range) {
          var rects = range.getClientRects();
          var lines = [];
          for (var i = 0; i < rects.length; i++) {
            var rect = rects[i];
            if (rect.width <= 0 || rect.height <= 0) continue;
            var line = null;
            for (var j = 0; j < lines.length; j++) {
              var overlap = Math.min(lines[j].bottom, rect.bottom) - Math.max(lines[j].top, rect.top);
              if (overlap > Math.min(lines[j].bottom - lines[j].top, rect.height) * 0.5) {
                line = lines[j];
                break;
              }
            }
            if (!line) {
              lines.push({ top: rect.top, bottom: rect.bottom, left: rect.left, right: rect.right });
              continue;
            }
            line.top = Math.min(line.top, rect.top);
            line.bottom = Math.max(line.bottom, rect.bottom);
            line.left = Math.min(line.left, rect.left);
            line.right = Math.max(line.right, rect.right);
          }
          var widest = 0;
          for (var k = 0; k < lines.length; k++) {
            var width = lines[k].right - lines[k].left;
            if (width > widest) widest = width;
          }
          return { widest: widest, count: lines.length };
        }

          var height = size.height;

          if (widthChanged || heightChanged) {

        (function watchPanelSwitch() {
          var query = window.matchMedia("(max-width: calc(100dvh - 1.75rem))");
          var stacked = query.matches;
          var panels = [].slice.call(document.querySelectorAll(".slide-pair .panel"));
          function remember() {
            if (root.classList.contains("is-resizing")) return;
            panels.forEach(function (panel) {
              if (panel.style.transform || panel._moving) return;
              var slide = panel.closest(".slide");
              var sr = slide.getBoundingClientRect();
              var rect = panel.getBoundingClientRect();
              if (!sr.width || !sr.height) return;
              panel._spot = {
                x: (rect.left - sr.left) / sr.width,
                y: (rect.top - sr.top) / sr.height,
                s: rect.width / Math.min(sr.width, sr.height)
              };
            });
          }
          function frame() {
            remember();
            requestAnimationFrame(frame);
          }
          requestAnimationFrame(frame);
          query.addEventListener("change", function () {
            if (query.matches === stacked) return;
            stacked = query.matches;
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            var spots = panels.map(function (panel) { return panel._spot; });
            root.classList.add("is-resizing");
            requestAnimationFrame(function () {
              panels.forEach(function (panel, index) {
                var spot = spots[index];
                var slide = panel.closest(".slide");
                var sr = slide.getBoundingClientRect();
                var rect = panel.getBoundingClientRect();
                if (!spot || !sr.width || !sr.height) return;
                var dx = spot.x * sr.width - (rect.left - sr.left);
                var dy = spot.y * sr.height - (rect.top - sr.top);
                var startSize = (spot.s || rect.width / Math.min(sr.width, sr.height)) * Math.min(sr.width, sr.height);
                var grow = Math.max(0.4, Math.min(2.5, startSize / rect.width));
                var pad = 8;
                var visualLeft = rect.left - sr.left + dx;
                var visualTop = rect.top - sr.top + dy;
                var visualW = rect.width * grow;
                var visualH = rect.height * grow;
                if (visualLeft < pad) dx += pad - visualLeft;
                if (visualLeft + visualW > sr.width - pad) dx -= visualLeft + visualW - (sr.width - pad);
                if (visualTop < pad) dy += pad - visualTop;
                if (visualTop + visualH > sr.height - pad) dy -= visualTop + visualH - (sr.height - pad);
                panel.style.transition = "none";
                panel.style.transformOrigin = "0 0";
                panel.style.transform =
                  "translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px) scale(" + grow.toFixed(4) + ")";
              });
              requestAnimationFrame(function () {
                root.classList.remove("is-resizing");
                panels.forEach(function (panel) {
                  panel.style.transition =
                    "transform var(--panel-ms) var(--panel-ease), width var(--panel-ms) var(--panel-ease)";

                  clearTimeout(panel._moveTimer);

                    panel.style.transition = "";
                    panel.style.transformOrigin = "";

            panel.addEventListener("transitionend", function (event) {
              if (event.propertyName !== "transform") return;
              clearTimeout(panel._moveTimer);
              panel._moving = false;
              panel.style.transition = "";
              panel.style.transformOrigin = "";
            });
          });
        })();

        function hideChrome() {

          }

          function wrap(value, span) {
            return ((value % span) + span) % span;
          }

          function smooth(low, high, value) {
            var t = clamp((value - low) / (high - low), 0, 1);
            return t * t * (3 - 2 * t);
          }

          function seeded(seed) {
            return function () {
              seed = (seed + 0x6d2b79f5) | 0;
              var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          function lattice(octave, fx, fy) {
            var ix = Math.floor(fx);
            var iy = Math.floor(fy);
            var tx = fx - ix;
            var ty = fy - iy;
            tx = tx * tx * (3 - 2 * tx);
            ty = ty * ty * (3 - 2 * ty);
            var x0 = ix % octave.cols;
            var x1 = (x0 + 1) % octave.cols;
            var row0 = iy * octave.cols;
            var row1 = row0 + octave.cols;
            var grid = octave.grid;
            var top = grid[row0 + x0] + (grid[row0 + x1] - grid[row0 + x0]) * tx;
            var bottom = grid[row1 + x0] + (grid[row1 + x1] - grid[row1 + x0]) * tx;
            return top + (bottom - top) * ty;
          }

          function makeNoise(look) {
            var rand = seeded(look.seed);
            var octaves = [];
            var total = 0;
            for (var o = 0; o < 5; o++) {
              var cols = look.cells * Math.pow(2, o);
              var rows = Math.max(2, Math.round(cols * (look.height / look.width) * look.stretch));
              var grid = new Float32Array(cols * (rows + 1));
              for (var g = 0; g < grid.length; g++) grid[g] = rand();
              octaves.push({ cols: cols, rows: rows, grid: grid, amp: Math.pow(0.5, o) });
              total += Math.pow(0.5, o);
            }
            var texture = document.createElement("canvas");
            texture.width = look.width;
            texture.height = look.height;
            var paintNoise = texture.getContext("2d");
            var image = paintNoise.createImageData(look.width, look.height);
            for (var y = 0; y < look.height; y++) {
              var band = look.band(y / (look.height - 1));
              for (var x = 0; x < look.width; x++) {
                var n = 0;
                for (var k = 0; k < octaves.length; k++) {
                  var octave = octaves[k];
                  n += octave.amp * lattice(octave, (x / look.width) * octave.cols, (y / look.height) * octave.rows);
                }
                var i = (y * look.width + x) * 4;
                image.data[i] = look.color[0];
                image.data[i + 1] = look.color[1];
                image.data[i + 2] = look.color[2];
                image.data[i + 3] = Math.round(255 * band * smooth(look.low, look.high, n / total));
              }
            }
            paintNoise.putImageData(image, 0, 0);
            return texture;
          }

          function makeMist(layer) {
            return makeNoise({
              seed: layer.seed,
              cells: layer.cells,
              width: MIST_W,
              height: MIST_H,
              stretch: 2.4,
              color: [246, 248, 246],
              low: 0.38,
              high: 0.74,
              band: function (v) {
                return smooth(0, 0.42, v) * (1 - smooth(0.68, 1, v));
              }
            });
          }

          function resize() {
            width = bg.clientWidth;
            height = bg.clientHeight;
            if (!width || !height) return;
            dpr = Math.min(window.devicePixelRatio || 1, 1.5);
            unit = clamp(Math.min(width, height) / 900, 0.6, 1.3);
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            if (water) water.place(width, height, dpr);
            var fit = Math.max(width / PHOTO_W, height / PHOTO_H);
            var sunX = clamp((width - PHOTO_W * fit) / 2 + SUN_U * PHOTO_W * fit, width * 0.62, width * 0.97);
            var sunY = clamp((height - PHOTO_H * fit) / 2 + SUN_V * PHOTO_H * fit, -height * 0.06, height * 0.04);
            bg.style.setProperty("--sun-x", sunX.toFixed(1) + "px");
            bg.style.setProperty("--sun-y", sunY.toFixed(1) + "px");
          }

          function aimProgress() {
            var room = slides.scrollHeight - slides.clientHeight;
            return room > 0 ? clamp(slides.scrollTop / room, 0, 1) : 0;
          }

          function drawFx(k, camX, camY) {
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, width, height);

            var thin = k * (1 - 0.3 * progress);
            for (var m = 0; m < MISTS.length; m++) {
              var mist = MISTS[m];
              var tall = mist.h * height;
              var wide = (tall * MIST_W) / MIST_H;
              for (var s = 0; s < 2; s++) {
                var flip = s === 1;
                var top = mist.y * height + camY * mist.depth + Math.sin((clock * TAU) / (flip ? 21 : 15) + m * 1.7) * height * 0.02;
                var offset = camX * mist.depth - clock * mist.speed * (flip ? 0.4 : 1) * unit;
                ctx.globalAlpha = mist.alpha * thin * (flip ? 0.45 : 0.65) * (0.7 + 0.3 * Math.sin((clock * TAU) / (flip ? 13 : 9) + m));
                if (flip) ctx.setTransform(-dpr, 0, 0, dpr, width * dpr, 0);
                for (var x = wrap(flip ? -offset : offset, wide) - wide; x < width; x += wide) {
                  ctx.drawImage(textures[m], x, top, wide, tall);
                }
                if (flip) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
              }
            }
            ctx.globalAlpha = 1;
          }

          function hideEffects() {
            if (waterShown === "off") return;
            waterShown = "off";
            shown = -1;
            photo.style.filter = "";
            waterCanvas.style.filter = "";
            waterCanvas.style.opacity = "0";
            light.style.opacity = "0";
            warm.style.opacity = "0";
            grade.style.opacity = "0";
            sun.style.opacity = "0";
            rays[0].style.opacity = "0";
            rays[1].style.opacity = "0";
            rays[0].style.transform = "";
            rays[1].style.transform = "";
          }

          function paint() {
            var k = smooth(0, 1, ramp);
            var p = progress;
            var t = clock;
            var zoom = 1 + k * (0.14 + 0.03 * p + 0.01 * Math.sin((t * TAU) / 53));
            var camX = k * width * (-0.01 + 0.02 * p + 0.009 * Math.sin((t * TAU) / 47) - 0.008 * lookX);
            var camY = k * height * (0.042 - 0.084 * p + 0.008 * Math.sin((t * TAU) / 61 + 1.3) - 0.007 * lookY);
            var move = "translate3d(" + camX.toFixed(2) + "px, " + camY.toFixed(2) + "px, 0) scale(" + zoom.toFixed(4) + ")";
            for (var c = 0; c < cams.length; c++) cams[c].style.transform = move;
            if (sceneId() !== "valley") {
              hideEffects();
              return;
            }

            if (k !== shown) {
              shown = k;
              photo.style.filter = "saturate(" + (1 + 0.12 * k).toFixed(3) + ") contrast(" + (1 + 0.08 * k).toFixed(3) + ")";
              waterCanvas.style.filter = photo.style.filter;
              light.style.opacity = k.toFixed(3);
              grade.style.opacity = k.toFixed(3);
            }
            if (waterShown === "off") {
              waterShown = "";
              light.style.opacity = k.toFixed(3);
              grade.style.opacity = k.toFixed(3);
            }
            warm.style.opacity = (k * (0.7 + 0.3 * p)).toFixed(3);
            sun.style.opacity = ((0.72 + 0.2 * p) * (0.9 + 0.1 * Math.sin((t * TAU) / 9))).toFixed(3);
            rays[0].style.opacity = ((0.42 + 0.2 * p) * (0.85 + 0.15 * Math.sin((t * TAU) / 17 + 2))).toFixed(3);
            rays[0].style.transform = "rotate(" + (-1.6 * Math.sin((t * TAU) / 31 + 0.8)).toFixed(3) + "deg)";
            rays[1].style.opacity = ((0.52 + 0.25 * p) * (0.85 + 0.15 * Math.sin((t * TAU) / 13))).toFixed(3);
            rays[1].style.transform = "rotate(" + (1.2 * Math.sin((t * TAU) / 23)).toFixed(3) + "deg)";

            var flowing = !!water && !still.matches && water.draw(t, 1 + 0.2 * p);
            if (flowing && waterSince < 0) waterSince = t;
            var level = flowing ? (k * clamp((t - waterSince) / 1.2, 0, 1)).toFixed(3) : "0";
            if (level !== waterShown) {
              waterShown = level;
              waterCanvas.style.opacity = level;
            }

            drawFx(k, camX, camY);
          }

          function rest() {
            bg.classList.remove("is-live");
            for (var c = 0; c < cams.length; c++) cams[c].style.transform = "";
            photo.style.filter = "";
            waterCanvas.style.filter = "";
            waterCanvas.style.opacity = "";
            waterShown = "";
            light.style.opacity = "";
            warm.style.opacity = "";
            grade.style.opacity = "";
            shown = -1;
          }

          function loop(now) {
            frame = 0;
            if (document.hidden) return;
            var calm = still.matches;
            var dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
            last = now;
            ramp = calm ? (on ? 1 : 0) : clamp(ramp + (on ? dt : -dt) / RAMP, 0, 1);
            if (!on && !ramp) {
              rest();
              return;
            }
            if (calm) {
              progress = 0;
              lookX = 0;
              lookY = 0;
            } else {
              clock += dt;
              progress += (aimProgress() - progress) * (1 - Math.exp(-dt * 2.6));
              var glide = 1 - Math.exp(-dt * 2.2);
              lookX += (aimX - lookX) * glide;
              lookY += (aimY - lookY) * glide;
            }
            paint();
            noteZoom(ramp >= 1);
            if (!calm) frame = requestAnimationFrame(loop);
          }

          function wake() {
            if (frame || document.hidden || (!on && !ramp)) return;
            last = 0;
            frame = requestAnimationFrame(loop);
          }

          function set(next) {
            on = next;
            if (on && !bg.classList.contains("is-live")) {
              if (!textures) textures = MISTS.map(makeMist);
              bg.classList.add("is-live");
              resize();
              progress = aimProgress();
            }
            wake();
          }

          function enter() {
            ramp = still.matches ? 1 : 0;
            shown = -1;
            wake();
          }

          window.addEventListener(
            "pointermove",
            function (event) {
              if (event.pointerType !== "mouse") return;
              aimX = clamp((event.clientX / window.innerWidth) * 2 - 1, -1, 1);
              aimY = clamp((event.clientY / window.innerHeight) * 2 - 1, -1, 1);
            },
            { passive: true }
          );
          document.addEventListener("mouseout", function (event) {
            if (event.relatedTarget) return;
            aimX = 0;
            aimY = 0;
          });
          document.addEventListener("visibilitychange", wake);
          if (still.addEventListener) still.addEventListener("change", wake);
          new ResizeObserver(function () {
            if (!bg.classList.contains("is-live")) return;
            resize();
            if (ramp) paint();
            wake();
          }).observe(bg);

          return { set: set, enter: enter };
        }

        function startWater(canvas, photoW, photoH) {
          var BOX = [0.43, 0.455, 0.94, 0.605];
          var gl = canvas.getContext("webgl", {
            alpha: true,
            premultipliedAlpha: true,
            antialias: false,
            depth: false,
            stencil: false,
            powerPreference: "low-power"
          });
          if (!gl) return null;

          var photo = new Image();
          var mask = new Image();
          var loaded = 0;
          var ready = false;
          var visible = false;
          var quad = null;
          var uTime = null;
          var uGlint = null;
          var uRings = null;
          var rings = [[0, 0, -99], [0, 0, -99], [0, 0, -99]];
          var ringData = new Float32Array(12);
          var nextRing = 2;
          var spots = [];

          function compile(type, id) {
            var shader = gl.createShader(type);
            gl.shaderSource(shader, document.getElementById(id).textContent);
            gl.compileShader(shader);
            return gl.getShaderParameter(shader, gl.COMPILE_STATUS) ? shader : null;
          }

          function texture(unit, image) {
            gl.activeTexture(gl.TEXTURE0 + unit);
            gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
          }

          function setup() {
            ready = false;
            if (loaded < 2 || gl.isContextLost()) return;
            var vertex = compile(gl.VERTEX_SHADER, "water-vertex");
            var fragment = compile(gl.FRAGMENT_SHADER, "water-fragment");
            if (!vertex || !fragment) return;
            var program = gl.createProgram();
            gl.attachShader(program, vertex);
            gl.attachShader(program, fragment);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) return;
            gl.useProgram(program);
            try {
              gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.BROWSER_DEFAULT_WEBGL);
              texture(0, photo);
              gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
              texture(1, mask);
            } catch (error) {
              return;
            }
            gl.uniform1i(gl.getUniformLocation(program, "uPhoto"), 0);
            gl.uniform1i(gl.getUniformLocation(program, "uMask"), 1);
            gl.uniform2f(gl.getUniformLocation(program, "uSize"), photoW, photoH);
            uTime = gl.getUniformLocation(program, "uTime");
            uGlint = gl.getUniformLocation(program, "uGlint");
            uRings = gl.getUniformLocation(program, "uRings");
            gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
            var aPos = gl.getAttribLocation(program, "aPos");
            var aUv = gl.getAttribLocation(program, "aUv");
            gl.enableVertexAttribArray(aPos);
            gl.enableVertexAttribArray(aUv);
            gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 16, 0);
            gl.vertexAttribPointer(aUv, 2, gl.FLOAT, false, 16, 8);
            if (quad) gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
            ready = true;
          }

          function load() {
            loaded += 1;
            setup();
          }

          function findSpots() {
            var probe = document.createElement("canvas");
            probe.width = photoW / 4;
            probe.height = photoH / 4;
            var paintProbe = probe.getContext("2d");
            paintProbe.drawImage(mask, 0, 0, probe.width, probe.height);
            try {
              var data = paintProbe.getImageData(0, 0, probe.width, probe.height).data;
            } catch (error) {
              return;
            }
            for (var i = 0; i < data.length; i += 4) {
              if (data[i + 1] < 230) continue;
              var cell = i / 4;
              spots.push([(cell % probe.width) * 4 + 2, Math.floor(cell / probe.width) * 4 + 2]);
            }
          }

          function stir(time) {
            if (spots.length && time >= nextRing) {
              var slot = rings[0];
              for (var r = 1; r < rings.length; r++) {
                if (rings[r][2] < slot[2]) slot = rings[r];
              }
              var spot = spots[Math.floor(Math.random() * spots.length)];
              slot[0] = spot[0];
              slot[1] = spot[1];
              slot[2] = time;
              nextRing = time + 3.5 + Math.random() * 3.5;
            }
            for (var i = 0; i < rings.length; i++) {
              var age = time - rings[i][2];
              ringData[i * 4] = rings[i][0];
              ringData[i * 4 + 1] = rings[i][1];
              ringData[i * 4 + 2] = age;
              ringData[i * 4 + 3] = age >= 0 && age < 6 ? 1 : 0;
            }
          }

          function place(width, height, dpr) {
            var fit = Math.max(width / photoW, height / photoH);
            var shownW = photoW * fit;
            var shownH = photoH * fit;
            var left = (width - shownW) / 2;
            var top = (height - shownH) / 2;
            var x0 = Math.max(0, Math.floor(left + BOX[0] * shownW));
            var y0 = Math.max(0, Math.floor(top + BOX[1] * shownH));
            var x1 = Math.min(width, Math.ceil(left + BOX[2] * shownW));
            var y1 = Math.min(height, Math.ceil(top + BOX[3] * shownH));
            visible = x1 - x0 > 1 && y1 - y0 > 1;
            if (!visible) return;
            canvas.style.left = x0 + "px";
            canvas.style.top = y0 + "px";
            canvas.style.width = x1 - x0 + "px";
            canvas.style.height = y1 - y0 + "px";
            canvas.style.transformOrigin = width / 2 - x0 + "px " + (height / 2 - y0) + "px";
            canvas.width = Math.round((x1 - x0) * dpr);
            canvas.height = Math.round((y1 - y0) * dpr);
            var u0 = (x0 - left) / shownW;
            var u1 = (x1 - left) / shownW;
            var v0 = (y0 - top) / shownH;
            var v1 = (y1 - top) / shownH;
            quad = new Float32Array([-1, -1, u0, v1, 1, -1, u1, v1, -1, 1, u0, v0, 1, 1, u1, v0]);
            if (ready) gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
          }

          function draw(time, glint) {
            if (!ready || !visible) return false;
            stir(time);
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.uniform1f(uTime, time);
            gl.uniform1f(uGlint, glint);
            gl.uniform4fv(uRings, ringData);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            return true;
          }

          canvas.addEventListener("webglcontextlost", function (event) {
            event.preventDefault();
            ready = false;
          });
          canvas.addEventListener("webglcontextrestored", setup);
          photo.onload = load;
          mask.onload = function () {
            findSpots();
            load();
          };
          photo.src = "assets/background.jpg";
          mask.src = "assets/lake-mask.png";

          return { place: place, draw: draw };
        }
      })();
    </script>
  </body>
</html>
