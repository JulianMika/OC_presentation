    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="assets/favicon_0" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Saira+Stencil+One&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var lang = localStorage.getItem("oc-lang");
        localStorage.removeItem("oc-bg");
        document.documentElement.dataset.theme = "white";
        if (lang === "de" || lang === "en") {
          document.documentElement.dataset.lang = lang;
          document.documentElement.lang = lang === "de" ? "de" : "en";
        }
        document.documentElement.style.setProperty("--app-height", window.innerHeight + "px");
      })();
    </script>
    <style>
      @font-face {
        font-family: "Bauhaus 93";
        src: local("Bauhaus 93"), local("Bauhaus93"), local("Bauhaus 93 Regular");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Inter OC";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuI6fAZ9hiJ-Ek-_EeA.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Inter OC";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuFuYAZ9hiJ-Ek-_EeA.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        --widget: #fff;
        --ink: #111;
        --edge: #111;
        --glass: rgba(255, 255, 255, 0.48);
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
        --sans: "Inter", sans-serif;
        --app-height: 100dvh;
        --panel-ms: 0.85s;
        --panel-ease: cubic-bezier(0.4, 0, 0.2, 1);
      }

      html[data-theme="black"] {
        --widget: #111;
        --ink: #fff;
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }

      html[data-logo="light"] {
        --edge: #fff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        height: 100%;
        overflow: hidden;
        background: #1d2a1c;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }

      body {
        height: 100%;
        overflow: hidden;
        color: var(--ink);
        font-family: var(--sans);
      }

      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: #1d2a1c;
        pointer-events: none;
      }

      .bg > *,
      .bg-light > * {
        position: absolute;
        inset: 0;
      }

      .bg-photo {
        background: #1d2a1c url("assets/background.jpg") center / cover no-repeat;
      }

      html[data-bg="city"] .bg,
      html[data-bg="city"] .bg-photo {
        background-color: #07090d;
      }

      html[data-bg="city"] .bg-photo {
        background-image: url("assets/background-city.jpg");
      }

      html[data-bg="snow"] .bg,
      html[data-bg="snow"] .bg-photo {
        background-color: #d5e2ee;
      }

      html[data-bg="snow"] .bg-photo {
        background-image: url("assets/background-snow.jpg");
      }

      html[data-bg="forest"] .bg,
      html[data-bg="forest"] .bg-photo {
        background-color: #102418;
      }

      html[data-bg="forest"] .bg-photo {
        background-image: url("assets/background-forest.jpg");
      }

      .bg-water,
      .bg-fx,
      .bg-light,
      .bg-warm,
      .bg-grade {
        display: none;
        opacity: 0;
      }

      .bg.is-live .bg-water,
      .bg.is-live .bg-fx,
      .bg.is-live .bg-light,
      .bg.is-live .bg-warm,
      .bg.is-live .bg-grade {
        display: block;
      }

      html[data-bg="city"] .bg.is-live > :not(.bg-photo),
      html[data-bg="snow"] .bg.is-live > :not(.bg-photo),
      html[data-bg="forest"] .bg.is-live > :not(.bg-photo) {
        display: none;
      }

      .bg.is-live .bg-cam {
        will-change: transform;
      }

      .bg-water {
        right: auto;
        bottom: auto;
      }

      .bg-fx {
        width: 100%;
        height: 100%;
        opacity: 1;
      }

      .bg-light {
        mix-blend-mode: screen;
      }

      .bg-sun {
        background: radial-gradient(
          circle at var(--sun-x, 85%) var(--sun-y, 0%),
          rgba(255, 251, 238, 1) 0,
          rgba(255, 242, 210, 0.75) 5%,
          rgba(255, 226, 172, 0.34) 14%,
          rgba(255, 212, 150, 0.1) 28%,
          rgba(255, 212, 150, 0) 46%
        );
      }

      .bg-rays {
        transform-origin: var(--sun-x, 85%) var(--sun-y, 0%);
        background: conic-gradient(
          from 0deg at var(--sun-x, 85%) var(--sun-y, 0%),
          rgba(255, 238, 206, 0) 0deg 177.5deg,
          rgba(255, 238, 206, 0.18) 179.25deg,
          rgba(255, 238, 206, 0.5) 181deg,
          rgba(255, 238, 206, 0.18) 182.75deg,
          rgba(255, 238, 206, 0) 184.5deg 188.5deg,
          rgba(255, 238, 206, 0.11) 190.75deg,
          rgba(255, 238, 206, 0.32) 193deg,
          rgba(255, 238, 206, 0.11) 195.25deg,
          rgba(255, 238, 206, 0) 197.5deg 200.5deg,
          rgba(255, 238, 206, 0.2) 202deg,
          rgba(255, 238, 206, 0.58) 203.5deg,
          rgba(255, 238, 206, 0.2) 205deg,
          rgba(255, 238, 206, 0) 206.5deg 212deg,
          rgba(255, 238, 206, 0.13) 214.5deg,
          rgba(255, 238, 206, 0.36) 217deg,
          rgba(255, 238, 206, 0.13) 219.5deg,
          rgba(255, 238, 206, 0) 222deg 225.5deg,
          rgba(255, 238, 206, 0.18) 227deg,
          rgba(255, 238, 206, 0.5) 228.5deg,
          rgba(255, 238, 206, 0.18) 230deg,
          rgba(255, 238, 206, 0) 231.5deg 237.5deg,
          rgba(255, 238, 206, 0.1) 240.25deg,
          rgba(255, 238, 206, 0.28) 243deg,
          rgba(255, 238, 206, 0.1) 245.75deg,
          rgba(255, 238, 206, 0) 248.5deg 252deg,
          rgba(255, 238, 206, 0.15) 253.5deg,
          rgba(255, 238, 206, 0.42) 255deg,
          rgba(255, 238, 206, 0.15) 256.5deg,
          rgba(255, 238, 206, 0) 258deg 360deg
        );
        -webkit-mask-image: radial-gradient(
          circle at var(--sun-x, 85%) var(--sun-y, 0%),
          #000 0,
          rgba(0, 0, 0, 0.85) 25%,
          rgba(0, 0, 0, 0.4) 55%,
          rgba(0, 0, 0, 0) 85%
        );
        mask-image: radial-gradient(
          circle at var(--sun-x, 85%) var(--sun-y, 0%),
          #000 0,
          rgba(0, 0, 0, 0.85) 25%,
          rgba(0, 0, 0, 0.4) 55%,
          rgba(0, 0, 0, 0) 85%
        );
      }

      .bg-rays-back {
        background: conic-gradient(
          from 0deg at var(--sun-x, 85%) var(--sun-y, 0%),
          rgba(255, 228, 186, 0) 0deg 174deg,
          rgba(255, 228, 186, 0.12) 179.5deg,
          rgba(255, 228, 186, 0.34) 185deg,
          rgba(255, 228, 186, 0.12) 190.5deg,
          rgba(255, 228, 186, 0) 196deg 202deg,
          rgba(255, 228, 186, 0.09) 207.5deg,
          rgba(255, 228, 186, 0.26) 213deg,
          rgba(255, 228, 186, 0.09) 218.5deg,
          rgba(255, 228, 186, 0) 224deg 226deg,
          rgba(255, 228, 186, 0.1) 233deg,
          rgba(255, 228, 186, 0.3) 240deg,
          rgba(255, 228, 186, 0.1) 247deg,
          rgba(255, 228, 186, 0) 254deg 360deg
        );
      }

      .bg-warm {
        mix-blend-mode: soft-light;
        background:
          radial-gradient(
            circle at var(--sun-x, 85%) var(--sun-y, 0%),
            rgba(255, 186, 104, 0.95) 0,
            rgba(255, 196, 128, 0.45) 35%,
            rgba(255, 196, 128, 0) 75%
          ),
          linear-gradient(200deg, rgba(255, 196, 120, 0.5) 0%, rgba(255, 204, 140, 0) 50%, rgba(18, 58, 72, 0) 62%, rgba(18, 58, 72, 0.6) 100%);
      }

      .bg-grade {
        background:
          radial-gradient(130% 100% at 50% 42%, rgba(5, 14, 10, 0) 52%, rgba(5, 14, 10, 0.42) 100%),
          linear-gradient(180deg, rgba(5, 14, 10, 0) 64%, rgba(5, 14, 10, 0.24) 100%);
      }

      .slides {
        position: relative;
        z-index: 1;
        height: var(--app-height);
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y pinch-zoom;
      }

      .slide {
        position: relative;
        z-index: 1;
        height: var(--app-height);
        min-height: var(--app-height);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding:
          5.5rem
          calc(1.25rem + env(safe-area-inset-right, 0px))
          calc(2.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.25rem + env(safe-area-inset-left, 0px));
      }

      .lang-wrap {
        position: fixed;
        z-index: 3;
        top: calc(1.1rem + env(safe-area-inset-top, 0px));
        right: calc(0.9rem + env(safe-area-inset-right, 0px));
        display: flex;
        align-items: center;
        height: 2.75rem;
        pointer-events: auto;
      }

      .lang-button,
      .lang-option {
        appearance: none;
        -webkit-appearance: none;
        display: inline-block;
        box-sizing: border-box;
        width: max-content;
        max-width: 100%;
        padding: 0.55rem 1.15rem;
        color: #111;
        font-family: "Inter OC", "Inter", system-ui, sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        font-optical-sizing: none;
        -webkit-font-smoothing: auto;
        letter-spacing: 0.01em;
        text-align: left;
        background: var(--glass);
        border: none;
        border-radius: 999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .lang-button {
        display: inline-flex;
        align-items: center;
        height: 2.55rem;
        padding-top: 0;
        padding-bottom: 0;
        white-space: nowrap;
      }

      .background-option {
        appearance: none;
        -webkit-appearance: none;
        display: block;
        box-sizing: border-box;
        width: 8.25rem;
        height: 4.75rem;
        padding: 0.18rem;
        border: none;
        border-radius: 1.05rem;
        overflow: hidden;
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        line-height: 0;
      }

      .background-option img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 0.88rem;
        pointer-events: none;
      }

      .lang-wrap.is-open .lang-button,
      .background-wrap.is-open .background-button,
      .lang-option:hover,
      .lang-option:active,
      .lang-option:focus-visible,
      .lang-option.is-active,
      .background-option:hover,
      .background-option:active,
      .background-option:focus-visible,
      .background-option.is-active,
      .background-button:hover,
      .background-button:active,
      .background-button:focus-visible {
        background: #fff;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        outline: none;
      }

      .lang-menu,
      .background-menu {
        position: absolute;
        top: calc(100% + 0.55rem);
        left: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: max-content;
        gap: 0.45rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      html.lang-open .slides,
      html.bg-open .slides {
        visibility: hidden;
        pointer-events: none;
      }

      html.lang-open .lang-wrap,
      html.lang-open .background-wrap,
      html.bg-open .lang-wrap,
      html.bg-open .background-wrap {
        visibility: visible;
      }

      .lang-wrap,
      .background-wrap {
        visibility: hidden;
      }

      .lang-button,
      .background-button {
        opacity: 0;
        transition: opacity 0.7s ease;
      }

      html.is-chrome .lang-wrap,
      html.is-chrome .background-wrap,
      html.is-chrome-leave .lang-wrap,
      html.is-chrome-leave .background-wrap {
        visibility: visible;
      }

      html.is-chrome-leave .lang-wrap,
      html.is-chrome-leave .background-wrap {
        pointer-events: none;
      }

      html.is-chrome .lang-button,
      html.is-chrome .background-button {
        opacity: 1;
      }

      .background-wrap {
        position: fixed;
        z-index: 3;
        top: calc(1.1rem + env(safe-area-inset-top, 0px));
        left: calc(0.9rem + env(safe-area-inset-left, 0px));
        display: flex;
        align-items: center;
        height: 2.75rem;
        pointer-events: auto;
      }

      .background-button {
        appearance: none;
        -webkit-appearance: none;
        display: inline-flex;
        align-items: center;
        box-sizing: border-box;
        height: 2.55rem;
        padding: 0 1.15rem;
        color: #111;
        font-family: "Inter OC", "Inter", system-ui, sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        font-optical-sizing: none;
        -webkit-font-smoothing: auto;
        letter-spacing: 0.01em;
        white-space: nowrap;
        background: var(--glass);
        border: none;
        border-radius: 999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .lang-menu[hidden],
      .background-menu[hidden] {
        display: none;
      }

      .lang-option,
      .background-option {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.7s ease;
      }

      .lang-wrap.is-open .lang-option,
      .background-wrap.is-open .background-option {
        opacity: 1;
        pointer-events: auto;
      }

      @media (min-width: 768px) {
        .lang-wrap {
          top: calc(1.5rem + env(safe-area-inset-top, 0px));
          right: calc(1.85rem + env(safe-area-inset-right, 0px));
          height: 3rem;
        }

        .lang-button,
        .lang-option {
          padding: 0.65rem 1.35rem;
          font-size: 1.05rem;
        }

        .lang-button {
          height: 2.69rem;
          padding-top: 0;
          padding-bottom: 0;
        }

        .background-wrap {
          top: calc(1.5rem + env(safe-area-inset-top, 0px));
          left: calc(1.85rem + env(safe-area-inset-left, 0px));
          height: 3rem;
        }

        .background-button {
          height: 2.69rem;
          padding: 0 1.35rem;
          font-size: 1.05rem;
        }

        .background-option {
          width: 10.5rem;
          height: 6rem;
        }
      }

      .slide[data-slide="start"] {
        padding:
          calc(1.5rem + env(safe-area-inset-top, 0px))
          calc(1.5rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.5rem + env(safe-area-inset-left, 0px));
      }

      .lockup {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: max-content;
        max-width: 100%;
        transform-origin: center center;
      }

      .logo-widget {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        width: min(46.2vw, 242px);
        height: min(46.2vw, 242px);
        aspect-ratio: 1;
        overflow: hidden;
        background: transparent;
        border-radius: 50%;
      }

      .logo-widget > * {
        grid-area: 1 / 1;
      }

      .logo-flow {
        position: relative;
        z-index: 2;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .logo-widget img {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        -webkit-touch-callout: none;
        user-select: none;
      }

      html[data-theme="black"] .logo-widget img,
      html[data-logo="light"] .logo-widget img {
        filter: invert(1);
      }

      .slogan {
        margin-top: 2.3rem;
        width: fit-content;
        max-width: 100%;
        padding: 0.45rem 0.7rem;
        background: var(--glass);
        color: #111;
        border-radius: 0.75rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-family: var(--sans);
        font-size: clamp(1.9rem, 4.4vw, 2.3rem);
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.15;
        text-align: center;
        text-wrap: balance;
      }

      .slogan-mark {
        font-family: "Saira Stencil One", "Bauhaus 93", sans-serif;
        font-weight: 400;
        font-synthesis: none;
      }

      .slide-pair {
        align-items: center;
        justify-content: center;
        height: var(--app-height);
        padding: 0;
        container-type: size;
        transition: padding var(--panel-ms) var(--panel-ease);
      }

      .pair {
        --gap: 1.25rem;
        --edge-x: max(var(--gap), env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
        --edge-y: max(var(--gap), env(safe-area-inset-top, 0px), env(safe-area-inset-bottom, 0px));
        --s: min(
          calc((100cqw - 2 * var(--edge-x) - var(--gap)) / 2),
          calc(100cqh - 2 * var(--edge-y))
        );
        --g: max(var(--edge-x), calc((100cqw - 2 * var(--s)) / 3));
        position: relative;
        z-index: 1;
        align-self: stretch;
        width: 100%;
        height: 100%;
      }

      .panel {
        position: absolute;
        width: var(--s);
        height: var(--s);
        aspect-ratio: 1;
        top: calc(50% - var(--s) / 2);
        left: var(--g);
        overflow: hidden;
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 2px solid var(--edge);
        border-radius: 1.5rem;
        transition:
          width var(--panel-ms) var(--panel-ease),
          height var(--panel-ms) var(--panel-ease),
          left var(--panel-ms) var(--panel-ease),
          top var(--panel-ms) var(--panel-ease);
      }

      .panel:last-child {
        left: calc(100% - var(--g) - var(--s));
      }

      .panel-copy {
        --copy: clamp(0.805rem, calc(var(--s) * 0.0283), 1.38rem);
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding: calc(var(--s) * 0.062);
        color: #111;
        font-size: var(--copy);
        text-align: left;
        container-type: size;
      }

      .panel-title {
        font-family: "Bauhaus 93", "Saira Stencil One", sans-serif;
        font-weight: 400;
        font-synthesis: none;
        margin: 0 0 0.55em;
        font-size: 1.55em;
        line-height: 1.15;
      }

      .panel-text {
        font-family: "Inter OC", "Inter", system-ui, sans-serif;
        font-weight: 500;
        flex: 1 1 auto;

      attribute vec2 aPos;
      attribute vec2 aUv;
      varying vec2 vUv;

      void main() {
        vUv = aUv;
        gl_Position = vec4(aPos, 0.0, 1.0);

    <script type="x-shader/x-fragment" id="water-fragment">
      #ifdef GL_FRAGMENT_PRECISION_HIGH
      precision highp float;
      #else
      precision mediump float;
      #endif

      uniform sampler2D uPhoto;
      uniform sampler2D uMask;
      uniform vec2 uSize;
      uniform float uTime;
      uniform float uGlint;
      uniform vec4 uRings[3];
      varying vec2 vUv;

      float hash(vec2 cell) {
        return fract(sin(dot(cell, vec2(12.9898, 78.233))) * 43758.5453);
      }

      void main() {
        vec4 mask = texture2D(uMask, vUv);
        if (mask.r < 0.004) {
          gl_FragColor = vec4(0.0);
          return;
        }

        vec2 p = vUv * uSize;
        float t = uTime;
        float near = clamp((p.y - 354.0) / 104.0, 0.0, 1.0);
        float f = mix(1.3, 0.75, near);
        float a = p.y * f + t * 2.0 + sin(p.x * 0.05 + t * 0.3) * 2.0 + sin(p.x * 0.13 - t * 0.5) * 0.8;
        float b = p.y * f * 1.9 - t * 2.8 + p.x * 0.08;
        float c = p.x * 0.021 - p.y * 0.35 + t * 0.9;
        float wave = sin(a) * 0.6 + sin(b) * 0.3 + sin(c) * 0.1;
        float slope = cos(a) * 0.6 * f + cos(b) * 0.57 * f - cos(c) * 0.035;

        vec2 push = vec2(0.0);
        float ring = 0.0;
        for (int i = 0; i < 3; i++) {
          vec4 r = uRings[i];
          if (r.w <= 0.0) continue;
          vec2 d = (p - r.xy) * vec2(1.0, 2.6);
          float dist = length(d);
          float edge = dist - r.z * 9.0;
          float h = sin(edge * 1.8) * exp(-edge * edge / 14.0) * exp(-r.z * 0.45) * r.w;
          ring += h;
          push += vec2(d.x, d.y / 2.6) / max(dist, 0.001) * h;
        }

        float gust = 0.75 + 0.25 * sin(p.x * 0.012 - t * 0.25);
        float amp = mix(1.8, 3.4, near) * gust * mask.g;
        vec2 shift = vec2(0.35, 1.0) * wave * amp + push * 2.4 * mask.g;
        vec3 color = texture2D(uPhoto, vUv + shift / uSize).rgb;
        float patch = 0.55 + 0.45 * sin(p.x * 0.09 + sin(p.y * 0.21 + t * 0.4) * 1.5 + t * 0.6);
        color *= 1.0 + (slope * 0.065 * mix(0.6, 1.0, near) * gust * patch + ring * 0.15) * mask.g;

        vec2 grid = p / vec2(5.0, 2.5);
        vec2 cell = floor(grid);
        float seed = hash(cell);
        float jitter = hash(cell + 17.0);
        vec2 center = 0.34 + 0.32 * vec2(seed, jitter);
        float spot = smoothstep(0.34, 0.0, length((fract(grid) - center) * vec2(1.0, 1.8)));
        float flash = pow(max(0.0, sin(t * (1.0 + 2.0 * jitter) + seed * 40.0)), 10.0);
        float crest = smoothstep(0.0, 0.8, wave);
        float glint = spot * flash * crest * step(0.5, seed) * mask.g * uGlint;
        color = mix(color, vec3(0.95, 0.97, 1.0), clamp(glint * 1.4, 0.0, 1.0));

        gl_FragColor = vec4(color * mask.r, mask.r);
      }

        function artRandom(seed) {

            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

        function artIsObj(value) {

        }

        function artClone(value) {
          if (Array.isArray(value)) return value.map(artClone);
          if (artIsObj(value)) {
            var copyOf = {};
            Object.keys(value).forEach(function (key) {
              copyOf[key] = artClone(value[key]);

            return copyOf;
          }
          return value;
        }

          Object.keys(source).forEach(function (key) {
            var value = source[key];
            if (artIsObj(value)) {

              artMerge(target[key], value);
            } else {

            }

        }

            var now = current[key];
            if (typeof goal === "number") {

                current[key] = goal;
              } else if (ART_LINEAR[key]) {
                var reach = ART_LINEAR[key] * dt;
                current[key] = now + Math.max(-reach, Math.min(reach, goal - now));
              } else {
                current[key] = now + (goal - now) * k;
              }
            } else if (artIsObj(goal)) {
              if (!artIsObj(now)) current[key] = now = {};
              artApproach(now, goal, k, dt);
            } else {
              current[key] = goal;
            }

        }

              var sy = spot[1] + Math.cos(t * 5.9 + n.ph2) * 4.5;
              var e = smooth(n.learn);
              OUT.x = lerp(sx, OUT.x, e);
              OUT.y = lerp(sy, OUT.y, e);
            }
          }

          function spawnOrigin(g, p, n) {
            if (g.def.node === "human") {
              var parent = g.nodes[(n.i * 5 + 3) % Math.max(1, Math.floor(p.n - 1))];
              if (parent && parent.live && parent !== n && parent.al > 0.5) return { x: parent.x, y: parent.y };
            }
            return { x: p.x, y: p.y };
          }

          function updateCloud(g, dt, t, snap) {
            var p = S[g.id];
            g.on = p.a > 0.02;
            var sig = p.form + "|" + Math.round(p.sides || 0);
            if (sig !== g.sig) {
              if (g.sig && !snap) {
                g.nodes.forEach(function (n) {
                  n.fx = n.x;
                  n.fy = n.y;
                  n.m = 0;
                });
              }
              g.sig = sig;
            }
            var puzzleCount = (g.def.puzzle || []).length;
            var fade = snap ? 1 : Math.min(1, dt * 3.4);
            var learnRate = snap ? 1 : Math.min(1, dt * 2.2);
            g.list.length = 0;
            for (var i = 0; i < g.nodes.length; i++) {
              var n = g.nodes[i];
              var want;
              if (n.pz >= 0) {
                var solved = !!(p.puz && puzzleCount && p.puz.solved > (n.zr + 0.5) / puzzleCount);
                n.learn += ((solved ? 1 : 0) - n.learn) * learnRate;
                var keep = p.puz && p.puz.keep !== undefined ? clamp(p.puz.keep, 0, 1) : 1;
                want = solved ? keep : p.puz ? clamp(p.puz.a, 0, 1) : 0;
              } else {
                want = clamp(p.n - i, 0, 1);
              }
              if (want > 0.5 && !n.live) {
                n.live = true;
                if (!snap && n.pz < 0) {
                  var origin = spawnOrigin(g, p, n);
                  n.fx = origin.x;
                  n.fy = origin.y;
                  n.m = 0;
                } else {
                  n.m = 1;
                }
              }
              if (want < 0.03 && n.al < 0.03) n.live = false;
              n.al += (want - n.al) * fade;
              placeNode(g, p, n, t);
              if (n.m < 1) n.m = snap ? 1 : Math.min(1, n.m + dt / 1.1);
              var blend = n.m < 1 ? smooth(n.m) : 1;
              n.x = n.fx + (OUT.x - n.fx) * blend;
              n.y = n.fy + (OUT.y - n.fy) * blend;
              n.env = OUT.env;
              n.vis = n.al * n.env * (n.pz >= 0 ? (n.learn > 0.7 ? 1 : 0) : 1);
              if (n.vis > 0.3) g.list.push(n);
            }
          }

          function blocked(a, b, list, dx, dy) {
            var len2 = dx * dx + dy * dy;
            var reach = dotU * 2.2;
            for (var k = 0; k < list.length; k++) {
              var o = list[k];
              if (o === a || o === b) continue;
              var t = ((o.x - a.x) * dx + (o.y - a.y) * dy) / len2;
              if (t <= 0 || t >= 1) continue;
              var ox = a.x + t * dx - o.x;
              var oy = a.y + t * dy - o.y;
              if (ox * ox + oy * oy < reach * reach) return true;
            }
            return false;
          }

          function buildLinks() {
            clouds.forEach(function (g) {
              g.links.length = 0;
              g.nodes.forEach(function (n) {
                n.near.length = 0;
              });
            });
            ties.length = 0;
            clouds.forEach(function (g) {
              var p = S[g.id];
              if (!g.on || g.list.length < 2) return;
              var lk = p.lk === undefined ? 1 : p.lk;
              if (lk < 0.02) return;
              var reach = p.reach > 0 ? p.reach : clamp(Math.max(p.rx, p.ry) * 0.8, 70, 170);
              g.reach = reach;
              var list = g.list;
              for (var i = 0; i < list.length; i++) {
                for (var j = i + 1; j < list.length; j++) {
                  var a = list[i];
                  var b = list[j];
                  var dx = b.x - a.x;
                  var dy = b.y - a.y;
                  var d = Math.sqrt(dx * dx + dy * dy);
                  if (d >= reach || blocked(a, b, list, dx, dy)) continue;
                  g.links.push({ a: a, b: b, d: d, reach: reach });
                  a.near.push(b);
                  b.near.push(a);
                }
              }
            });
            var tie = S.ties || 0;
            if (tie < 0.02) return;
            for (var x = 0; x < clouds.length; x++) {
              for (var y = x + 1; y < clouds.length; y++) {
                var g1 = clouds[x];
                var g2 = clouds[y];
                if (!g1.on || !g2.on) continue;
                var cands = [];
                for (var m = 0; m < g1.list.length; m++) {
                  for (var q = 0; q < g2.list.length; q++) {
                    var dd = dist(g1.list[m], g2.list[q]);
                    if (dd < TIE_REACH) cands.push({ u: g1.list[m], v: g2.list[q], d: dd });
                  }
                }
                cands.sort(function (s, t) {
                  return s.d - t.d;
                });
                var used = [];
                for (var k = 0; k < cands.length && used.length < 8; k++) {
                  var c = cands[k];
                  if (used.indexOf(c.u) !== -1 || used.indexOf(c.v) !== -1) continue;
                  used.push(c.u);
                  used.push(c.v);
                  ties.push({ a: c.u, b: c.v, d: c.d, reach: TIE_REACH });
                  if (c.d < 170) {
                    c.u.near.push(c.v);
                    c.v.near.push(c.u);
                  }
                }
              }
            }
          }

          function nextHop(s, back) {
            var near = s.at.near;
            var options = near.filter(function (q) {
              return back || q !== s.from;
            });
            if (!options.length) options = near.slice();
            if (!options.length) return null;
            var reach = (s.g.reach || 120) * 1.3;
            var total = 0;
            var weights = options.map(function (q) {
              var d = dist(s.at, q) / reach;
              var w = Math.max(0.05, 1 - d * d);
              total += w;
              return w;
            });
            var pick = rand() * total;
            for (var i = 0; i < options.length; i++) {
              pick -= weights[i];
              if (pick <= 0) return options[i];
            }
            return options[options.length - 1];
          }

          function stepHops(dt) {
            clouds.forEach(function (g) {
              var p = S[g.id];
              if (!g.on) return;
              var want = Math.round(p.spk || 0);
              var have = 0;
              hops.forEach(function (s) {
                if (s.g === g && !s.leaving) have++;
              });
              g.spkAcc -= dt;
              if (have < want && g.spkAcc <= 0) {
                var pool = g.list.filter(function (n) {
                  return n.near.length > 0;
                });
                g.spkAcc = 0.45 + rand() * 0.5;
                if (pool.length) {
                  hops.push({
                    g: g,
                    at: pool[Math.floor(rand() * pool.length)],
                    from: null,
                    to: null,
                    t: 0,
                    wait: 0,
                    stuck: 0,
                    show: 0,
                    leaving: false,
                    life: 6 + rand() * 6
                  });
                }
              } else if (have > want) {
                for (var k = 0; k < hops.length; k++) {
                  if (hops[k].g === g && !hops[k].leaving) {
                    hops[k].leaving = true;
                    break;
                  }
                }
              }
            });
            hops.forEach(function (s) {
              s.show = s.leaving ? s.show - dt / 0.3 : Math.min(1, s.show + dt / 0.3);
              s.life -= dt;
              if (s.life <= 0) s.leaving = true;
              if (s.leaving) return;
              if (s.at.vis < 0.3 || !s.g.on) {
                s.leaving = true;
                return;
              }
              if (s.to) {
                if (s.to.vis < 0.3 || s.at.near.indexOf(s.to) === -1) {
                  s.leaving = true;
                  return;
                }
                s.t += (HOP_SPEED * dt) / Math.max(1, dist(s.at, s.to));
                if (s.t >= 1) {
                  s.from = s.at;
                  s.at = s.to;
                  s.to = null;
                  s.t = 0;
                  s.wait = HOP_PAUSE;
                }
                return;
              }
              s.wait -= dt;
              if (s.wait > 0) return;
              s.to = nextHop(s, (S[s.g.id].back || 0) > 0.5);
              if (s.to) {
                s.stuck = 0;
                return;
              }
              s.wait = 0.25;
              s.stuck += 1;
              if (s.stuck > 6) s.leaving = true;
            });
            hops = hops.filter(function (s) {
              return !s.leaving || s.show > 0;
            });
          }

          /* ---------- KI-Raster ---------- */
          function rasterPoint(p, cols, i, j) {
            var step = p.s / (cols - 1);
            return { x: p.x - p.s / 2 + i * step, y: p.y - p.s / 2 + j * step };
          }

          function stepRaster(g, dt, snap) {
            var p = S[g.id];
            g.on = p.a > 0.02;
            if (snap || !g.on) {
              g.sparks.length = 0;
              return;
            }
            var cols = g.def.cols;
            var want = Math.round(p.spk || 0);
            var alive = 0;
            g.sparks.forEach(function (s) {
              if (!s.leaving) alive++;
            });
            g.acc -= dt;
            if (alive < want && g.acc <= 0) {
              g.acc = 0.4 + rand() * 0.5;
              g.sparks.push({
                i: Math.floor(rand() * cols),
                j: Math.floor(rand() * cols),
                di: 0,
                dj: 0,
                ti: -1,
                tj: -1,
                t: 0,
                wait: 0,
                show: 0,
                leaving: false,
                life: 5 + rand() * 4
              });
            } else if (alive > want) {
              for (var k = 0; k < g.sparks.length; k++) {
                if (!g.sparks[k].leaving) {
                  g.sparks[k].leaving = true;
                  break;
                }
              }
            }
            g.sparks.forEach(function (s) {
              s.show = s.leaving ? s.show - dt / 0.3 : Math.min(1, s.show + dt / 0.3);
              s.life -= dt;
              if (s.life <= 0) s.leaving = true;
              if (s.leaving) return;
              if (s.ti >= 0) {
                s.t += dt * 4.2;
                if (s.t >= 1) {
                  s.di = s.ti - s.i;
                  s.dj = s.tj - s.j;
                  s.i = s.ti;
                  s.j = s.tj;
                  s.ti = -1;
                  s.tj = -1;
                  s.t = 0;
                  s.wait = 0.08;
                }
                return;
              }
              s.wait -= dt;
              if (s.wait > 0) return;
              var moves = [
                [1, 0],
                [-1, 0],
                [0, 1],
                [0, -1]
              ].filter(function (m) {
                var ni = s.i + m[0];
                var nj = s.j + m[1];
                var back = (s.di || s.dj) && m[0] === -s.di && m[1] === -s.dj;
                return ni >= 0 && nj >= 0 && ni < cols && nj < cols && !back;
              });
              if (!moves.length) {
                s.leaving = true;
                return;
              }
              var straight = moves.filter(function (m) {
                return m[0] === s.di && m[1] === s.dj;
              });
              var pick = straight.length && rand() < 0.5 ? straight[0] : moves[Math.floor(rand() * moves.length)];
              s.ti = s.i + pick[0];
              s.tj = s.j + pick[1];
            });
            g.sparks = g.sparks.filter(function (s) {
              return !s.leaving || s.show > 0;
            });
          }

          /* ---------- Ziele und Funkenfluege ---------- */
          function anchorAt(ref) {
            if (!ref) return null;
            if (ref.charAt(0) === "@") {
              var xy = ref.slice(1).split(",");
              return { x: +xy[0], y: +xy[1], fixed: true };
            }
            if (ref.indexOf("grid:") === 0) {
              var pat = patterns[ref.slice(5)];
              if (!pat || !gridOn) return null;
              return { gi: pat.idx[Math.floor(rand() * pat.idx.length)], x: 0, y: 0 };
            }
            if (ref.indexOf("grid@") === 0) {
              if (!grid || !gridOn) return null;
              var q = ref.slice(5).split(",");
              var px = +q[0];
              var py = +q[1];
              var pr = +q[2];
              var near = [];
              for (var i = 0; i < gx.length; i++) {
                var ddx = gx[i] - px;
                var ddy = gy[i] - py;
                if (gal[i] > 0.5 && ddx * ddx + ddy * ddy < pr * pr) near.push(i);
              }
              if (!near.length) return null;
              return { gi: near[Math.floor(rand() * near.length)], x: 0, y: 0 };
            }
            var wedge = ref.slice(-6) === ":wedge";
            var center = wedge || ref.slice(-1) === "@";
            var id = wedge ? ref.slice(0, -6) : center ? ref.slice(0, -1) : ref;
            var group = byId[id];
            if (!group) return null;
            if (center) return { cg: id, wedge: wedge, x: 0, y: 0 };
            if (group.kind !== "cloud" || !group.list.length) return null;
            return { node: group.list[Math.floor(rand() * group.list.length)], x: 0, y: 0 };
          }

          function readAnchor(an) {
            if (an.node) {
              an.x = an.node.x + (an.ox || 0);
              an.y = an.node.y + (an.oy || 0);
            } else if (an.gi !== undefined) {
              an.x = gdx[an.gi];
              an.y = gdy[an.gi];
            } else if (an.cg) {
              var q = S[an.cg];
              an.x = q.x + (an.wedge ? q.rx * 0.62 : 0);
              an.y = q.y;
            }
          }

          function spawnFlyer(from, to, bounce) {
            if (flyers.length > 36) return;
            var a = typeof from === "string" ? anchorAt(from) : from;
            var b = typeof to === "string" ? anchorAt(to) : to;
            if (!a || !b) return;
            if (a.node && a.node === b.node && a.ox === undefined) return;
            readAnchor(a);
            readAnchor(b);
            var d = Math.sqrt((b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y));
            flyers.push({ a: a, b: b, t: 0, dur: 0.9 + d / 620, bend: (rand() - 0.5) * 0.3, bounce: bounce });
          }

          function flyPos(f, s) {
            var dx = f.b.x - f.a.x;
            var dy = f.b.y - f.a.y;
            var d = Math.sqrt(dx * dx + dy * dy) || 1;
            var bend = f.bend * d * Math.sin(Math.PI * s);
            return { x: f.a.x + dx * s - (dy / d) * bend, y: f.a.y + dy * s + (dx / d) * bend };
          }

          function stepFeeds(dt) {
            var feeds = S.feeds || {};
            Object.keys(feeds).forEach(function (id) {
              var f = feeds[id];
              if (!(f.rate > 0.02) || !f.from || !f.to) return;
              feedAcc[id] = (feedAcc[id] || 0) + dt * f.rate;
              if (feedAcc[id] >= 1) {
                feedAcc[id] -= 1;
                spawnFlyer(f.from, f.to, (f.bounce || 0) > 0.5);
              }
            });
            for (var i = flyers.length - 1; i >= 0; i--) {
              var f2 = flyers[i];
              f2.t += dt / f2.dur;
              readAnchor(f2.a);
              readAnchor(f2.b);
              if (f2.t >= 1) {
                pulses.push({ x: f2.b.x, y: f2.b.y, t: 0 });
                if (f2.bounce) {
                  flyers.push({ a: f2.b, b: f2.a, t: 0, dur: f2.dur, bend: -f2.bend, bounce: false });
                }
                flyers.splice(i, 1);
              }
            }
            for (var k = pulses.length - 1; k >= 0; k--) {
              pulses[k].t += dt / 0.7;
              if (pulses[k].t >= 1) pulses.splice(k, 1);
            }
          }

          function stepSense(dt) {
            clouds.forEach(function (g) {
              var p = S[g.id];
              if (!g.on || !(p.sense > 0.02) || !g.list.length || !p.arc) return;
              g.senseAcc += dt * p.sense;
              if (g.senseAcc < 1) return;
              g.senseAcc -= 1;
              var n = g.list[Math.floor(rand() * g.list.length)];
              var dir = g.def.arcDir !== undefined ? g.def.arcDir : Math.atan2(n.y - p.y, n.x - p.x);
              var far = p.arc.r * 1.9;
              spawnFlyer(
                { node: n, ox: Math.cos(dir) * far, oy: Math.sin(dir) * far, x: 0, y: 0 },
                { node: n, x: 0, y: 0 },
                false
              );
            });
          }

          /* ---------- Zeichnen ---------- */
          var cssW = 0;
          var unit = 1;
          var dotU = 6;
          var lineU = 1.4;
          var sparkU = 3.8;
          var rimU = 1.2;
          var baseScale = 1;

          function dimOf(id) {
            if (!focusSet || focusMix < 0.01) return 1;
            return focusSet[id] ? 1 : 1 - 0.4 * focusMix;
          }

          function dot(x, y, r) {
            ctx.beginPath();
            ctx.arc(x, y, Math.max(0.1, r), 0, TAU);
            ctx.fill();
          }

          function ringAt(x, y, r) {
            ctx.beginPath();
            ctx.arc(x, y, Math.max(0.1, r), 0, TAU);
            ctx.stroke();
          }

          function seg(x1, y1, x2, y2) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
          }

          function roundedRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
          }

          function drawSpark(x, y, a, fill, rim) {
            if (a < 0.02) return;
            ctx.globalAlpha = Math.min(1, a);
            ctx.fillStyle = rim;
            dot(x, y, sparkU + rimU);
            ctx.fillStyle = fill;
            dot(x, y, sparkU);
          }

          function drawGrid() {
            var p = S.grid;
            var a0 = p.a * dimOf("grid");
            var base = dotU * 0.5;
            var order = p.order || 0;
            var i;
            ctx.fillStyle = "#111";
            for (i = 0; i < gx.length; i++) {
              var al = gal[i];
              if (al < 0.02) continue;
              var lit = glit[i];
              var boost = order > 0.01 ? clamp((order * 1.5 - gx[i] / 1000) * 4, 0, 1) : 0;
              ctx.globalAlpha = Math.min(1, a0 * al * (0.34 + 0.55 * lit + 0.3 * boost));
              dot(gdx[i], gdy[i], base * (1 + lit * 1.3 + boost * 0.45));
            }
            ctx.strokeStyle = "#111";
            ctx.lineWidth = lineU;
            var total = gx.length;
            var mesh = (p.mesh || 0) * a0;
            if (mesh > 0.02) {
              for (i = 0; i < total; i++) {
                if (gwarp[i] < 2) continue;
                if ((i % gcols) + 1 < gcols) meshLine(i, i + 1, mesh);
                if (i + gcols < total) meshLine(i, i + gcols, mesh);
              }
            }
            Object.keys(patterns).forEach(function (id) {
              var value = p.lit ? p.lit[id] || 0 : 0;
              if (value < 0.02) return;
              ctx.globalAlpha = Math.min(1, value * a0 * 0.5);
              patterns[id].edges.forEach(function (e) {
                var u = patterns[id].idx[e[0]];
                var v = patterns[id].idx[e[1]];
                seg(gdx[u], gdy[u], gdx[v], gdy[v]);
              });
            });
            var count = gx.length;
            Object.keys(p.net || {}).forEach(function (id) {
              var net = p.net[id];
              if (!(net.a > 0.02) || !(net.r > 10)) return;
              for (var k = 0; k < count; k++) {
                if ((k % gcols) + 1 < gcols) netLine(k, k + 1, net, a0);
                if (k + gcols < count) netLine(k, k + gcols, net, a0);
              }
            });
          }

          function meshLine(i, j, a0) {
            var m = Math.min(gwarp[i], gwarp[j]);
            if (m < 2) return;
            var al = a0 * Math.min(1, m / 24) * 0.3 * Math.min(gal[i], gal[j]);
            if (al < 0.02) return;
            ctx.globalAlpha = al;
            seg(gdx[i], gdy[i], gdx[j], gdy[j]);
          }

          function netLine(i, j, net, a0) {
            var mx = (gdx[i] + gdx[j]) / 2;
            var my = (gdy[i] + gdy[j]) / 2;
            var dm = Math.sqrt((mx - net.x) * (mx - net.x) + (my - net.y) * (my - net.y)) / net.r;
            if (dm >= 1) return;
            var al = net.a * a0 * Math.min(gal[i], gal[j]) * (1 - dm * dm * dm) * 0.55;
            if (al < 0.02) return;
            ctx.globalAlpha = al;
            seg(gdx[i], gdy[i], gdx[j], gdy[j]);
          }

          function drawReality(g) {
            var p = S[g.id];
            var c = p.circ;
            if (!c || c.a < 0.02) return;
            var prog = clamp(c.draw, 0, 1);
            if (prog < 0.01) return;
            var a = c.a * dimOf(g.id);
            ctx.save();
            ctx.globalAlpha = a * 0.16 * smooth(prog * 1.3 - 0.3);
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.max(1, c.r), 0, TAU);
            ctx.fill();
            ctx.globalAlpha = Math.min(1, a * 0.8);
            ctx.strokeStyle = "#111";
            ctx.lineWidth = lineU * 1.15;
            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.max(1, c.r), -Math.PI / 2, -Math.PI / 2 + TAU * prog);
            ctx.stroke();
            ctx.restore();
          }

          function drawDeco(g) {
            var p = S[g.id];
            var d = p.deco;
            if (!d || (d.c < 0.02 && d.w < 0.02) || p.rx < 5) return;
            var dim = dimOf(g.id);
            var prog = clamp(d.draw, 0, 1);
            var scaleLogo = p.rx / 512;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.scale(scaleLogo, scaleLogo);
            ctx.translate(-512, -512);
            if (d.c > 0.02 && prog > 0.01) {
              ctx.strokeStyle = "#111";
              ctx.globalAlpha = Math.min(1, d.c * dim * 0.9);
              ctx.lineWidth = Math.max(20.5 * d.k, (lineU * 1.1) / scaleLogo);
              ctx.beginPath();
              ctx.arc(512, 512, 501.54, -Math.PI / 2, -Math.PI / 2 + TAU * prog);
              ctx.stroke();
              ctx.lineWidth = Math.max(20.2 * d.k, (lineU * 1.1) / scaleLogo);
              ctx.beginPath();
              ctx.arc(512, 512, 192.19, -Math.PI / 2, -Math.PI / 2 + TAU * prog);
              ctx.stroke();
            }
            if (d.w > 0.02 && wedgePath) {
              ctx.globalAlpha = Math.min(1, d.w * dim);
              ctx.fillStyle = "#111";
              ctx.fill(wedgePath);
            }
            ctx.restore();
          }

          function carrying(L) {
            for (var i = 0; i < hops.length; i++) {
              var s = hops[i];
              if (s.to && ((s.at === L.a && s.to === L.b) || (s.at === L.b && s.to === L.a))) return true;
            }
            return false;
          }

          function drawInk(g, ink, glow) {
            var p = S[g.id];
            var ga = p.a * dimOf(g.id);
            var boost = focusSet && focusSet[g.id] ? 1 + 0.2 * focusMix : 1;
            var human = g.def.node === "human";
            var lk = p.lk === undefined ? 1 : p.lk;
            var i;
            var n;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            if (p.outline > 0.02) {
              ctx.strokeStyle = ink;
              ctx.lineWidth = lineU;
              ctx.globalAlpha = Math.min(1, p.outline * ga * 0.7);
              ctx.beginPath();
              if (p.form === "poly") {
                var sides = Math.max(3, Math.round(p.sides));
                for (i = 0; i <= sides; i++) {
                  var av = (i / sides) * TAU - Math.PI / 2;
                  put(p, Math.cos(av) * p.rx, Math.sin(av) * p.ry);
                  if (i) ctx.lineTo(OUT.x, OUT.y);
                  else ctx.moveTo(OUT.x, OUT.y);
                }
              } else if (g.list.length > 2) {
                var around = g.list.slice().sort(function (u, v) {
                  return Math.atan2(u.y - p.y, u.x - p.x) - Math.atan2(v.y - p.y, v.x - p.x);
                });
                for (i = 0; i < around.length; i++) {
                  if (i) ctx.lineTo(around[i].x, around[i].y);
                  else ctx.moveTo(around[i].x, around[i].y);
                }
                ctx.closePath();
              }
              ctx.stroke();
            }

            if (human) {
              var sp = p.spoke;
              var pc = p.pc;
              var arc = p.arc;
              for (i = 0; i < g.nodes.length; i++) {
                n = g.nodes[i];
                var na = ga * n.al * n.env;
                if (na < 0.03) continue;
                if (sp && sp.a > 0.02) {
                  var vx = sp.x - n.x;
                  var vy = sp.y - n.y;
                  var vd = Math.sqrt(vx * vx + vy * vy) || 1;
                  var from = dotU * 2.8;
                  var to = Math.max(from, vd - (sp.stop || 0));
                  ctx.strokeStyle = ink;
                  ctx.lineWidth = lineU;
                  ctx.globalAlpha = Math.min(1, sp.a * na * 0.5);
                  seg(n.x + (vx / vd) * from, n.y + (vy / vd) * from, n.x + (vx / vd) * to, n.y + (vy / vd) * to);
                }
                if (pc && pc.a > 0.02) {
                  var vary = pc.vary || 0;
                  var er = pc.r * lerp(1, n.scale, vary);
                  var ea = lerp(1, n.aspect, vary);
                  var tilt = vary * n.tilt;
                  ctx.strokeStyle = ink;
                  ctx.lineWidth = lineU * 1.1;
                  ctx.globalAlpha = Math.min(1, pc.a * na * 0.75);
                  ctx.beginPath();
                  ctx.ellipse(n.x, n.y, er, er * ea, tilt, 0, TAU);
                  ctx.stroke();
                  if (pc.orb > 0.02) {
                    var oa = clock * n.w * 4.5 + n.ph;
                    var ox = Math.cos(oa) * er;
                    var oy = Math.sin(oa) * er * ea;
                    drawSpark(
                      n.x + ox * Math.cos(tilt) - oy * Math.sin(tilt),
                      n.y + ox * Math.sin(tilt) + oy * Math.cos(tilt),
                      pc.orb * na,
                      glow,
                      ink
                    );
                  }
                }
                if (arc && arc.a > 0.02) {
                  var dir = g.def.arcDir !== undefined ? g.def.arcDir : Math.atan2(n.y - p.y, n.x - p.x);
                  var span = 0.5;
                  var r0 = arc.r0 !== undefined ? arc.r0 : dotU * 2.8;
                  ctx.strokeStyle = ink;
                  ctx.lineWidth = lineU * 1.3;
                  ctx.globalAlpha = Math.min(1, arc.a * na * 0.85);
                  ctx.beginPath();
                  ctx.moveTo(n.x + Math.cos(dir - span) * r0, n.y + Math.sin(dir - span) * r0);
                  ctx.lineTo(n.x + Math.cos(dir - span) * arc.r, n.y + Math.sin(dir - span) * arc.r);
                  ctx.arc(n.x, n.y, arc.r, dir - span, dir + span);
                  ctx.lineTo(n.x + Math.cos(dir + span) * r0, n.y + Math.sin(dir + span) * r0);
                  ctx.stroke();
                }
              }
            }

            ctx.strokeStyle = ink;
            ctx.lineWidth = lineU;
            var mirrorK = g.mirror && p.mir ? p.mir.k : 0;
            g.links.forEach(function (L) {
              var f = L.d / L.reach;
              var al = 0.85 * (1 - f * f) * Math.min(L.a.vis, L.b.vis) * lk * ga;
              if (carrying(L)) al = Math.max(al, 0.5 * ga);
              if (mirrorK > 0.01 && (L.a.i >= g.mirror.length || L.b.i >= g.mirror.length)) al *= 1 - 0.5 * mirrorK;
              if (al < 0.02) return;
              ctx.globalAlpha = Math.min(1, al * boost);
              seg(L.a.x, L.a.y, L.b.x, L.b.y);
            });

            var mir = p.mir;
            if (g.mirror && mir && mir.k > 0.02) {
              ctx.lineWidth = lineU * 1.8;
              patterns[g.def.mirror].edges.forEach(function (e) {
                var u = g.nodes[e[0]];
                var v = g.nodes[e[1]];
                if (!u || !v) return;
                ctx.globalAlpha = Math.min(1, mir.k * ga * Math.min(u.vis, v.vis) * 0.9);
                seg(u.x, u.y, v.x, v.y);
              });
            }

            var rad = dotU * boost * (human ? 1.2 : 1);
            for (i = 0; i < g.nodes.length; i++) {
              n = g.nodes[i];
              var a = ga * n.al * n.env;
              if (a < 0.02) continue;
              if (n.pz >= 0 && n.learn < 0.98) {
                ctx.globalAlpha = Math.min(1, a * (1 - n.learn));
                ctx.fillStyle = "rgba(255,255,255,0.55)";
                ctx.strokeStyle = ink;
                ctx.lineWidth = lineU * 1.3;
                ctx.beginPath();
                ctx.arc(n.x, n.y, rad * 1.3, 0, TAU);
                ctx.fill();
                ctx.stroke();
              }
              var solid = n.pz >= 0 ? n.learn : 1;
              if (mirrorK > 0.01 && n.pz < 0 && n.i >= g.mirror.length) solid *= 1 - 0.25 * mirrorK;
              if (solid > 0.02) {
                ctx.globalAlpha = Math.min(1, a * solid);
                ctx.fillStyle = ink;
                dot(n.x, n.y, rad);
                if (human) {
                  ctx.strokeStyle = ink;
                  ctx.lineWidth = lineU * 1.1;
                  ctx.globalAlpha = Math.min(1, a * solid * 0.75);
                  ringAt(n.x, n.y, rad * 2.1);
                }
              }
            }

            hops.forEach(function (s) {
              if (s.g !== g) return;
              var x = s.at.x;
              var y = s.at.y;
              var seen = s.at.vis;
              if (s.to) {
                x = lerp(s.at.x, s.to.x, s.t);
                y = lerp(s.at.y, s.to.y, s.t);
                seen = lerp(s.at.vis, s.to.vis, s.t);
              }
              drawSpark(x, y, clamp(s.show * seen, 0, 1) * ga, glow, ink);
            });
          }

          function drawCloud(g) {
            var p = S[g.id];
            if (!g.on) return;
            var d = p.deco;
            if (d && d.w > 0.05 && openPath && wedgePath) {
              var scaleLogo = p.rx / 512;
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.scale(scaleLogo, scaleLogo);
              ctx.translate(-512, -512);
              ctx.clip(openPath, "evenodd");
              ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
              drawInk(g, "#111", "#fff");
              ctx.restore();
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.scale(scaleLogo, scaleLogo);
              ctx.translate(-512, -512);
              ctx.clip(wedgePath);
              ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
              drawInk(g, "#fff", "#111");
              ctx.restore();
              return;
            }
            drawInk(g, "#111", "#fff");
          }

          function drawTies() {
            var tie = S.ties || 0;
            if (tie < 0.02 || !ties.length) return;
            ctx.strokeStyle = "#111";
            ctx.lineWidth = lineU;
            ties.forEach(function (L) {
              var f = L.d / L.reach;
              var al = 0.6 * Math.pow(1 - f * f, 1.5) * tie * Math.min(L.a.vis, L.b.vis);
              if (al < 0.02) return;
              ctx.globalAlpha = Math.min(1, al);
              seg(L.a.x, L.a.y, L.b.x, L.b.y);
            });
          }

          function drawRaster(g) {
            var p = S[g.id];
            if (!g.on) return;
            var ga = p.a * dimOf(g.id);
            var cols = g.def.cols;
            var step = p.s / (cols - 1);
            var x0 = p.x - p.s / 2;
            var y0 = p.y - p.s / 2;
            var pad = step * 0.75;
            var i;
            var j;
            ctx.strokeStyle = "#111";
            ctx.lineWidth = lineU;
            ctx.fillStyle = "#fff";
            roundedRect(x0 - pad, y0 - pad, p.s + 2 * pad, p.s + 2 * pad, step * 0.5);
            ctx.globalAlpha = Math.min(1, ga * 0.5);
            ctx.fill();
            ctx.globalAlpha = Math.min(1, ga * 0.6);
            ctx.stroke();
            ctx.globalAlpha = Math.min(1, ga * 0.22);
            ctx.beginPath();
            for (i = 0; i < cols; i++) {
              ctx.moveTo(x0 + i * step, y0);
              ctx.lineTo(x0 + i * step, y0 + p.s);
              ctx.moveTo(x0, y0 + i * step);
              ctx.lineTo(x0 + p.s, y0 + i * step);
            }
            ctx.stroke();
            ctx.fillStyle = "#111";
            ctx.globalAlpha = Math.min(1, ga * 0.9);
            for (i = 0; i < cols; i++) {
              for (j = 0; j < cols; j++) dot(x0 + i * step, y0 + j * step, dotU * 0.7);
            }
            g.sparks.forEach(function (s) {
              var a = rasterPoint(p, cols, s.i, s.j);
              var x = a.x;
              var y = a.y;
              if (s.ti >= 0) {
                var b = rasterPoint(p, cols, s.ti, s.tj);
                x = lerp(a.x, b.x, s.t);
                y = lerp(a.y, b.y, s.t);
              }
              drawSpark(x, y, s.show * ga, "#fff", "#111");
            });
          }

          function bezier(p0, p1, p2, p3, u) {
            var v = 1 - u;
            return {
              x: v * v * v * p0.x + 3 * v * v * u * p1.x + 3 * v * u * u * p2.x + u * u * u * p3.x,
              y: v * v * v * p0.y + 3 * v * v * u * p1.y + 3 * v * u * u * p2.y + u * u * u * p3.y
            };
          }

          function drawStream(g) {
            var p = S[g.id];
            g.on = p.a > 0.02 && p.draw > 0.01;
            if (!g.on) return;
            var from = byId[g.def.from];
            var to = S[g.def.to];
            if (!from || !to) return;
            var ga = p.a * dimOf(g.id);
            var prog = clamp(p.draw, 0, 1);
            var end = p.end || 150;
            var count = g.def.dots || 4;
            from.nodes.forEach(function (n) {
              var na = n.al * n.env;
              if (na < 0.1) return;
              var p0 = { x: n.x, y: n.y + (g.def.startGap || 60) };
              var vx = p0.x - to.x;
              var vy = p0.y - to.y;
              var vd = Math.sqrt(vx * vx + vy * vy) || 1;
              var p3 = { x: to.x + (vx / vd) * end, y: to.y + (vy / vd) * end };
              var dy = p3.y - p0.y;
              var p1 = { x: p0.x, y: p0.y + dy * 0.55 };
              var p2 = { x: p3.x + (p0.x - p3.x) * 0.25, y: p3.y - Math.abs(dy) * 0.3 };
              ctx.strokeStyle = "#111";
              ctx.lineWidth = lineU;
              ctx.globalAlpha = Math.min(1, ga * na * 0.4);
              ctx.beginPath();
              for (var s = 0; s <= 20; s++) {
                var q = bezier(p0, p1, p2, p3, (s / 20) * prog);
                if (s) ctx.lineTo(q.x, q.y);
                else ctx.moveTo(q.x, q.y);
              }
              ctx.stroke();
              ctx.fillStyle = "#111";
              for (var k = 0; k < count; k++) {
                var u = (k / count + clock * 0.1 + n.i * 0.19) % 1;
                var env = Math.min(1, u / 0.1, (1 - u) / 0.1);
                var pos = bezier(p0, p1, p2, p3, u * prog);
                ctx.globalAlpha = Math.min(1, ga * na * (p.flow === undefined ? 1 : p.flow) * env);
                dot(pos.x, pos.y, dotU * 0.75);
              }
            });
          }

          function drawFlyers() {
            flyers.forEach(function (f) {
              var s = smooth(f.t);
              var env = Math.sin(Math.PI * clamp(f.t, 0, 1));
              ctx.strokeStyle = "#111";
              ctx.lineWidth = lineU;
              ctx.globalAlpha = 0.28 * env;
              ctx.beginPath();
              for (var k = 0; k <= 14; k++) {
                var q = flyPos(f, k / 14);
                if (k) ctx.lineTo(q.x, q.y);
                else ctx.moveTo(q.x, q.y);
              }
              ctx.stroke();
              var g1 = flyPos(f, Math.max(0, s - 0.1));
              var g2 = flyPos(f, Math.max(0, s - 0.05));
              drawSpark(g1.x, g1.y, env * 0.25, "#fff", "#111");
              drawSpark(g2.x, g2.y, env * 0.45, "#fff", "#111");
              var pos = flyPos(f, s);
              drawSpark(pos.x, pos.y, Math.min(1, env * 3), "#fff", "#111");
            });
          }

          function drawPulses() {
            ctx.strokeStyle = "#111";
            ctx.lineWidth = lineU;
            pulses.forEach(function (u) {
              ctx.globalAlpha = 0.55 * (1 - u.t);
              ringAt(u.x, u.y, lerp(dotU * 1.2, dotU * 6, smooth(u.t)));
            });
          }

          /* ---------- Beschriftungen ---------- */
          var labelEls = {};
          Object.keys(spec.labels || {}).forEach(function (id) {
            var el = document.createElement("div");
            el.className = "panel-label";
            layer.appendChild(el);
            labelEls[id] = { el: el, def: spec.labels[id], on: false, w: 200 };
          });

          function measureLabels() {
            if (!cssW) return;
            Object.keys(labelEls).forEach(function (id) {
              labelEls[id].w = (labelEls[id].el.offsetWidth / cssW) * 1000;
            });
          }

          function relabel() {
            Object.keys(labelEls).forEach(function (id) {
              labelEls[id].el.textContent = cfg.label(labelEls[id].def.key);
            });
            measureLabels();
          }

          function labelPoint(L) {
            var def = L.def;
            var x = def.x === undefined ? 500 : def.x;
            var y = def.y === undefined ? 500 : def.y;
            var p = def.at ? S[def.at] : null;
            if (p) {
              var cx = p.x;
              var cy = p.y;
              var ext = Math.max(p.rx || 0, p.ry || 0);
              var group = byId[def.at];
              if (group && group.kind === "cloud" && def.node !== undefined && group.nodes[def.node]) {
                cx = group.nodes[def.node].x;
                cy = group.nodes[def.node].y;
                ext = 0;
              } else {
                if (p.circ && p.circ.a > 0.1) ext = Math.max(ext, p.circ.r);
                if (p.s) ext = Math.max(ext, p.s / 2 + 20);
              }
              var gap = def.gap === undefined ? 24 : def.gap;
              var side = def.side || "below";
              if (side === "above") {
                x = cx;
                y = cy - ext - gap;
              } else if (side === "right") {
                x = cx + ext + gap;
                y = cy;
              } else if (side === "left") {
                x = cx - ext - gap;
                y = cy;
              } else if (side === "center") {
                x = cx;
                y = cy;
              } else if (side === "angle") {
                var rad = ((def.deg || 0) * Math.PI) / 180;
                x = cx + Math.cos(rad) * (ext + gap);
                y = cy + Math.sin(rad) * (ext + gap);
              } else if (side === "out") {
                var ox = cx - p.x;
                var oy = cy - p.y;
                var od = Math.sqrt(ox * ox + oy * oy) || 1;
                x = cx + (ox / od) * gap;
                y = cy + (oy / od) * gap;
              } else {
                x = cx;
                y = cy + ext + gap;
              }
              x += def.dx || 0;
              y += def.dy || 0;
            }
            var half = (L.w || 200) / 2;
            return { x: clamp(x, half + 25, 1000 - half - 25), y: clamp(y, 50, 950) };
          }

          function placeLabels() {
            var values = S.lab || {};
            Object.keys(labelEls).forEach(function (id) {
              var L = labelEls[id];
              var want = values[id] || 0;
              if (want < 0.02) {
                if (L.on) {
                  L.el.style.visibility = "hidden";
                  L.el.style.opacity = "0";
                  L.on = false;
                }
                return;
              }
              var pos = labelPoint(L);
              L.el.style.left = (pos.x / 10).toFixed(2) + "%";
              L.el.style.top = (pos.y / 10).toFixed(2) + "%";
              L.el.style.opacity = Math.min(1, want).toFixed(3);
              if (!L.on) {
                L.el.style.visibility = "visible";
                L.on = true;
              }
            });
          }

          function draw() {
            if (!cssW) return;
            baseScale = canvas.width / 1000;
            ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
            ctx.clearRect(0, 0, 1000, 1000);
            if (gridOn) drawGrid();
            clouds.forEach(drawReality);
            clouds.forEach(drawDeco);
            streams.forEach(drawStream);
            clouds.forEach(drawCloud);
            drawTies();
            rasters.forEach(drawRaster);
            drawFlyers();
            drawPulses();
            ctx.globalAlpha = 1;
            placeLabels();
          }

          /* ---------- Ablauf ---------- */
          function setBeat(index) {
            beat = index;
            beatT = 0;
            T = cum[page][index];
            var list = pages[page][index].focus;
            focusSet = null;
            if (list && list.length) {
              focusSet = {};
              list.forEach(function (id) {
                focusSet[id] = true;
              });
              focusMix = 1;
            }
            cfg.onBeat(index);
          }

          function begin() {
            pending = false;
            if (beats) setBeat(0);
          }

          function step(dt, snap) {
            clock += dt;
            artApproach(S, T, snap ? 1 : 1 - Math.exp(-dt / 0.42), snap ? 1000 : dt);
            focusMix *= Math.exp(-dt / 1.3);
            stepGrid();
            clouds.forEach(function (g) {
              updateCloud(g, dt, clock, snap);
            });
            buildLinks();
            rasters.forEach(function (g) {
              stepRaster(g, dt, snap);
            });
            if (snap) return;
            stepHops(dt);
            stepSense(dt);
            stepFeeds(dt);
            if (focused && beat >= 0 && beat < beats) {
              beatT += dt;
              if (beatT >= (durations[beat] || 4)) {
                if (beat < beats - 1) {
                  setBeat(beat + 1);
                } else {
                  beat = beats;
                  cfg.onBeat(-1);
                }
              }
            }
          }

          function loop(now) {
            raf = 0;
            if (!inView || document.hidden || still.matches) return;
            var dt = last ? Math.min((now - last) / 1000, 0.1) : 0;
            last = now;
            step(dt, false);
            draw();
            rafAt = performance.now();
            raf = requestAnimationFrame(loop);
          }

          function play() {
            if (!inView || document.hidden || still.matches) return;
            if (raf) {
              /* Ein Bild-Aufruf, der lange nicht kam (Tabwechsel, Energiesparmodus), wird neu angefordert. */
              if (performance.now() - rafAt < 1500) return;
              cancelAnimationFrame(raf);
            }
            last = 0;
            rafAt = performance.now();
            raf = requestAnimationFrame(loop);
          }

          function snapAll() {
            hops.length = 0;
            flyers.length = 0;
            pulses.length = 0;
            step(0.016, true);
            draw();
          }

          function show(index) {
            page = index;
            beats = has(index) ? cum[index].length : 0;
            beat = -1;
            beatT = 0;
            focusSet = null;
            focusMix = 0;
            pending = beats > 0;
            cfg.onBeat(-1);
            if (still.matches) {
              T = endState(index);
              pending = false;
              beat = beats;
              snapAll();
              return;
            }
            T = beats ? (index > 0 ? endState(index - 1) : spec.init) : endState(index);
            if (beats && focused) begin();
            play();
          }

          /* ---------- Groesse und Sichtbarkeit ---------- */
          function fit() {
            var size = canvas.clientWidth;
            if (!size) return;
            var ratio = Math.min(window.devicePixelRatio || 1, 2);
            var px = Math.round(size * ratio);
            if (canvas.width !== px || canvas.height !== px) {
              canvas.width = px;
              canvas.height = px;
            }
            cssW = size;
            unit = 1000 / size;
            dotU = Math.max(2.3, size * 0.0056) * unit;
            lineU = Math.max(1, size * 0.0016) * unit;
            sparkU = dotU * 0.62;
            rimU = Math.max(0.9, size * 0.0012) * unit;
            measureLabels();
            if (still.matches) snapAll();
            else draw();
          }

          var fitTimer = 0;
          new ResizeObserver(function () {
            clearTimeout(fitTimer);
            fitTimer = setTimeout(fit, cssW ? 140 : 0);
          }).observe(canvas);

          if (window.IntersectionObserver) {
            new IntersectionObserver(
              function (entries) {
                var entry = entries[entries.length - 1];
                var ratio = entry.isIntersecting ? entry.intersectionRatio : 0;
                var was = focused;
                inView = ratio > 0.04;
                focused = ratio >= 0.6;
                if (focused && !was && pending) begin();
                if (inView) play();
              },
              { threshold: [0, 0.04, 0.3, 0.6, 0.9] }
            ).observe(host);
          } else {
            inView = true;
            focused = true;
          }
          document.addEventListener("visibilitychange", play);
