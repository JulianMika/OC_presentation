<!DOCTYPE html>
<html lang="en" data-theme="white" data-lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="twitter:title" content="OC" />
    <meta name="twitter:description" content="The Basis for human-centric solutions. Release date 01.01.2027." />
    <meta name="twitter:image" content="assets/og-image.jpg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="assets/favicon_0" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Saira+Stencil+One&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var lang = localStorage.getItem("oc-lang");
        document.documentElement.dataset.theme = "white";
        if (lang === "de" || lang === "en") {
          document.documentElement.dataset.lang = lang;
          document.documentElement.lang = lang === "de" ? "de" : "en";
        }
        if (localStorage.getItem("oc-design") === "1") document.documentElement.dataset.design = "1";
        document.documentElement.style.setProperty("--app-height", window.innerHeight + "px");
      })();
    </script>
    <style>
      @font-face {
        font-family: "Bauhaus 93";
        src: local("Bauhaus 93"), local("Bauhaus93"), local("Bauhaus 93 Regular");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Inter OC";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuI6fAZ9hiJ-Ek-_EeA.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Inter OC";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuFuYAZ9hiJ-Ek-_EeA.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        --widget: #fff;
        --ink: #111;
        --glass: rgba(255, 255, 255, 0.48);
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
        --sans: "Inter", sans-serif;
        --app-height: 100dvh;
      }

      html[data-theme="black"] {
        --widget: #111;
        --ink: #fff;
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }

      body {
        height: 100%;
        overflow: hidden;
        color: var(--ink);
        font-family: var(--sans);
      }

      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: #1d2a1c;
        pointer-events: none;
      }

      .bg > *,
      .bg-light > * {
        position: absolute;
        inset: 0;
      }

      .bg-photo {
        background: #1d2a1c url("assets/background.jpg") center / cover no-repeat;
      }

      .bg-fx,
      .bg-light,
      .bg-warm,
      .bg-grade {
        display: none;
        opacity: 0;
      }

      .bg.is-live .bg-fx,
      .bg.is-live .bg-light,
      .bg.is-live .bg-warm,
      .bg.is-live .bg-grade {
        display: block;
      }

      .bg.is-live .bg-cam {
        will-change: transform;
      }

      .bg-fx {
        width: 100%;
        height: 100%;
        opacity: 1;
      }

      .bg-light {
        mix-blend-mode: screen;
      }

      .bg-sun {
        background: radial-gradient(
          circle at var(--sun-x, 85%) var(--sun-y, 0%),
          rgba(255, 251, 238, 1) 0,
          rgba(255, 242, 210, 0.75) 5%,
          rgba(255, 226, 172, 0.34) 14%,
          rgba(255, 212, 150, 0.1) 28%,
          rgba(255, 212, 150, 0) 46%
        );
      }

      .bg-rays {
        transform-origin: var(--sun-x, 85%) var(--sun-y, 0%);
        background: conic-gradient(
          from 0deg at var(--sun-x, 85%) var(--sun-y, 0%),
          rgba(255, 238, 206, 0) 0deg 177.5deg,
          rgba(255, 238, 206, 0.18) 179.25deg,
          rgba(255, 238, 206, 0.5) 181deg,
          rgba(255, 238, 206, 0.18) 182.75deg,
          rgba(255, 238, 206, 0) 184.5deg 188.5deg,
          rgba(255, 238, 206, 0.11) 190.75deg,
          rgba(255, 238, 206, 0.32) 193deg,
          rgba(255, 238, 206, 0.11) 195.25deg,
          rgba(255, 238, 206, 0) 197.5deg 200.5deg,
          rgba(255, 238, 206, 0.2) 202deg,
          rgba(255, 238, 206, 0.58) 203.5deg,
          rgba(255, 238, 206, 0.2) 205deg,
          rgba(255, 238, 206, 0) 206.5deg 212deg,
          rgba(255, 238, 206, 0.13) 214.5deg,
          rgba(255, 238, 206, 0.36) 217deg,
          rgba(255, 238, 206, 0.13) 219.5deg,
          rgba(255, 238, 206, 0) 222deg 225.5deg,
          rgba(255, 238, 206, 0.18) 227deg,
          rgba(255, 238, 206, 0.5) 228.5deg,
          rgba(255, 238, 206, 0.18) 230deg,
          rgba(255, 238, 206, 0) 231.5deg 237.5deg,
          rgba(255, 238, 206, 0.1) 240.25deg,
          rgba(255, 238, 206, 0.28) 243deg,
          rgba(255, 238, 206, 0.1) 245.75deg,
          rgba(255, 238, 206, 0) 248.5deg 252deg,
          rgba(255, 238, 206, 0.15) 253.5deg,
          rgba(255, 238, 206, 0.42) 255deg,
          rgba(255, 238, 206, 0.15) 256.5deg,
          rgba(255, 238, 206, 0) 258deg 360deg
        );
        -webkit-mask-image: radial-gradient(
          circle at var(--sun-x, 85%) var(--sun-y, 0%),
          #000 0,
          rgba(0, 0, 0, 0.85) 25%,
          rgba(0, 0, 0, 0.4) 55%,
          rgba(0, 0, 0, 0) 85%
        );
        mask-image: radial-gradient(
          circle at var(--sun-x, 85%) var(--sun-y, 0%),
          #000 0,
          rgba(0, 0, 0, 0.85) 25%,
          rgba(0, 0, 0, 0.4) 55%,
          rgba(0, 0, 0, 0) 85%
        );
      }

      .bg-rays-back {
        background: conic-gradient(
          from 0deg at var(--sun-x, 85%) var(--sun-y, 0%),
          rgba(255, 228, 186, 0) 0deg 174deg,
          rgba(255, 228, 186, 0.12) 179.5deg,
          rgba(255, 228, 186, 0.34) 185deg,
          rgba(255, 228, 186, 0.12) 190.5deg,
          rgba(255, 228, 186, 0) 196deg 202deg,
          rgba(255, 228, 186, 0.09) 207.5deg,
          rgba(255, 228, 186, 0.26) 213deg,
          rgba(255, 228, 186, 0.09) 218.5deg,
          rgba(255, 228, 186, 0) 224deg 226deg,
          rgba(255, 228, 186, 0.1) 233deg,
          rgba(255, 228, 186, 0.3) 240deg,
          rgba(255, 228, 186, 0.1) 247deg,
          rgba(255, 228, 186, 0) 254deg 360deg
        );
      }

      .bg-warm {
        mix-blend-mode: soft-light;
        background:
          radial-gradient(
            circle at var(--sun-x, 85%) var(--sun-y, 0%),
            rgba(255, 186, 104, 0.95) 0,
            rgba(255, 196, 128, 0.45) 35%,
            rgba(255, 196, 128, 0) 75%
          ),
          linear-gradient(200deg, rgba(255, 196, 120, 0.5) 0%, rgba(255, 204, 140, 0) 50%, rgba(18, 58, 72, 0) 62%, rgba(18, 58, 72, 0.6) 100%);
      }

      .bg-grade {
        background:
          radial-gradient(130% 100% at 50% 42%, rgba(5, 14, 10, 0) 52%, rgba(5, 14, 10, 0.42) 100%),
          linear-gradient(180deg, rgba(5, 14, 10, 0) 64%, rgba(5, 14, 10, 0.24) 100%);
      }

      .slides {
        position: relative;
        z-index: 1;
        height: var(--app-height);
        overflow-x: hidden;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }

      .slide {
        position: relative;
        z-index: 1;
        height: var(--app-height);
        min-height: var(--app-height);
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding:
          5.5rem
          calc(1.25rem + env(safe-area-inset-right, 0px))
          calc(2.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.25rem + env(safe-area-inset-left, 0px));
      }

      .lang-wrap {
        position: fixed;
        z-index: 3;
        top: calc(1.1rem + env(safe-area-inset-top, 0px));
        right: calc(0.9rem + env(safe-area-inset-right, 0px));
        display: flex;
        align-items: center;
        height: 2.75rem;
        pointer-events: auto;
      }

      .lang-button,
      .lang-option,
      .design-option {
        appearance: none;
        -webkit-appearance: none;
        display: inline-block;
        box-sizing: border-box;
        width: max-content;
        max-width: 100%;
        padding: 0.55rem 1.15rem;
        color: #111;
        font-family: "Inter OC", "Inter", system-ui, sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        font-optical-sizing: none;
        -webkit-font-smoothing: auto;
        letter-spacing: 0.01em;
        text-align: left;
        background: var(--glass);
        border: none;
        border-radius: 999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .lang-button {
        display: inline-flex;
        align-items: center;
        height: 2.55rem;
        padding-top: 0;
        padding-bottom: 0;
        white-space: nowrap;
      }

      .lang-wrap.is-open .lang-button,
      .lang-option:hover,
      .lang-option:active,
      .lang-option:focus-visible,
      .lang-option.is-active,
      .design-wrap.is-open .design-button,
      .design-option:hover,
      .design-option:active,
      .design-option:focus-visible,
      .design-option.is-active {
        background: #fff;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        outline: none;
      }

      .lang-menu,
      .design-menu {
        position: absolute;
        top: calc(100% + 0.55rem);
        left: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: max-content;
        gap: 0.45rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      html.lang-open .slides,
      html.design-open .slides {
        visibility: hidden;
        pointer-events: none;
      }

      html.lang-open .lang-wrap,
      html.lang-open .design-wrap,
      html.design-open .lang-wrap,
      html.design-open .design-wrap {
        visibility: visible;
      }

      .design-wrap {
        position: fixed;
        z-index: 3;
        top: calc(1.1rem + env(safe-area-inset-top, 0px));
        left: calc(0.9rem + env(safe-area-inset-left, 0px));
        display: flex;
        align-items: center;
        height: 2.75rem;
        pointer-events: auto;
      }

      .design-button {
        appearance: none;
        -webkit-appearance: none;
        display: inline-flex;
        align-items: center;
        box-sizing: border-box;
        height: 2.55rem;
        padding: 0 1.15rem;
        color: #111;
        font-family: "Inter OC", "Inter", system-ui, sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        font-optical-sizing: none;
        -webkit-font-smoothing: auto;
        letter-spacing: 0.01em;
        white-space: nowrap;
        background: var(--glass);
        border: none;
        border-radius: 999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .lang-menu[hidden],
      .design-menu[hidden] {
        display: none;
      }

      @media (min-width: 768px) {
        .lang-wrap {
          top: calc(1.5rem + env(safe-area-inset-top, 0px));
          right: calc(1.85rem + env(safe-area-inset-right, 0px));
          height: 3rem;
        }

        .lang-button,
        .lang-option,
        .design-option {
          padding: 0.65rem 1.35rem;
          font-size: 1.05rem;
        }

        .lang-button {
          height: 2.69rem;
          padding-top: 0;
          padding-bottom: 0;
        }

        .design-wrap {
          top: calc(1.5rem + env(safe-area-inset-top, 0px));
          left: calc(1.85rem + env(safe-area-inset-left, 0px));
          height: 3rem;
        }

        .design-button {
          height: 2.69rem;
          padding: 0 1.35rem;
          font-size: 1.05rem;
        }
      }

      .slide[data-slide="start"] {
        padding:
          calc(1.5rem + env(safe-area-inset-top, 0px))
          calc(1.5rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.5rem + env(safe-area-inset-left, 0px));
      }

      .lockup {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: max-content;
        max-width: 100%;
        transform-origin: center center;
      }

      .logo-widget {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        width: min(46.2vw, 242px);
        aspect-ratio: 1;
        overflow: hidden;
        background: transparent;
        border-radius: 50%;
      }

      .logo-widget > * {
        grid-area: 1 / 1;
      }

      .logo-flow {
        position: relative;
        z-index: 2;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .logo-widget img {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        -webkit-touch-callout: none;
        user-select: none;
      }

      html[data-theme="black"] .logo-widget img {
        filter: invert(1);
      }

      .slogan {
        margin-top: 2.3rem;
        width: fit-content;
        max-width: 100%;
        padding: 0.45rem 0.7rem;
        background: var(--glass);
        color: #111;
        border-radius: 0.75rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-family: var(--sans);
        font-size: clamp(1.9rem, 4.4vw, 2.3rem);
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.15;
        text-align: center;
        text-wrap: balance;
      }

      .slogan-mark {
        font-family: "Saira Stencil One", "Bauhaus 93", sans-serif;
        font-weight: 400;
        font-synthesis: none;
      }

      .slide-pair {
        align-items: center;
        justify-content: center;
        height: var(--app-height);
        padding:
          calc(1.5rem + env(safe-area-inset-top, 0px))
          calc(1.5rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.5rem + env(safe-area-inset-left, 0px));
        container-type: size;
      }

      .pair {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.25rem;
        width: fit-content;
        max-width: 100%;
        justify-items: center;
      }

      .panel {
        width: min(
          100cqh,
          calc((100cqw - 1.25rem) / 2),
          max(50cqh, 20rem, calc((56cqw - 1.25rem) / 2))
        );
        aspect-ratio: 1;
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 2px solid var(--ink);
        border-radius: 1.5rem;
      }

      @container (max-width: calc(100dvh - 1.75rem)) {
        .pair {
          grid-template-columns: 1fr;
        }

        .panel {
          width: min(100cqw, calc((100cqh - 1.25rem) / 2));
        }
      }

      .slide-end {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: var(--app-height);
        padding:
          calc(1.5rem + env(safe-area-inset-top, 0px))
          calc(1.5rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.5rem + env(safe-area-inset-left, 0px));
        container-type: size;
      }

      .end-stage {
        position: relative;
        z-index: 1;
        display: flex;
        max-width: 100%;
      }

      .end-board {
        position: absolute;
        top: calc(100% + 1.25rem);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 1.25rem;
        width: max-content;
        max-width: calc(100vw - 3rem);
      }

      .end-widget {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        background: var(--glass);
        color: #111;
        border: 1px solid #111;
        border-radius: 0.65rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .timer-widget {
        width: fit-content;
        max-width: 100%;
        height: fit-content;
        padding: 0.108em 0.168em;
        font-size: min(10.4rem, max(4.4rem, 10.8vw), calc((100vw - 3rem) / 6.2));
      }

      .timer-grid {
        display: grid;
        grid-template-columns: repeat(4, max-content);
        column-gap: 0.276em;
        width: auto;
        text-align: center;
      }

      .timer-value {
        display: block;
        font-family: "Saira Stencil One", "Bauhaus 93", sans-serif;
        font-weight: 400;
        font-size: 1em;
        line-height: 1;
        text-align: center;
      }

      .timer-digit {
        display: inline-block;
        width: var(--digit, 0.62em);
        text-align: center;
      }

      .timer-label {
        display: block;
        margin-top: 0.048em;
        font-family: var(--sans);
        font-size: 0.24em;
        font-weight: 600;
        letter-spacing: 0.03em;
        line-height: 1.15;
      }

      .release-widget {
        flex-direction: column;
        justify-content: flex-start;
        gap: 0.55rem;
        width: fit-content;
        max-width: 100%;
        height: fit-content;
        padding: 0.45rem 0.7rem;
        text-align: center;
      }

      .end-kicker {
        font-size: clamp(0.9rem, 1.5vw, 1.15rem);
        font-weight: 600;
      }

      .end-date {
        font-size: clamp(1.7rem, 3vw, 2.7rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      .x-widget {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 0.55rem;
        box-sizing: border-box;
        width: var(--card-w, max-content);
        height: var(--card-h, max-content);
        max-width: 100%;
        padding: 0.45rem 0.7rem;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .x-line {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
      }

      .x-widget:active {
        background: #fff;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        outline: none;
      }

      .x-mark {
        width: 1.35rem;
        height: 1.35rem;
        flex: none;
      }

      .x-name {
        font-size: 1.15rem;
        font-weight: 700;
        line-height: 1;
      }

      @media (min-width: 768px) {
        .end-widget {
          border-radius: 0.8rem;
        }
      }

      @media (max-width: 640px) {
        .slogan {
          padding: 0.4rem 0.6rem;

      }

      @media (max-width: 460px) {
        .end-board {

        .release-widget,

        }
      }

      @media (prefers-reduced-motion: reduce) {
        .slides {
          scroll-behavior: auto;

      }
    </style>
  </head>
  <body>

    <script>
      (function () {
        var copy = {
          en: {
            slogan: "The Basis for human-centric solutions",
            language: "Language",
            days: "Days",
            hours: "Hours",
            minutes: "Minutes",
            seconds: "Seconds",
            release: "Release date",
            contact: "Get in touch",
            design: "Design"
          },
          de: {
            slogan: "Die Basis für menschenzentrierte Lösungen",
            language: "Sprache",
            days: "Tage",
            hours: "Stunden",
            minutes: "Minuten",
            seconds: "Sekunden",
            release: "Release-Datum",
            contact: "Kontakt aufnehmen",
            design: "Design"
          }
        };

        var root = document.documentElement;
        var langSwitch = document.getElementById("lang-switch");
        var langButton = document.getElementById("lang-button");
        var langMenu = document.getElementById("lang-menu");
        var designSwitch = document.getElementById("design-switch");
        var designButton = document.getElementById("design-button");
        var designMenu = document.getElementById("design-menu");
        var slogan = document.getElementById("slogan");
        var lockup = document.querySelector(".lockup");
        var themeMeta = document.querySelector('meta[name="theme-color"]');

        function theme() {
          return root.dataset.theme === "black" ? "black" : "white";
        }

        function lang() {
          return root.dataset.lang === "de" ? "de" : "en";
        }

        function renderSlogan(text) {
          slogan.replaceChildren();
          text.split(/(Basis|basis)/).forEach(function (part) {
            if (!part) return;
            if (part === "Basis" || part === "basis") {
              var mark = document.createElement("span");
              mark.className = "slogan-mark";
              mark.textContent = part;
              slogan.appendChild(mark);
              return;
            }
            slogan.appendChild(document.createTextNode(part));
          });
        }

        function render() {
          var currentTheme = theme();
          var currentLang = lang();
          var text = copy[currentLang];

          root.lang = currentLang === "de" ? "de" : "en";
          renderSlogan(text.slogan);
          langMenu.querySelectorAll("button").forEach(function (button) {
            button.classList.toggle("is-active", button.dataset.langSet === currentLang);
          });
          document.querySelectorAll("[data-copy]").forEach(function (node) {
            node.textContent = text[node.dataset.copy];
          });

          if (themeMeta) {
            themeMeta.setAttribute("content", currentTheme === "black" ? "#111111" : "#ffffff");
          }

          fitSlogan();
          matchXWidget();
        }

        function matchXWidget() {
          var board = document.querySelector(".end-board");
          var timer = document.querySelector(".timer-widget");
          var release = document.querySelector(".release-widget");
          var xWidget = document.querySelector(".x-widget");
          if (!release || !xWidget || !board || !timer) return;
          release.style.width = "max-content";
          release.style.height = "max-content";
          xWidget.style.width = "max-content";
          xWidget.style.height = "max-content";
          var cardW = Math.max(release.offsetWidth, xWidget.offsetWidth);
          var cardH = Math.max(release.offsetHeight, xWidget.offsetHeight);
          release.style.width = cardW + "px";
          release.style.height = cardH + "px";
          xWidget.style.width = cardW + "px";
          xWidget.style.height = cardH + "px";

          var left = Infinity;
          var right = -Infinity;
          board.querySelectorAll(".end-widget").forEach(function (card) {
            var rect = card.getBoundingClientRect();
            left = Math.min(left, rect.left);
            right = Math.max(right, rect.right);
          });
          var width = right - left;
          if (!(width > 0)) return;

          var dayText = document.getElementById("timer-days").textContent || "";
          var dayCount = Math.max(dayText.length, 2);
          var daySample = "";
          for (var n = 0; n < dayCount; n++) daySample += "8";

          var digitAt100 = widestDigit(100);
          var probe = timer.cloneNode(true);
          probe.style.cssText = "position:fixed;left:0;top:0;visibility:hidden;width:max-content;max-width:none;height:auto;font-size:100px;";
          probe.style.setProperty("--digit", digitAt100 + "px");
          var values = probe.querySelectorAll(".timer-value");
          if (values[0]) fillDigits(values[0], daySample);
          for (var i = 1; i < values.length; i++) fillDigits(values[i], "88");
          document.body.appendChild(probe);
          var gridWidth = probe.querySelector(".timer-grid").getBoundingClientRect().width;
          var style = getComputedStyle(probe);
          var border = parseFloat(style.borderLeftWidth) + parseFloat(style.borderRightWidth);
          var pad = (parseFloat(style.paddingLeft) + parseFloat(style.paddingRight)) / 100;
          probe.remove();

          var natural = (width - border) / (gridWidth / 100 + pad);
          timer.style.width = width + "px";
          timer.style.fontSize = natural + "px";

          var slide = timer.closest(".slide");
          var slideStyle = getComputedStyle(slide);
          var available = slide.clientHeight - parseFloat(slideStyle.paddingTop) - parseFloat(slideStyle.paddingBottom);
          var timerRect = timer.getBoundingClientRect();
          var boardRect = board.getBoundingClientRect();
          var below = boardRect.bottom - timerRect.bottom;
          var maxTimer = available - 2 * below;
          if (timerRect.height > maxTimer && maxTimer > 0) {
            var timerStyle = getComputedStyle(timer);
            var borderY = parseFloat(timerStyle.borderTopWidth) + parseFloat(timerStyle.borderBottomWidth);
            var content = timerRect.height - borderY;
            var contentMax = maxTimer - borderY;
            if (content > 0 && contentMax > 0) {
              timer.style.fontSize = (natural * contentMax / content) + "px";
            }
          }
          timer.style.setProperty("--digit", (digitAt100 / 100) * parseFloat(timer.style.fontSize) + "px");
        }

        function widestDigit(fontSize) {
          var sample = document.createElement("span");
          sample.className = "timer-value";
          sample.style.cssText = "position:fixed;left:0;top:0;visibility:hidden;font-size:" + fontSize + "px;";
          document.body.appendChild(sample);
          var max = 0;
          for (var d = 0; d < 10; d++) {
            sample.textContent = String(d);
            max = Math.max(max, sample.getBoundingClientRect().width);
          }
          sample.remove();
          return max;
        }

        function fillDigits(node, text) {
          node.textContent = "";
          for (var i = 0; i < text.length; i++) {
            var digit = document.createElement("span");
            digit.className = "timer-digit";
            digit.textContent = text.charAt(i);
            node.appendChild(digit);
          }
        }

        function fitSlogan() {
          var slide = slogan.closest(".slide");
          var slideStyle = getComputedStyle(slide);
          var available =
            slide.clientWidth -
            parseFloat(slideStyle.paddingLeft) -
            parseFloat(slideStyle.paddingRight);

          var probe = slogan.cloneNode(true);
          probe.style.cssText =
            "position:fixed;left:0;top:0;visibility:hidden;width:max-content;max-width:none;white-space:nowrap;";
          document.body.appendChild(probe);
          var single = probe.getBoundingClientRect().width;
          probe.remove();

          if (single + 1 <= available) {
            slogan.style.width = Math.ceil(single + 1) + "px";
          } else {
            slogan.style.width = available + "px";
            var style = getComputedStyle(slogan);
            var pad = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
            var range = document.createRange();
            range.selectNodeContents(slogan);
            var wrapped = lineMetrics(range);
            if (wrapped.widest) {
              slogan.style.width = Math.min(Math.ceil(wrapped.widest + pad + 1), available) + "px";
            }
          }

          fitLockup();
        }

        function fitLockup() {
          var slide = lockup.closest(".slide");
          var slides = slide.parentElement;
          var slideStyle = getComputedStyle(slide);
          var availableWidth =
            slide.clientWidth -
            parseFloat(slideStyle.paddingLeft) -
            parseFloat(slideStyle.paddingRight);
          var availableHeight =
            slide.clientHeight -
            parseFloat(slideStyle.paddingTop) -
            parseFloat(slideStyle.paddingBottom);

          lockup.style.transform = "none";
          var scale = Math.min(1, availableWidth / lockup.offsetWidth, availableHeight / lockup.offsetHeight);
          var shift = (window.innerWidth - slides.clientWidth) / 2;
          var transform = "";
          if (Math.abs(shift) > 0.5) transform += "translateX(" + shift + "px)";
          if (scale < 0.999) transform += (transform ? " " : "") + "scale(" + scale + ")";
          lockup.style.transform = transform || "none";
        }

        function lineMetrics(range) {
          var rects = range.getClientRects();
          var lines = [];
          for (var i = 0; i < rects.length; i++) {
            var rect = rects[i];
            if (rect.width <= 0 || rect.height <= 0) continue;
            var line = null;
            for (var j = 0; j < lines.length; j++) {
              var overlap = Math.min(lines[j].bottom, rect.bottom) - Math.max(lines[j].top, rect.top);
              if (overlap > Math.min(lines[j].bottom - lines[j].top, rect.height) * 0.5) {
                line = lines[j];
                break;
              }
            }
            if (!line) {
              lines.push({ top: rect.top, bottom: rect.bottom, left: rect.left, right: rect.right });
              continue;
            }
            line.top = Math.min(line.top, rect.top);
            line.bottom = Math.max(line.bottom, rect.bottom);
            line.left = Math.min(line.left, rect.left);
            line.right = Math.max(line.right, rect.right);
          }
          var widest = 0;
          for (var k = 0; k < lines.length; k++) {
            var width = lines[k].right - lines[k].left;
            if (width > widest) widest = width;
          }
          return { widest: widest, count: lines.length };
        }

        window.addEventListener("resize", syncViewport);
        document.fonts.ready.then(function () {
          fitSlogan();
          matchXWidget();
        });
        new ResizeObserver(matchXWidget).observe(document.querySelector(".release-widget"));

        var viewportWidth = window.innerWidth;
        var viewportHeight = window.innerHeight;

        function syncViewport() {
          var width = window.innerWidth;
          var height = window.innerHeight;
          var widthChanged = width !== viewportWidth;
          var heightChanged = height !== viewportHeight;
          if (widthChanged || heightChanged) {
            viewportWidth = width;
            viewportHeight = height;
            root.style.setProperty("--app-height", height + "px");
          }
          if (widthChanged) {
            fitSlogan();
            matchXWidget();
          } else if (heightChanged) {
            fitLockup();
          }
        }

        function setLangOpen(open) {
          if (open) setDesignOpen(false);
          langSwitch.classList.toggle("is-open", open);
          root.classList.toggle("lang-open", open);
          langButton.setAttribute("aria-expanded", String(open));
          langMenu.hidden = !open;
        }

        function setDesignOpen(open) {
          if (open) setLangOpen(false);
          designSwitch.classList.toggle("is-open", open);
          root.classList.toggle("design-open", open);
          designButton.setAttribute("aria-expanded", String(open));
          designMenu.hidden = !open;
        }

        langButton.addEventListener("click", function (event) {
          event.stopPropagation();
          setLangOpen(langMenu.hidden);
        });

        designButton.addEventListener("click", function (event) {
          event.stopPropagation();
          setDesignOpen(designMenu.hidden);
        });

        langMenu.addEventListener("click", function (event) {
          var button = event.target.closest("button");
          if (!button) return;
          root.dataset.lang = button.dataset.langSet;
          localStorage.setItem("oc-lang", lang());
          setLangOpen(false);
          render();
        });

        function design() {
          return root.dataset.design || "";
        }

        function setDesign(value) {
          if (value) {
            root.dataset.design = value;
            localStorage.setItem("oc-design", value);
          } else {
            delete root.dataset.design;
            localStorage.removeItem("oc-design");
          }
          designMenu.querySelectorAll("[data-design-set]").forEach(function (button) {
            button.classList.toggle("is-active", button.dataset.designSet === value);
          });
          if (scene) scene.set(value === "1");
        }

        designMenu.addEventListener("click", function (event) {
          var button = event.target.closest("button");
          if (!button) return;
          var value = button.dataset.designSet;
          if (value) setDesign(design() === value ? "" : value);
          setDesignOpen(false);
        });

        document.addEventListener("click", function (event) {
          if (!langSwitch.contains(event.target)) setLangOpen(false);
          if (!designSwitch.contains(event.target)) setDesignOpen(false);
        });

        var slides = document.querySelector(".slides");
        function placeLang() {
          var shift = "translateY(" + -slides.scrollTop + "px)";
          langSwitch.style.transform = shift;
          designSwitch.style.transform = shift;
        }
        slides.addEventListener("scroll", placeLang, { passive: true });
        placeLang();

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            setLangOpen(false);
            setDesignOpen(false);
          }
        });

        render();

        var releaseAt = new Date(2027, 0, 1).getTime();

        function pad(value) {
          return value < 10 ? "0" + value : String(value);
        }

        function paintDigits(node, text) {
          var value = String(text);
          var existing = node.children;
          if (existing.length === value.length) {
            for (var i = 0; i < existing.length; i++) {
              if (existing[i].textContent !== value.charAt(i)) existing[i].textContent = value.charAt(i);
            }
            return;
          }
          fillDigits(node, value);
        }

        function tick() {
          var remaining = Math.max(0, releaseAt - Date.now());
          var totalSeconds = Math.floor(remaining / 1000);
          paintDigits(document.getElementById("timer-days"), String(Math.floor(totalSeconds / 86400)));
          paintDigits(document.getElementById("timer-hours"), pad(Math.floor(totalSeconds / 3600) % 24));
          paintDigits(document.getElementById("timer-minutes"), pad(Math.floor(totalSeconds / 60) % 60));
          paintDigits(document.getElementById("timer-seconds"), pad(totalSeconds % 60));
        }

        tick();
        matchXWidget();
        setInterval(tick, 1000);

        var flowCanvas = document.querySelector(".logo-flow");
        if (flowCanvas) startLogoFlow(flowCanvas);

        var scene = startScene(document.querySelector(".bg"));
        setDesign(design());

        function startLogoFlow(canvas) {
          var ctx = canvas.getContext("2d");
          if (!ctx) return;

          var BOX = 1024;
          var CENTER = 512;
          var R_MIN = 230;
          var R_MAX = 463;
          var START = 0;
          var END = -Math.PI * 2;
          var FADE = (16 * Math.PI) / 180;
          var INPUT = (24 * Math.PI) / 180;
          var LINK = 170;
          var SPACE = 62;
          var DOT = 10.5;
          var SPARK = 5.5;
          var SPAWN_EVERY = 0.72;
          var SPARK_EVERY = 0.85;
          var SPARK_SPEED = 210;
          var SPARK_PAUSE = 0.22;
          var SPARK_MAX = 12;
          var WEDGE = new Path2D(
            "M 873.961 150.039 A 511.89 511.89 0 0 1 873.961 873.961 L 640.743 640.743 A 182.07 182.07 0 0 0 640.743 383.257 Z"
          );
          var OPEN = new Path2D();
          OPEN.rect(0, 0, BOX, BOX);
          OPEN.addPath(WEDGE);

          var points = [];
          var links = [];
          var sparks = [];
          var scale = 1;
          var dpr = 1;
          var clock = 0;
          var nextSpawn = 0;
          var nextSpark = 0;
          var last = 0;
          var frame = 0;
          var onScreen = true;
          var still = window.matchMedia("(prefers-reduced-motion: reduce)");

          function makePoint(angle) {
            var lane = R_MIN + 20 + Math.random() * (R_MAX - R_MIN - 40);
            return {
              a: angle,
              r: lane,
              lane: lane,
              sway: 18 + Math.random() * 34,
              phase: Math.random() * Math.PI * 2,
              rate: 0.25 + Math.random() * 0.35,
              speed: 72 + Math.random() * 20,
              near: [],
              gone: false,
              alpha: 0,
              x: 0,
              y: 0
            };
          }

          function dotSize() {
            return Math.max(DOT, 1.7 / scale);
          }

          function place(p) {
            p.x = CENTER + p.r * Math.cos(p.a);
            p.y = CENTER + p.r * Math.sin(p.a);
            p.alpha = Math.max(0, Math.min(1, (START - p.a) / FADE, (p.a - END) / FADE));
          }

          function apart(p, q) {
            return Math.abs(p.a - q.a) > Math.PI;
          }

          function ahead(p, q) {
            var gap = p.a - q.a;
            return gap > 0 && gap < Math.PI;
          }

          function step(dt) {
            clock += dt;
            nextSpawn -= dt;
            if (nextSpawn <= 0) {
              points.push(makePoint(START));
              nextSpawn = SPAWN_EVERY * (0.75 + Math.random() * 0.5);
            }

            points.forEach(place);

            points.forEach(function (p) {
              var fx = 0;
              var fy = 0;
              points.forEach(function (q) {
                if (q === p || apart(p, q)) return;
                var dx = p.x - q.x;
                var dy = p.y - q.y;
                var d = Math.sqrt(dx * dx + dy * dy);
                if (d > 0 && d < SPACE) {
                  var push = (SPACE - d) / SPACE;
                  fx += (dx / d) * push;
                  fy += (dy / d) * push;
                }
              });

              var cos = Math.cos(p.a);
              var sin = Math.sin(p.a);
              var radial = fx * cos + fy * sin;
              var along = fx * sin - fy * cos;
              var target = Math.min(R_MAX, Math.max(R_MIN, p.lane + Math.sin(clock * p.rate + p.phase) * p.sway));

              p.r += ((target - p.r) * 0.9 + radial * 120) * dt;
              p.r = Math.min(R_MAX, Math.max(R_MIN, p.r));
              p.a -= (Math.max(p.speed * 0.35, p.speed + along * 60) / p.r) * dt;
            });

            points = points.filter(function (p) {
              if (p.a > END) return true;
              p.gone = true;
              return false;
            });
            points.forEach(place);
            connect();
            moveSparks(dt);
          }

          function connect() {
            var dot = dotSize();
            links = [];
            points.forEach(function (p) {
              p.near = [];
            });
            for (var i = 0; i < points.length; i++) {
              for (var j = i + 1; j < points.length; j++) {
                var p = points[i];
                var q = points[j];
                var dx = q.x - p.x;
                var dy = q.y - p.y;
                var d = Math.sqrt(dx * dx + dy * dy);
                if (d >= LINK || apart(p, q) || blocked(p, q, dot)) continue;
                links.push({ p: p, q: q, d: d });
                p.near.push(q);
                q.near.push(p);
              }
            }
          }

          function strength(p, q) {
            var dx = q.x - p.x;
            var dy = q.y - p.y;
            var d = Math.sqrt(dx * dx + dy * dy) / LINK;
            return Math.max(0, 1 - d * d);
          }

          function nextHop(s) {
            var options = s.at.near.filter(function (q) {
              return q !== s.from && ahead(s.at, q);
            });
            if (!options.length) {
              options = s.at.near.filter(function (q) {
                return q !== s.from;
              });
            }
            var total = options.reduce(function (sum, q) {
              return sum + strength(s.at, q);
            }, 0);
            var pick = Math.random() * total;
            for (var i = 0; i < options.length; i++) {
              pick -= strength(s.at, options[i]);
              if (pick <= 0) return options[i];
            }
            return options[options.length - 1] || null;
          }

          function moveSparks(dt) {
            nextSpark -= dt;
            if (nextSpark <= 0 && sparks.length < SPARK_MAX) {
              var inputs = points.filter(function (p) {
                return (
                  START - p.a < INPUT &&
                  p.near.some(function (q) {
                    return ahead(p, q);
                  })
                );
              });
              if (inputs.length) {
                sparks.push({
                  at: inputs[Math.floor(Math.random() * inputs.length)],
                  to: null,
                  from: null,
                  t: 0,
                  wait: 0,
                  stuck: 0,
                  show: 0,
                  leaving: false
                });
                nextSpark = SPARK_EVERY * (0.7 + Math.random() * 0.6);
              } else {
                nextSpark = 0.1;
              }
            }

            sparks.forEach(function (s) {
              s.show = s.leaving ? s.show - dt / 0.3 : Math.min(1, s.show + dt / 0.3);
              if (s.leaving || s.at.gone) return;
              if (s.to) {
                if (s.to.gone || s.at.near.indexOf(s.to) === -1) {
                  s.leaving = true;
                  return;
                }
                var dx = s.to.x - s.at.x;
                var dy = s.to.y - s.at.y;
                s.t += (SPARK_SPEED * dt) / Math.max(1, Math.sqrt(dx * dx + dy * dy));
                if (s.t >= 1) {
                  s.from = s.at;
                  s.at = s.to;
                  s.to = null;
                  s.t = 0;
                  s.wait = SPARK_PAUSE;
                }
                return;
              }
              s.wait -= dt;
              if (s.wait > 0) return;
              s.to = nextHop(s);
              if (s.to) {
                s.stuck = 0;
                return;
              }
              s.wait = 0.25;
              s.stuck += 1;
              if (s.stuck > 6) s.leaving = true;
            });

            sparks = sparks.filter(function (s) {
              return !s.at.gone && (!s.leaving || s.show > 0);
            });
          }

          function carrying(link) {
            return sparks.some(function (s) {
              return s.to && ((s.at === link.p && s.to === link.q) || (s.at === link.q && s.to === link.p));
            });
          }

          function blocked(p, q, dot) {
            var dx = q.x - p.x;
            var dy = q.y - p.y;
            var len2 = dx * dx + dy * dy;
            var reach = dot * 2.2;
            return points.some(function (o) {
              if (o === p || o === q) return false;
              var t = ((o.x - p.x) * dx + (o.y - p.y) * dy) / len2;
              if (t <= 0 || t >= 1) return false;
              var ox = p.x + t * dx - o.x;
              var oy = p.y + t * dy - o.y;
              return ox * ox + oy * oy < reach * reach;
            });
          }

          function paint(ink, glow, rimmed) {
            var px = 1 / scale;
            var dot = dotSize();
            var spark = Math.max(SPARK, 1.3 * px);
            var rim = rimmed ? 0.9 * px : 0;

            ctx.lineWidth = 1.4 * px;
            ctx.lineCap = "round";
            ctx.strokeStyle = ink;
            links.forEach(function (link) {

              if (carrying(link)) alpha = Math.max(alpha, 0.45);
              ctx.globalAlpha = alpha * Math.min(link.p.alpha, link.q.alpha);

              ctx.moveTo(link.p.x, link.p.y);
              ctx.lineTo(link.q.x, link.q.y);

            ctx.fillStyle = ink;

              ctx.globalAlpha = p.alpha;

              ctx.arc(p.x, p.y, dot, 0, Math.PI * 2);

            sparks.forEach(function (s) {

              var y = s.to ? s.at.y + (s.to.y - s.at.y) * s.t : s.at.y;

              ctx.beginPath();
              ctx.arc(x, y, spark, 0, Math.PI * 2);
              ctx.fill();
            });

          }

          function draw() {
            ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);

            ctx.save();

            paint("#000", "#fff", false);
            ctx.restore();

            ctx.save();
            ctx.clip(WEDGE);
            paint("#fff", "#000", true);
            ctx.restore();
          }

          function resize() {
            var size = canvas.clientWidth;
            if (!size) return;
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            scale = size / BOX;
            canvas.width = Math.round(size * dpr);
            canvas.height = Math.round(size * dpr);

          function loop(now) {

          function play() {

        }

        function startScene(bg) {

          var ctx = canvas.getContext("2d");

          var cams = bg.querySelectorAll(".bg-cam");
          var photo = bg.querySelector(".bg-photo");
          var light = bg.querySelector(".bg-light");
          var sun = bg.querySelector(".bg-sun");
          var rays = bg.querySelectorAll(".bg-rays");
          var warm = bg.querySelector(".bg-warm");

          var TAU = Math.PI * 2;
          var RAMP = 1.8;
          var PHOTO_W = 1024;
          var PHOTO_H = 768;
          var SUN_U = 0.86;
          var SUN_V = 0;
          var MIST_W = 512;
          var MIST_H = 160;
          var MISTS = [
            { seed: 11, cells: 5, y: 0.33, h: 0.36, alpha: 0.55, speed: 6, depth: 1.15 },
            { seed: 29, cells: 4, y: 0.5, h: 0.56, alpha: 0.4, speed: 15, depth: 1.6 }
          ];
          var SHADE = { seed: 47, cells: 2, alpha: 0.3, speed: 11 };
          var LAKE = [
            { u: 0.53, v: 0.52, ru: 0.075, rv: 0.035, share: 0.25 },
            { u: 0.7, v: 0.532, ru: 0.065, rv: 0.016, share: 0.35 },
            { u: 0.855, v: 0.53, ru: 0.045, rv: 0.04, share: 0.4 }
          ];

          var on = false;
          var ramp = 0;
          var shown = -1;
          var clock = 0;
          var last = 0;
          var frame = 0;
          var width = 0;
          var height = 0;
          var dpr = 1;
          var unit = 1;
          var sunX = 0;
          var sunY = 0;
          var progress = 0;
          var lookX = 0;
          var lookY = 0;
          var aimX = 0;
          var aimY = 0;
          var textures = null;
          var shade = null;
          var spark = null;
          var disc = null;
          var motes = [];
          var blurs = [];
          var glints = [];

          function clamp(value, low, high) {

          function lattice(octave, fx, fy) {
            var ix = Math.floor(fx);
            var iy = Math.floor(fy);

            var ty = fy - iy;
            tx = tx * tx * (3 - 2 * tx);
            ty = ty * ty * (3 - 2 * ty);
            var x0 = ix % octave.cols;
            var x1 = (x0 + 1) % octave.cols;
            var row0 = iy * octave.cols;
            var row1 = row0 + octave.cols;
            var grid = octave.grid;
            var top = grid[row0 + x0] + (grid[row0 + x1] - grid[row0 + x0]) * tx;
            var bottom = grid[row1 + x0] + (grid[row1 + x1] - grid[row1 + x0]) * tx;

            for (var o = 0; o < 5; o++) {

              var grid = new Float32Array(cols * (rows + 1));

            var texture = document.createElement("canvas");
            texture.width = look.width;
            texture.height = look.height;

            var image = paintNoise.createImageData(look.width, look.height);
            for (var y = 0; y < look.height; y++) {

                image.data[i + 1] = look.color[1];

          }

          function makeMist(layer) {
            return makeNoise({
              seed: layer.seed,
              cells: layer.cells,
              width: MIST_W,
              height: MIST_H,
              stretch: 2.4,
              color: [246, 248, 246],
              low: 0.38,
              high: 0.74,
              band: function (v) {
                return smooth(0, 0.42, v) * (1 - smooth(0.68, 1, v));
              }
            });
          }

          function makeShade() {
            return makeNoise({
              seed: SHADE.seed,
              cells: SHADE.cells,
              width: 256,
              height: 160,
              stretch: 1.3,
              color: [6, 20, 16],
              low: 0.46,
              high: 0.76,
              band: function (v) {
                return smooth(0.14, 0.4, v);
              }
            });
          }

          function makeSprite(stops) {
            var sprite = document.createElement("canvas");
            sprite.width = 64;
            sprite.height = 64;
            var paintSprite = sprite.getContext("2d");
            var fill = paintSprite.createRadialGradient(32, 32, 0, 32, 32, 32);
            stops.forEach(function (stop) {
              fill.addColorStop(stop[0], stop[1]);
            });
            paintSprite.fillStyle = fill;
            paintSprite.fillRect(0, 0, 64, 64);
            return sprite;
          }

          function makeMote() {
            var z = Math.pow(Math.random(), 1.7);
            return {
              x: Math.random() * 1.1,
              y: Math.random() * 1.1,
              z: z,
              size: 10 + z * 24,
              vx: -(3 + z * 10),
              vy: -(2 + z * 7),
              sway: 3 + z * 12,
              swayRate: 0.05 + Math.random() * 0.1,
              rate: 0.12 + Math.random() * 0.35,
              phase: Math.random() * TAU,
              glow: 0.7 + z * 0.3
            };
          }

          function makeBlur() {
            return {
              x: Math.random() * 1.1,
              y: Math.random() * 1.1,
              size: 90 + Math.random() * 110,
              vx: -(5 + Math.random() * 6),
              vy: -(3 + Math.random() * 4),
              rate: 0.05 + Math.random() * 0.08,
              phase: Math.random() * TAU,
              glow: 0.1 + Math.random() * 0.08
            };
          }

          function makeGlint() {
            var pick = Math.random();
            var pool = LAKE[0];
            for (var l = 0; l < LAKE.length; l++) {
              pool = LAKE[l];
              if (pick < pool.share) break;
              pick -= pool.share;
            }
            var angle = Math.random() * TAU;
            var reach = Math.sqrt(Math.random());
            return {
              u: pool.u + Math.cos(angle) * reach * pool.ru,
              v: pool.v + Math.sin(angle) * reach * pool.rv,
              size: 4 + Math.random() * 6,
              rate: 0.2 + Math.random() * 0.45,
              phase: Math.random() * TAU
            };
          }

          function populate() {
            var count = Math.round(clamp((width * height) / 17000, 24, 110));
            while (motes.length < count) motes.push(makeMote());
            motes.length = count;
            var discs = width > 700 ? 6 : 3;
            while (blurs.length < discs) blurs.push(makeBlur());
            blurs.length = discs;
            while (glints.length < 46) glints.push(makeGlint());
          }

          function resize() {
            width = bg.clientWidth;
            height = bg.clientHeight;
            if (!width || !height) return;
            dpr = Math.min(window.devicePixelRatio || 1, 1.5);
            unit = clamp(Math.min(width, height) / 900, 0.6, 1.3);
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            var fit = Math.max(width / PHOTO_W, height / PHOTO_H);
            sunX = clamp((width - PHOTO_W * fit) / 2 + SUN_U * PHOTO_W * fit, width * 0.62, width * 0.97);
            sunY = clamp((height - PHOTO_H * fit) / 2 + SUN_V * PHOTO_H * fit, -height * 0.06, height * 0.04);
            bg.style.setProperty("--sun-x", sunX.toFixed(1) + "px");
            bg.style.setProperty("--sun-y", sunY.toFixed(1) + "px");
            populate();
          }

          function aimProgress() {
            var room = slides.scrollHeight - slides.clientHeight;
            return room > 0 ? clamp(slides.scrollTop / room, 0, 1) : 0;
          }

          function drift(item, dt) {
            item.x = wrap(item.x + (item.vx * unit * dt) / width, 1.1);
            item.y = wrap(item.y + (item.vy * unit * dt) / height, 1.1);
          }

          function step(dt) {
            clock += dt;
            for (var i = 0; i < motes.length; i++) drift(motes[i], dt);
            for (var j = 0; j < blurs.length; j++) drift(blurs[j], dt);
          }

          function drawFx(k, zoom, camX, camY) {
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            ctx.globalAlpha = 1;
            ctx.clearRect(0, 0, width, height);

            for (var s = wrap(camX - clock * SHADE.speed * unit, shadeW) - shadeW; s < width; s += shadeW) {

            }

            var thin = k * (1 - 0.3 * progress);
            for (var m = 0; m < MISTS.length; m++) {
              var mist = MISTS[m];
              var tall = mist.h * height;
              var wide = (tall * MIST_W) / MIST_H;
              var top = mist.y * height + camY * mist.depth;
              ctx.globalAlpha = mist.alpha * thin;
              for (var x = wrap(camX * mist.depth - clock * mist.speed * unit, wide) - wide; x < width; x += wide) {
                ctx.drawImage(textures[m], x, top, wide, tall);
              }
            }

            ctx.globalCompositeOperation = "lighter";
            var glow = k * (0.9 + 0.3 * progress);
            var fit = Math.max(width / PHOTO_W, height / PHOTO_H);
            var photoLeft = (width - PHOTO_W * fit) / 2;
            var photoTop = (height - PHOTO_H * fit) / 2;
            for (var g = 0; g < glints.length; g++) {
              var glint = glints[g];
              var flash = Math.sin(clock * glint.rate * TAU + glint.phase);
              if (flash < 0.45) continue;
              var gx = width / 2 + (photoLeft + glint.u * PHOTO_W * fit - width / 2) * zoom + camX;
              var gy = height / 2 + (photoTop + glint.v * PHOTO_H * fit - height / 2) * zoom + camY;
              var streak = glint.size * unit * zoom;
              ctx.globalAlpha = Math.min(1, glow * 1.2 * Math.pow((flash - 0.45) / 0.55, 2));
              ctx.drawImage(spark, gx - streak * 1.6, gy - streak / 2, streak * 3.2, streak);
            }

            var litX = width / 2 + (sunX - width / 2) * zoom + camX;
            var litY = height / 2 + (sunY - height / 2) * zoom + camY;
            var reach = Math.hypot(width, height);
            for (var i = 0; i < motes.length; i++) {
              var mote = motes[i];
              var depth = 0.6 + mote.z * 1.8;
              var mx =
                (wrap(mote.x + (camX * depth) / width, 1.1) - 0.05) * width +
                Math.sin(clock * mote.swayRate * TAU + mote.phase) * mote.sway * unit;
              var my = (wrap(mote.y + (camY * depth) / height, 1.1) - 0.05) * height;
              var near = Math.hypot(mx - litX, my - litY) / reach;
              var lit = 0.3 + 0.7 * Math.exp(-(near * near) / 0.2);
              var twinkle = 0.55 + 0.45 * Math.sin(clock * mote.rate * TAU + mote.phase);
              var dot = mote.size * unit;
              ctx.globalAlpha = Math.min(1, mote.glow * lit * twinkle * glow);
              ctx.drawImage(spark, mx - dot / 2, my - dot / 2, dot, dot);
            }
            for (var b = 0; b < blurs.length; b++) {
              var blur = blurs[b];
              var bx = (wrap(blur.x + (camX * 2.6) / width, 1.1) - 0.05) * width;
              var by = (wrap(blur.y + (camY * 2.6) / height, 1.1) - 0.05) * height;
              var disk = blur.size * unit;
              ctx.globalAlpha = blur.glow * glow * (0.7 + 0.3 * Math.sin(clock * blur.rate * TAU + blur.phase));
              ctx.drawImage(disc, bx - disk / 2, by - disk / 2, disk, disk);
            }
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = "source-over";
          }

          function paint() {
            var k = smooth(0, 1, ramp);
            var p = progress;
            var t = clock;
            var zoom = 1 + k * (0.14 + 0.03 * p + 0.01 * Math.sin((t * TAU) / 53));
            var camX = k * width * (-0.01 + 0.02 * p + 0.009 * Math.sin((t * TAU) / 47) - 0.008 * lookX);
            var camY = k * height * (0.042 - 0.084 * p + 0.008 * Math.sin((t * TAU) / 61 + 1.3) - 0.007 * lookY);
            var move = "translate3d(" + camX.toFixed(2) + "px, " + camY.toFixed(2) + "px, 0) scale(" + zoom.toFixed(4) + ")";
            for (var c = 0; c < cams.length; c++) cams[c].style.transform = move;

            if (k !== shown) {
              shown = k;
              photo.style.filter = "saturate(" + (1 + 0.12 * k).toFixed(3) + ") contrast(" + (1 + 0.08 * k).toFixed(3) + ")";
              light.style.opacity = k.toFixed(3);
              grade.style.opacity = k.toFixed(3);
            }
            warm.style.opacity = (k * (0.7 + 0.3 * p)).toFixed(3);
            sun.style.opacity = ((0.72 + 0.2 * p) * (0.9 + 0.1 * Math.sin((t * TAU) / 9))).toFixed(3);
            rays[0].style.opacity = ((0.42 + 0.2 * p) * (0.85 + 0.15 * Math.sin((t * TAU) / 17 + 2))).toFixed(3);
            rays[0].style.transform = "rotate(" + (-1.6 * Math.sin((t * TAU) / 31 + 0.8)).toFixed(3) + "deg)";
            rays[1].style.opacity = ((0.52 + 0.25 * p) * (0.85 + 0.15 * Math.sin((t * TAU) / 13))).toFixed(3);
            rays[1].style.transform = "rotate(" + (1.2 * Math.sin((t * TAU) / 23)).toFixed(3) + "deg)";

            drawFx(k, zoom, camX, camY);
          }

          function rest() {
            bg.classList.remove("is-live");
            for (var c = 0; c < cams.length; c++) cams[c].style.transform = "";
            photo.style.filter = "";
            light.style.opacity = "";
            warm.style.opacity = "";
            grade.style.opacity = "";
            shown = -1;
          }

          function loop(now) {
            frame = 0;
            if (document.hidden) return;
            var calm = still.matches;
            var dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
            last = now;
            ramp = calm ? (on ? 1 : 0) : clamp(ramp + (on ? dt : -dt) / RAMP, 0, 1);
            if (!on && !ramp) {
              rest();
              return;
            }
            if (calm) {
              progress = 0;
              lookX = 0;
              lookY = 0;
            } else {
              step(dt);
              progress += (aimProgress() - progress) * (1 - Math.exp(-dt * 2.6));
              var glide = 1 - Math.exp(-dt * 2.2);
              lookX += (aimX - lookX) * glide;
              lookY += (aimY - lookY) * glide;
            }
            paint();
            if (!calm) frame = requestAnimationFrame(loop);
          }

          function wake() {
            if (frame || document.hidden || (!on && !ramp)) return;
            last = 0;
            frame = requestAnimationFrame(loop);
          }

          function set(next) {
            on = next;
            if (on && !bg.classList.contains("is-live")) {
              if (!textures) {
                textures = MISTS.map(makeMist);
                shade = makeShade();
                spark = makeSprite([
                  [0, "rgba(255, 251, 238, 1)"],
                  [0.16, "rgba(255, 244, 212, 0.9)"],
                  [0.42, "rgba(255, 230, 184, 0.22)"],
                  [1, "rgba(255, 230, 184, 0)"]
                ]);
                disc = makeSprite([
                  [0, "rgba(255, 240, 210, 0.5)"],
                  [0.72, "rgba(255, 240, 210, 0.56)"],
                  [0.88, "rgba(255, 244, 222, 0.8)"],
                  [1, "rgba(255, 244, 222, 0)"]
                ]);
              }
              bg.classList.add("is-live");
              resize();
              progress = aimProgress();
            }
            wake();
          }

          window.addEventListener(
            "pointermove",
            function (event) {
              if (event.pointerType !== "mouse") return;
              aimX = clamp((event.clientX / window.innerWidth) * 2 - 1, -1, 1);
              aimY = clamp((event.clientY / window.innerHeight) * 2 - 1, -1, 1);
            },
            { passive: true }
          );
          document.addEventListener("mouseout", function (event) {
            if (event.relatedTarget) return;
            aimX = 0;
            aimY = 0;
          });
          document.addEventListener("visibilitychange", wake);
          if (still.addEventListener) still.addEventListener("change", wake);
          new ResizeObserver(function () {
            if (!bg.classList.contains("is-live")) return;
            resize();
            if (ramp) paint();
            wake();
          }).observe(bg);

          return { set: set };
        }
      })();
    </script>
  </body>
</html>
