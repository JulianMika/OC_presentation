<!DOCTYPE html>
<html lang="en" data-theme="white" data-lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OC" />
    <title>OC</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="assets/favicon_0" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Saira+Stencil+One&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var lang = localStorage.getItem("oc-lang");
        document.documentElement.dataset.theme = "white";
        if (lang === "de" || lang === "en") {
          document.documentElement.dataset.lang = lang;
          document.documentElement.lang = lang === "de" ? "de" : "en";
        }
        document.documentElement.style.setProperty("--app-height", window.innerHeight + "px");
      })();
    </script>
    <style>
      @font-face {
        font-family: "Bauhaus 93";
        src: local("Bauhaus 93"), local("Bauhaus93"), local("Bauhaus 93 Regular");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Inter OC";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuI6fAZ9hiJ-Ek-_EeA.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Inter OC";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuFuYAZ9hiJ-Ek-_EeA.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        --widget: #fff;
        --ink: #111;
        --glass: rgba(255, 255, 255, 0.48);
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
        --sans: "Inter", sans-serif;
        --app-height: 100dvh;
      }

      html[data-theme="black"] {
        --widget: #111;
        --ink: #fff;
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }

      body {
        height: 100%;
        overflow: hidden;
        color: var(--ink);
        font-family: var(--sans);
      }

      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: #1d2a1c url("assets/background.jpg") center / cover no-repeat;
        pointer-events: none;
      }

      .slides {
        position: relative;
        z-index: 1;
        height: var(--app-height);
        overflow-x: hidden;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }

      .slide {
        position: relative;
        z-index: 1;
        height: var(--app-height);
        min-height: var(--app-height);
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding:
          5.5rem
          calc(1.25rem + env(safe-area-inset-right, 0px))
          calc(2.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.25rem + env(safe-area-inset-left, 0px));
      }

      .lang-wrap {
        position: fixed;
        z-index: 3;
        top: calc(1.1rem + env(safe-area-inset-top, 0px));
        right: calc(0.9rem + env(safe-area-inset-right, 0px));
        display: flex;
        align-items: center;
        height: 2.75rem;
        pointer-events: auto;
      }

      .lang-button,
      .lang-option {
        appearance: none;
        -webkit-appearance: none;
        display: inline-block;
        box-sizing: border-box;
        width: max-content;
        max-width: 100%;
        padding: 0.55rem 1.15rem;
        color: #111;
        font-family: "Inter OC", "Inter", system-ui, sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        font-optical-sizing: none;
        -webkit-font-smoothing: auto;
        letter-spacing: 0.01em;
        text-align: left;
        background: var(--glass);
        border: none;
        border-radius: 999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .lang-button {
        display: inline-grid;
        align-items: center;
        justify-items: start;
        height: 2.55rem;
        padding-top: 0;
        padding-bottom: 0;
        white-space: nowrap;
      }

      .lang-face,
      .lang-sizer {
        grid-area: 1 / 1;
      }

      .lang-sizer {
        visibility: hidden;
      }

      .lang-wrap.is-open .lang-button,
      .lang-option:hover,
      .lang-option:active,
      .lang-option:focus-visible,
      .lang-option.is-active {
        background: #fff;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        outline: none;
      }

      .lang-menu {
        position: absolute;
        top: calc(100% + 0.55rem);
        left: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: max-content;
        gap: 0.45rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      html.lang-open .slides {
        visibility: hidden;
        pointer-events: none;
      }

      html.lang-open .lang-wrap {
        visibility: visible;
      }

      .lang-menu[hidden] {
        display: none;
      }

      @media (min-width: 768px) {
        .lang-wrap {
          top: calc(1.5rem + env(safe-area-inset-top, 0px));
          right: calc(1.85rem + env(safe-area-inset-right, 0px));
          height: 3rem;
        }

        .lang-button,
        .lang-option {
          padding: 0.65rem 1.35rem;
          font-size: 1.05rem;
        }

        .lang-button {
          height: 2.69rem;
          padding-top: 0;
          padding-bottom: 0;
        }
      }

      .lockup {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 100%;
      }

      .logo-widget {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        width: min(46.2vw, 242px);
        aspect-ratio: 1;
        overflow: hidden;
        background: transparent;
        border-radius: 50%;
      }

      .logo-widget > * {
        grid-area: 1 / 1;
      }

      .logo-flow {
        position: relative;
        z-index: 2;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .logo-widget img {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        -webkit-touch-callout: none;
        user-select: none;
      }

      html[data-theme="black"] .logo-widget img {
        filter: invert(1);
      }

      .slogan {
        margin-top: 2.3rem;
        width: fit-content;
        max-width: 100%;
        padding: 0.45rem 0.7rem;
        background: var(--glass);
        color: #111;
        border-radius: 0.75rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-family: var(--sans);
        font-size: clamp(1.9rem, 4.4vw, 2.3rem);
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.15;
        text-align: center;
        text-wrap: balance;
      }

      .slogan-mark {
        font-family: "Saira Stencil One", "Bauhaus 93", sans-serif;
        font-weight: 400;
        font-synthesis: none;
      }

      .slide-pair {
        align-items: center;
        justify-content: center;
        height: var(--app-height);
        padding:
          calc(1.5rem + env(safe-area-inset-top, 0px))
          calc(1.5rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.5rem + env(safe-area-inset-left, 0px));
        container-type: size;
      }

      .pair {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.25rem;
        width: fit-content;
        max-width: 100%;
        justify-items: center;
      }

      .panel {
        width: min(
          100cqh,
          calc((100cqw - 1.25rem) / 2),
          max(50cqh, 20rem, calc((56cqw - 1.25rem) / 2))
        );
        aspect-ratio: 1;
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 2px solid var(--ink);
        border-radius: 1.5rem;
      }

      @container (max-width: calc(100dvh - 1.75rem)) {
        .pair {
          grid-template-columns: 1fr;
        }

        .panel {
          width: min(100cqw, calc((100cqh - 1.25rem) / 2));
        }
      }

      .slide-end {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: var(--app-height);
        padding:
          calc(1.5rem + env(safe-area-inset-top, 0px))
          calc(1.5rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.5rem + env(safe-area-inset-left, 0px));
        container-type: size;
      }

      .end-stage {
        position: relative;
        z-index: 1;
        display: flex;
        max-width: 100%;
      }

      .end-board {
        position: absolute;
        top: calc(100% + 1.25rem);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 1.25rem;
        width: max-content;
        max-width: calc(100vw - 3rem);
      }

      .end-widget {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        background: var(--glass);
        color: #111;
        border-radius: 1.5rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .timer-widget {
        width: fit-content;
        max-width: 100%;
        height: fit-content;
        border-radius: 3rem;
        padding: 0.108em 0.168em;
        font-size: min(10.4rem, max(4.4rem, 10.8vw), calc((100vw - 3rem) / 6.2));
      }

      .timer-grid {
        display: grid;
        grid-template-columns: repeat(4, max-content);
        column-gap: 0.276em;
        width: auto;
        text-align: center;
      }

      .timer-value {
        display: block;
        font-family: "Saira Stencil One", "Bauhaus 93", sans-serif;
        font-weight: 400;
        font-size: 1em;
        line-height: 1;
      }

      .timer-label {
        display: block;
        margin-top: 0.048em;
        font-family: var(--sans);
        font-size: 0.24em;
        font-weight: 600;
        letter-spacing: 0.03em;
        line-height: 1.15;
      }

      .release-widget {
        flex-direction: column;
        gap: 0.55rem;
        width: fit-content;
        max-width: 100%;
        height: fit-content;
        padding: 0.45rem 0.7rem;
        text-align: center;
      }

      .end-kicker {
        font-size: clamp(0.9rem, 1.5vw, 1.15rem);
        font-weight: 600;
      }

      .end-date {
        font-size: clamp(1.7rem, 3vw, 2.7rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      .x-widget {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        box-sizing: border-box;
        width: var(--card-w, max-content);
        height: var(--card-h, max-content);
        max-width: 100%;
        padding: 0.35rem 0.55rem;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .x-widget:active {
        transform: scale(0.98);
      }

      .x-mark {
        width: 1.35rem;
        height: 1.35rem;
        flex: none;
      }

      .x-name {
        font-size: 1.15rem;
        font-weight: 700;
        line-height: 1;
      }

      @media (max-width: 640px) {
        .slogan {
          padding: 0.4rem 0.6rem;
          font-size: clamp(1.05rem, 4.8vw, 1.35rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .slides {
          scroll-behavior: auto;
        }

      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <main class="slides">
      <section class="slide" data-slide="start">
        <div class="lang-wrap" id="lang-switch">
          <button type="button" class="lang-button" id="lang-button" aria-expanded="false" aria-controls="lang-menu">
            <span class="lang-face" data-copy="language">Language</span>
            <span class="lang-sizer" aria-hidden="true">Language</span>
            <span class="lang-sizer" aria-hidden="true">Sprache</span>
          </button>
          <ul class="lang-menu" id="lang-menu" hidden>
            <li>
              <button type="button" class="lang-option" data-lang-set="en">English</button>
            </li>
            <li>
              <button type="button" class="lang-option" data-lang-set="de">Deutsch</button>
            </li>
          </ul>
        </div>
        <div class="lockup">
          <div class="logo-widget">
            <canvas class="logo-flow" aria-hidden="true"></canvas>
            <img src="assets/logo.svg" alt="OC" width="160" height="160" />
          </div>
          <p class="slogan" id="slogan">The <span class="slogan-mark">Basis</span> for human-centric solutions</p>
        </div>
      </section>
      <section class="slide slide-pair" data-slide="middle-1">
        <div class="pair">
          <div class="panel"></div>
          <div class="panel"></div>
        </div>
      </section>
      <section class="slide slide-pair" data-slide="middle-2">
        <div class="pair">
          <div class="panel"></div>
          <div class="panel"></div>
        </div>
      </section>
      <section class="slide slide-end" data-slide="end">
        <div class="end-stage">
        <div class="end-widget timer-widget" role="timer" aria-label="1 January 2027">
          <div class="timer-grid">
            <div>
              <span class="timer-value" id="timer-days">0</span>
              <span class="timer-label" data-copy="days">Days</span>
            </div>
            <div>
              <span class="timer-value" id="timer-hours">00</span>
              <span class="timer-label" data-copy="hours">Hours</span>
            </div>
            <div>
              <span class="timer-value" id="timer-minutes">00</span>
              <span class="timer-label" data-copy="minutes">Minutes</span>
            </div>
            <div>
              <span class="timer-value" id="timer-seconds">00</span>
              <span class="timer-label" data-copy="seconds">Seconds</span>
            </div>
          </div>
        </div>
        <div class="end-board">
          <div class="end-widget release-widget">
            <p class="end-kicker" data-copy="release">Release date</p>
            <p class="end-date">01.01.2027</p>
          </div>
          <a class="end-widget x-widget" href="https://x.com/JulianGeiss" target="_blank" rel="noopener noreferrer">
            <svg class="x-mark" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
            </svg>
            <span class="x-name">julian.mg</span>
          </a>
        </div>
        </div>
      </section>
    </main>
    <script>
      (function () {
        var copy = {
          en: {
            slogan: "The Basis for human-centric solutions",
            language: "Language",
            days: "Days",
            hours: "Hours",
            minutes: "Minutes",
            seconds: "Seconds",
            release: "Release date"
          },
          de: {
            slogan: "Die Basis für menschenzentrierte Lösungen",
            language: "Sprache",
            days: "Tage",
            hours: "Stunden",
            minutes: "Minuten",
            seconds: "Sekunden",
            release: "Release-Datum"
          }
        };

        var root = document.documentElement;
        var langSwitch = document.getElementById("lang-switch");
        var langButton = document.getElementById("lang-button");
        var langMenu = document.getElementById("lang-menu");
        var slogan = document.getElementById("slogan");
        var themeMeta = document.querySelector('meta[name="theme-color"]');

        function theme() {
          return root.dataset.theme === "black" ? "black" : "white";
        }

        function lang() {
          return root.dataset.lang === "de" ? "de" : "en";
        }

        function renderSlogan(text) {
          slogan.replaceChildren();
          text.split(/(Basis|basis)/).forEach(function (part) {
            if (!part) return;
            if (part === "Basis" || part === "basis") {
              var mark = document.createElement("span");
              mark.className = "slogan-mark";
              mark.textContent = part;
              slogan.appendChild(mark);
              return;
            }
            slogan.appendChild(document.createTextNode(part));
          });
        }

        function render() {
          var currentTheme = theme();
          var currentLang = lang();
          var text = copy[currentLang];

          root.lang = currentLang === "de" ? "de" : "en";
          renderSlogan(text.slogan);
          langMenu.querySelectorAll("button").forEach(function (button) {
            button.classList.toggle("is-active", button.dataset.langSet === currentLang);
          });
          document.querySelectorAll("[data-copy]").forEach(function (node) {
            node.textContent = text[node.dataset.copy];
          });

          if (themeMeta) {
            themeMeta.setAttribute("content", currentTheme === "black" ? "#111111" : "#ffffff");
          }

          fitSlogan();
          matchXWidget();
        }

        function matchXWidget() {
          var release = document.querySelector(".release-widget");
          var board = document.querySelector(".end-board");
          if (!release || !board) return;
          board.style.setProperty("--card-w", release.offsetWidth + "px");
          board.style.setProperty("--card-h", release.offsetHeight + "px");
        }

        function fitSlogan() {
          var slide = slogan.closest(".slide");
          var slideStyle = getComputedStyle(slide);
          var available =
            slide.clientWidth -
            parseFloat(slideStyle.paddingLeft) -
            parseFloat(slideStyle.paddingRight);

          var probe = slogan.cloneNode(true);
          probe.style.cssText =
            "position:fixed;left:0;top:0;visibility:hidden;width:max-content;max-width:none;white-space:nowrap;";
          document.body.appendChild(probe);
          var single = probe.getBoundingClientRect().width;
          probe.remove();

          if (single + 1 <= available) {
            slogan.style.width = Math.ceil(single + 1) + "px";
            return;
          }

          slogan.style.width = available + "px";
          var style = getComputedStyle(slogan);
          var pad = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
          var range = document.createRange();
          range.selectNodeContents(slogan);
          var wrapped = lineMetrics(range);
          if (!wrapped.widest) return;
          slogan.style.width = Math.min(Math.ceil(wrapped.widest + pad + 1), available) + "px";
        }

        function lineMetrics(range) {
          var rects = range.getClientRects();
          var lines = [];
          for (var i = 0; i < rects.length; i++) {
            var rect = rects[i];
            if (rect.width <= 0 || rect.height <= 0) continue;
            var line = null;
            for (var j = 0; j < lines.length; j++) {
              var overlap = Math.min(lines[j].bottom, rect.bottom) - Math.max(lines[j].top, rect.top);
              if (overlap > Math.min(lines[j].bottom - lines[j].top, rect.height) * 0.5) {
                line = lines[j];
                break;
              }
            }
            if (!line) {
              lines.push({ top: rect.top, bottom: rect.bottom, left: rect.left, right: rect.right });
              continue;
            }
            line.top = Math.min(line.top, rect.top);
            line.bottom = Math.max(line.bottom, rect.bottom);
            line.left = Math.min(line.left, rect.left);
            line.right = Math.max(line.right, rect.right);
          }
          var widest = 0;
          for (var k = 0; k < lines.length; k++) {
            var width = lines[k].right - lines[k].left;
            if (width > widest) widest = width;
          }
          return { widest: widest, count: lines.length };
        }

        window.addEventListener("resize", syncViewport);
        document.fonts.ready.then(function () {
          fitSlogan();
          matchXWidget();
        });
        new ResizeObserver(matchXWidget).observe(document.querySelector(".release-widget"));

        var viewportWidth = window.innerWidth;
        var viewportHeight = window.innerHeight;

        function syncViewport() {
          var width = window.innerWidth;
          var height = window.innerHeight;
          var widthChanged = width !== viewportWidth;
          if (widthChanged || Math.abs(height - viewportHeight) > 140) {
            viewportWidth = width;
            viewportHeight = height;
            root.style.setProperty("--app-height", height + "px");
          }
          if (widthChanged) {
            fitSlogan();
            matchXWidget();
          }
        }

        function setLangOpen(open) {
          langSwitch.classList.toggle("is-open", open);
          root.classList.toggle("lang-open", open);
          langButton.setAttribute("aria-expanded", String(open));
          langMenu.hidden = !open;
        }

        langButton.addEventListener("click", function (event) {
          event.stopPropagation();
          setLangOpen(langMenu.hidden);
        });

        langMenu.addEventListener("click", function (event) {
          var button = event.target.closest("button");
          if (!button) return;
          root.dataset.lang = button.dataset.langSet;
          localStorage.setItem("oc-lang", lang());
          setLangOpen(false);
          render();
        });

        document.addEventListener("click", function (event) {
          if (!langSwitch.contains(event.target)) setLangOpen(false);
        });

        var slides = document.querySelector(".slides");
        function placeLang() {
          langSwitch.style.transform = "translateY(" + -slides.scrollTop + "px)";
        }
        slides.addEventListener("scroll", placeLang, { passive: true });
        placeLang();

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") setLangOpen(false);
        });

        render();

        var releaseAt = new Date(2027, 0, 1).getTime();

        function pad(value) {
          return value < 10 ? "0" + value : String(value);
        }

        function tick() {
          var remaining = Math.max(0, releaseAt - Date.now());
          var totalSeconds = Math.floor(remaining / 1000);
          document.getElementById("timer-days").textContent = String(Math.floor(totalSeconds / 86400));
          document.getElementById("timer-hours").textContent = pad(Math.floor(totalSeconds / 3600) % 24);
          document.getElementById("timer-minutes").textContent = pad(Math.floor(totalSeconds / 60) % 60);
          document.getElementById("timer-seconds").textContent = pad(totalSeconds % 60);
        }

        tick();
        setInterval(tick, 1000);

        var flowCanvas = document.querySelector(".logo-flow");
        if (flowCanvas) startLogoFlow(flowCanvas);

        function startLogoFlow(canvas) {
          var ctx = canvas.getContext("2d");
          if (!ctx) return;

          var BOX = 1024;
          var CENTER = 512;
          var R_MIN = 230;
          var R_MAX = 463;
          var START = 0;
          var END = -Math.PI * 2;
          var FADE = (16 * Math.PI) / 180;
          var INPUT = (24 * Math.PI) / 180;
          var LINK = 170;
          var SPACE = 62;
          var DOT = 10.5;
          var SPARK = 5.5;
          var SPAWN_EVERY = 0.72;
          var SPARK_EVERY = 0.85;
          var SPARK_SPEED = 210;
          var SPARK_PAUSE = 0.22;
          var SPARK_MAX = 12;
          var WEDGE = new Path2D(
            "M 873.961 150.039 A 511.89 511.89 0 0 1 873.961 873.961 L 640.743 640.743 A 182.07 182.07 0 0 0 640.743 383.257 Z"
          );
          var OPEN = new Path2D();
          OPEN.rect(0, 0, BOX, BOX);
          OPEN.addPath(WEDGE);

          var points = [];
          var links = [];
          var sparks = [];
          var scale = 1;
          var dpr = 1;
          var clock = 0;
          var nextSpawn = 0;
          var nextSpark = 0;
          var last = 0;
          var frame = 0;
          var onScreen = true;
          var still = window.matchMedia("(prefers-reduced-motion: reduce)");

          function makePoint(angle) {
            var lane = R_MIN + 20 + Math.random() * (R_MAX - R_MIN - 40);
            return {
              a: angle,
              r: lane,
              lane: lane,
              sway: 18 + Math.random() * 34,
              phase: Math.random() * Math.PI * 2,
              rate: 0.25 + Math.random() * 0.35,
              speed: 72 + Math.random() * 20,
              near: [],
              gone: false,
              alpha: 0,
              x: 0,
              y: 0
            };
          }

          function dotSize() {
            return Math.max(DOT, 1.7 / scale);
          }

          function place(p) {
            p.x = CENTER + p.r * Math.cos(p.a);
            p.y = CENTER + p.r * Math.sin(p.a);
            p.alpha = Math.max(0, Math.min(1, (START - p.a) / FADE, (p.a - END) / FADE));
          }

          function apart(p, q) {
            return Math.abs(p.a - q.a) > Math.PI;
          }

          function ahead(p, q) {
            var gap = p.a - q.a;
            return gap > 0 && gap < Math.PI;
          }

          function step(dt) {
            clock += dt;
            nextSpawn -= dt;
            if (nextSpawn <= 0) {
              points.push(makePoint(START));
              nextSpawn = SPAWN_EVERY * (0.75 + Math.random() * 0.5);
            }

            points.forEach(place);

            points.forEach(function (p) {
              var fx = 0;
              var fy = 0;
              points.forEach(function (q) {
                if (q === p || apart(p, q)) return;
                var dx = p.x - q.x;
                var dy = p.y - q.y;
                var d = Math.sqrt(dx * dx + dy * dy);
                if (d > 0 && d < SPACE) {
                  var push = (SPACE - d) / SPACE;
                  fx += (dx / d) * push;
                  fy += (dy / d) * push;
                }
              });

              var cos = Math.cos(p.a);
              var sin = Math.sin(p.a);
              var radial = fx * cos + fy * sin;
              var along = fx * sin - fy * cos;
              var target = Math.min(R_MAX, Math.max(R_MIN, p.lane + Math.sin(clock * p.rate + p.phase) * p.sway));

              p.r += ((target - p.r) * 0.9 + radial * 120) * dt;
              p.r = Math.min(R_MAX, Math.max(R_MIN, p.r));
              p.a -= (Math.max(p.speed * 0.35, p.speed + along * 60) / p.r) * dt;
            });

            points = points.filter(function (p) {
              if (p.a > END) return true;
              p.gone = true;
              return false;
            });
            points.forEach(place);
            connect();
            moveSparks(dt);
          }

          function connect() {
            var dot = dotSize();
            links = [];
            points.forEach(function (p) {
              p.near = [];
            });
            for (var i = 0; i < points.length; i++) {
              for (var j = i + 1; j < points.length; j++) {
                var p = points[i];
                var q = points[j];
                var dx = q.x - p.x;
                var dy = q.y - p.y;
                var d = Math.sqrt(dx * dx + dy * dy);
                if (d >= LINK || apart(p, q) || blocked(p, q, dot)) continue;
                links.push({ p: p, q: q, d: d });
                p.near.push(q);
                q.near.push(p);
              }
            }
          }

          function strength(p, q) {
            var dx = q.x - p.x;
            var dy = q.y - p.y;
            var d = Math.sqrt(dx * dx + dy * dy) / LINK;
            return Math.max(0, 1 - d * d);
          }

          function nextHop(s) {
            var options = s.at.near.filter(function (q) {
              return q !== s.from && ahead(s.at, q);
            });
            if (!options.length) {
              options = s.at.near.filter(function (q) {
                return q !== s.from;
              });
            }
            var total = options.reduce(function (sum, q) {
              return sum + strength(s.at, q);
            }, 0);
            var pick = Math.random() * total;
            for (var i = 0; i < options.length; i++) {
              pick -= strength(s.at, options[i]);
              if (pick <= 0) return options[i];
            }
            return options[options.length - 1] || null;
          }

          function moveSparks(dt) {
            nextSpark -= dt;
            if (nextSpark <= 0 && sparks.length < SPARK_MAX) {
              var inputs = points.filter(function (p) {
                return (
                  START - p.a < INPUT &&
                  p.near.some(function (q) {
                    return ahead(p, q);
                  })
                );
              });
              if (inputs.length) {
                sparks.push({
                  at: inputs[Math.floor(Math.random() * inputs.length)],
                  to: null,
                  from: null,
                  t: 0,
                  wait: 0,
                  stuck: 0,
                  show: 0,
                  leaving: false
                });
                nextSpark = SPARK_EVERY * (0.7 + Math.random() * 0.6);
              } else {
                nextSpark = 0.1;
              }
            }

            sparks.forEach(function (s) {
              s.show = s.leaving ? s.show - dt / 0.3 : Math.min(1, s.show + dt / 0.3);
              if (s.leaving || s.at.gone) return;
              if (s.to) {
                if (s.to.gone || s.at.near.indexOf(s.to) === -1) {
                  s.leaving = true;
                  return;
                }
                var dx = s.to.x - s.at.x;
                var dy = s.to.y - s.at.y;
                s.t += (SPARK_SPEED * dt) / Math.max(1, Math.sqrt(dx * dx + dy * dy));
                if (s.t >= 1) {
                  s.from = s.at;
                  s.at = s.to;
                  s.to = null;
                  s.t = 0;
                  s.wait = SPARK_PAUSE;
                }
                return;
              }
              s.wait -= dt;
              if (s.wait > 0) return;
              s.to = nextHop(s);
              if (s.to) {
                s.stuck = 0;
                return;
              }
              s.wait = 0.25;
              s.stuck += 1;
              if (s.stuck > 6) s.leaving = true;
            });

            sparks = sparks.filter(function (s) {
              return !s.at.gone && (!s.leaving || s.show > 0);
            });
          }

          function carrying(link) {
            return sparks.some(function (s) {
              return s.to && ((s.at === link.p && s.to === link.q) || (s.at === link.q && s.to === link.p));
            });
          }

          function blocked(p, q, dot) {
            var dx = q.x - p.x;
            var dy = q.y - p.y;
            var len2 = dx * dx + dy * dy;
            var reach = dot * 2.2;
            return points.some(function (o) {
              if (o === p || o === q) return false;
              var t = ((o.x - p.x) * dx + (o.y - p.y) * dy) / len2;
              if (t <= 0 || t >= 1) return false;
              var ox = p.x + t * dx - o.x;
              var oy = p.y + t * dy - o.y;
              return ox * ox + oy * oy < reach * reach;
            });
          }

          function paint(ink, glow, rimmed) {
            var px = 1 / scale;
            var dot = dotSize();
            var spark = Math.max(SPARK, 1.3 * px);
            var rim = rimmed ? 0.9 * px : 0;

            ctx.lineWidth = 1.4 * px;
            ctx.lineCap = "round";
            ctx.strokeStyle = ink;
            links.forEach(function (link) {
              var alpha = 0.85 * (1 - (link.d / LINK) * (link.d / LINK));
              if (carrying(link)) alpha = Math.max(alpha, 0.45);
              ctx.globalAlpha = alpha * Math.min(link.p.alpha, link.q.alpha);
              ctx.beginPath();
              ctx.moveTo(link.p.x, link.p.y);
              ctx.lineTo(link.q.x, link.q.y);
              ctx.stroke();
            });

            ctx.fillStyle = ink;
            points.forEach(function (p) {
              ctx.globalAlpha = p.alpha;
              ctx.beginPath();
              ctx.arc(p.x, p.y, dot, 0, Math.PI * 2);
              ctx.fill();
            });

            sparks.forEach(function (s) {
              var x = s.to ? s.at.x + (s.to.x - s.at.x) * s.t : s.at.x;
              var y = s.to ? s.at.y + (s.to.y - s.at.y) * s.t : s.at.y;
              var seen = s.to ? s.at.alpha + (s.to.alpha - s.at.alpha) * s.t : s.at.alpha;
              ctx.globalAlpha = Math.max(0, Math.min(1, s.show * seen));
              if (rim) {
                ctx.fillStyle = ink;
                ctx.beginPath();
                ctx.arc(x, y, spark + rim, 0, Math.PI * 2);
                ctx.fill();
              }
              ctx.fillStyle = glow;
              ctx.beginPath();
              ctx.arc(x, y, spark, 0, Math.PI * 2);
              ctx.fill();
            });
            ctx.globalAlpha = 1;
          }

          function draw() {
            ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
            ctx.clearRect(0, 0, BOX, BOX);

            ctx.save();
            ctx.clip(OPEN, "evenodd");
            paint("#000", "#fff", false);
            ctx.restore();

            ctx.save();
            ctx.clip(WEDGE);
            paint("#fff", "#000", true);
            ctx.restore();
          }

          function resize() {
            var size = canvas.clientWidth;
            if (!size) return;
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            scale = size / BOX;
            canvas.width = Math.round(size * dpr);
            canvas.height = Math.round(size * dpr);
            draw();
          }

          function loop(now) {
            frame = 0;
            if (!onScreen || still.matches) return;
            var dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
            last = now;
            step(dt);
            draw();
            frame = requestAnimationFrame(loop);
          }

          function play() {
            if (frame || !onScreen || still.matches) return;
            last = 0;
            frame = requestAnimationFrame(loop);
          }

          for (var warm = 0; warm < 1050; warm++) step(1 / 30);

          new ResizeObserver(resize).observe(canvas);
          new IntersectionObserver(function (entries) {
            onScreen = entries[0].isIntersecting;
            play();
          }).observe(canvas);
          if (still.addEventListener) still.addEventListener("change", play);
          play();
        }
      })();
    </script>
  </body>
</html>
