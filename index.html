<!DOCTYPE html>
<html lang="en" data-theme="white" data-lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OC" />
    <title>OC</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="assets/favicon_0" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Saira+Stencil+One&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var lang = localStorage.getItem("oc-lang");
        document.documentElement.dataset.theme = "white";
        if (lang === "de" || lang === "en") {
          document.documentElement.dataset.lang = lang;
          document.documentElement.lang = lang === "de" ? "de" : "en";
        }
        document.documentElement.style.setProperty("--app-height", window.innerHeight + "px");
      })();
    </script>
    <style>
      @font-face {
        font-family: "Bauhaus 93";
        src: local("Bauhaus 93"), local("Bauhaus93"), local("Bauhaus 93 Regular");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Inter OC";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuI6fAZ9hiJ-Ek-_EeA.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Inter OC";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuFuYAZ9hiJ-Ek-_EeA.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        --widget: #fff;
        --ink: #111;
        --glass: rgba(255, 255, 255, 0.48);
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
        --sans: "Inter", sans-serif;
        --app-height: 100dvh;
      }

      html[data-theme="black"] {
        --widget: #111;
        --ink: #fff;
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }

      body {
        height: 100%;
        overflow: hidden;
        color: var(--ink);
        font-family: var(--sans);
      }

      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: #1d2a1c url("assets/background.jpg") center / cover no-repeat;
        pointer-events: none;
      }

      .slides {
        position: relative;
        z-index: 1;
        height: var(--app-height);
        overflow-x: hidden;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }

      .slide {
        position: relative;
        z-index: 1;
        height: var(--app-height);
        min-height: var(--app-height);
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding:
          5.5rem
          calc(1.25rem + env(safe-area-inset-right, 0px))
          calc(2.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.25rem + env(safe-area-inset-left, 0px));
      }

      .chrome {
        position: fixed;
        z-index: 2;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.75rem;
        height: calc(1.1rem + env(safe-area-inset-top, 0px) + 2.75rem);
        padding:
          calc(1.1rem + env(safe-area-inset-top, 0px))
          calc(0.9rem + env(safe-area-inset-right, 0px))
          0
          calc(0.9rem + env(safe-area-inset-left, 0px));
        pointer-events: none;
      }

      .lang-wrap {
        position: relative;
        z-index: 3;
        pointer-events: auto;
        display: flex;
      }

      .lang-button,
      .lang-option {
        appearance: none;
        -webkit-appearance: none;
        display: inline-block;
        box-sizing: border-box;
        width: max-content;
        max-width: 100%;
        padding: 0.55rem 1.15rem;
        color: #111;
        font-family: "Inter OC", "Inter", system-ui, sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        font-optical-sizing: none;
        -webkit-font-smoothing: auto;
        letter-spacing: 0.01em;
        text-align: left;
        background: var(--glass);
        border: none;
        border-radius: 999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .lang-button {
        height: 2.55rem;
        padding-top: 0;
        padding-bottom: 0;
      }

      .lang-wrap.is-open .lang-button,
      .lang-option:hover,
      .lang-option:active,
      .lang-option:focus-visible,
      .lang-option.is-active {
        background: #fff;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        outline: none;
      }

      .lang-menu {
        position: absolute;
        top: calc(100% + 0.55rem);
        left: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: max-content;
        gap: 0.45rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      html.lang-open .slides {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .lang-menu[hidden] {
        display: none;
      }

      @media (min-width: 768px) {
        .chrome {
          height: calc(1.5rem + env(safe-area-inset-top, 0px) + 3rem);
          padding:
            calc(1.5rem + env(safe-area-inset-top, 0px))
            calc(1.85rem + env(safe-area-inset-right, 0px))
            0
            calc(1.85rem + env(safe-area-inset-left, 0px));
        }

        .lang-button,
        .lang-option {
          padding: 0.65rem 1.35rem;
          font-size: 1.05rem;
        }

        .lang-button {
          height: 2.69rem;
          padding-top: 0;
          padding-bottom: 0;
        }
      }

      .lockup {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 100%;
      }

      .logo-widget {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        width: min(46.2vw, 242px);
        aspect-ratio: 1;
        overflow: hidden;
        background: #1d2a1c url("assets/background.jpg") center / cover no-repeat fixed;
        border-radius: 50%;
      }

      .logo-row {
        --name-size: clamp(1.05rem, 2.6vw, 2rem);
        position: relative;
        display: flex;
        align-items: center;
        gap: 1.15rem;
        width: max-content;
        max-width: 100%;
      }

      .logo-row::before {
        content: "";
        position: absolute;
        z-index: 0;
        left: -0.7rem;
        right: -0.7rem;
        top: 50%;
        height: calc(1.15 * var(--name-size) + 0.9rem);
        transform: translateY(-50%);
        background: var(--glass);
        border-radius: 0.75rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        pointer-events: none;
      }

      .logo-widget img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        -webkit-touch-callout: none;
        user-select: none;
      }

      .logo-name {
        position: relative;
        z-index: 1;
        margin: 0;
        width: max-content;
        max-width: 100%;
        color: #111;
        font-family: "Saira Stencil One", "Bauhaus 93", sans-serif;
        font-size: var(--name-size);
        font-weight: 400;
        font-synthesis: none;
        letter-spacing: 0.01em;
        line-height: 1.15;
        white-space: nowrap;
      }

      .logo-name-left {
        justify-self: end;
        text-align: right;
      }

      .logo-name-right {
        justify-self: start;
        text-align: left;
      }

      html[data-theme="black"] .logo-widget img {
        filter: invert(1);
      }

      .slogan {
        margin-top: 2.3rem;
        width: fit-content;
        max-width: 100%;
        padding: 0.45rem 0.7rem;
        background: var(--glass);
        color: #111;
        border-radius: 0.75rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-family: var(--sans);
        font-size: clamp(1.9rem, 4.4vw, 2.3rem);
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.15;
        text-align: center;
        text-wrap: balance;
      }

      .slogan-mark {
        font-family: "Saira Stencil One", "Bauhaus 93", sans-serif;
        font-weight: 400;
        font-synthesis: none;
      }

      .slide-pair {
        align-items: center;
        justify-content: center;
        height: var(--app-height);
        padding:
          calc(1.5rem + env(safe-area-inset-top, 0px))
          calc(1.5rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.5rem + env(safe-area-inset-left, 0px));
        container-type: size;
      }

      .pair {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.25rem;
        width: fit-content;
        max-width: 100%;
        justify-items: center;
      }

      .panel {
        width: min(50cqh, calc((100cqw - 1.25rem) / 2));
        aspect-ratio: 1;
        background: var(--widget);
        border: 2px solid var(--ink);
        border-radius: 1.5rem;
      }

      @container (max-width: calc(100dvh - 1.75rem)) {
        .pair {
          grid-template-columns: 1fr;
        }

        .panel {
          width: min(100cqw, calc((100cqh - 1.25rem) / 2));
        }
      }

      .slide-end {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: var(--app-height);
        padding:
          calc(1.5rem + env(safe-area-inset-top, 0px))
          calc(1.5rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.5rem + env(safe-area-inset-left, 0px));
        container-type: size;
      }

      .end-stage {
        position: relative;
        z-index: 1;
        display: flex;
        max-width: 100%;
      }

      .end-board {
        position: absolute;
        top: calc(100% + 1.25rem);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 1.25rem;
        width: max-content;
        max-width: calc(100vw - 3rem);
      }

      .end-widget {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        background: var(--glass);
        color: #111;
        border-radius: 1.5rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .timer-widget {
        width: fit-content;
        max-width: 100%;
        height: fit-content;
        border-radius: 3rem;
        padding: 0.108em 0.168em;
        font-size: min(10.4rem, max(4.4rem, 10.8vw), calc((100vw - 3rem) / 6.2));
      }

      .timer-grid {
        display: grid;
        grid-template-columns: repeat(4, max-content);
        column-gap: 0.276em;
        width: auto;
        text-align: center;
      }

      .timer-value {
        display: block;
        font-family: "Saira Stencil One", "Bauhaus 93", sans-serif;
        font-weight: 400;
        font-size: 1em;
        line-height: 1;
      }

      .timer-label {
        display: block;
        margin-top: 0.048em;
        font-family: var(--sans);
        font-size: 0.24em;
        font-weight: 600;
        letter-spacing: 0.03em;
        line-height: 1.15;
      }

      .release-widget {
        flex-direction: column;
        gap: 0.55rem;
        width: fit-content;
        max-width: 100%;
        height: fit-content;
        padding: 0.45rem 0.7rem;
        text-align: center;
      }

      .end-kicker {
        font-size: clamp(0.9rem, 1.5vw, 1.15rem);
        font-weight: 600;
      }

      .end-date {
        font-size: clamp(1.7rem, 3vw, 2.7rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      .x-widget {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        box-sizing: border-box;
        width: var(--card-w, max-content);
        height: var(--card-h, max-content);
        max-width: 100%;
        padding: 0.35rem 0.55rem;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .x-widget:active {
        transform: scale(0.98);
      }

      .x-mark {
        width: 1.35rem;
        height: 1.35rem;
        flex: none;
      }

      .x-name {
        font-size: 1.15rem;
        font-weight: 700;
        line-height: 1;
      }

      @media (max-width: 640px) {
        .chrome {
          flex-wrap: wrap;
        }

        .logo-widget {
          width: min(32vw, 242px);
        }

        .logo-row {
          --name-size: clamp(0.78rem, 3.5vw, 1.15rem);
        }

        .logo-row::before {
          left: -0.6rem;
          right: -0.6rem;
          height: calc(1.15 * var(--name-size) + 0.8rem);
        }

        .slogan {
          padding: 0.4rem 0.6rem;
          font-size: clamp(1.05rem, 4.8vw, 1.35rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .slides {
          scroll-behavior: auto;
        }

      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div class="chrome">
      <div class="lang-wrap" id="lang-switch">
            <button type="button" class="lang-button" id="lang-button" aria-expanded="false" aria-controls="lang-menu" data-copy="language">Language</button>        <ul class="lang-menu" id="lang-menu" hidden>
          <li>
            <button type="button" class="lang-option" data-lang-set="en">English</button>
          </li>
          <li>
            <button type="button" class="lang-option" data-lang-set="de">Deutsch</button>
          </li>
        </ul>
      </div>
    </div>
    <main class="slides">
      <section class="slide" data-slide="start">
        <div class="lockup">
          <div class="logo-row">
            <p class="logo-name logo-name-left" data-copy="nameLeft">Optimized</p>
            <div class="logo-widget">
              <img src="assets/logo.svg" alt="OC" width="160" height="160" />
            </div>
            <p class="logo-name logo-name-right" data-copy="nameRight">Consumption</p>
          </div>
          <p class="slogan" id="slogan">The <span class="slogan-mark">Basis</span> for human-centric solutions</p>
        </div>
      </section>
      <section class="slide slide-pair" data-slide="middle-1">
        <div class="pair">
          <div class="panel"></div>
          <div class="panel"></div>
        </div>
      </section>
      <section class="slide slide-pair" data-slide="middle-2">
        <div class="pair">
          <div class="panel"></div>
          <div class="panel"></div>
        </div>
      </section>
      <section class="slide slide-end" data-slide="end">
        <div class="end-stage">
        <div class="end-widget timer-widget" role="timer" aria-label="1 January 2027">
          <div class="timer-grid">
            <div>
              <span class="timer-value" id="timer-days">0</span>
              <span class="timer-label" data-copy="days">Days</span>
            </div>
            <div>
              <span class="timer-value" id="timer-hours">00</span>
              <span class="timer-label" data-copy="hours">Hours</span>
            </div>
            <div>
              <span class="timer-value" id="timer-minutes">00</span>
              <span class="timer-label" data-copy="minutes">Minutes</span>
            </div>
            <div>
              <span class="timer-value" id="timer-seconds">00</span>
              <span class="timer-label" data-copy="seconds">Seconds</span>
            </div>
          </div>
        </div>
        <div class="end-board">
          <div class="end-widget release-widget">
            <p class="end-kicker" data-copy="release">Release date</p>
            <p class="end-date">01.01.2027</p>
          </div>
          <a class="end-widget x-widget" href="https://x.com/JulianGeiss" target="_blank" rel="noopener noreferrer">
            <svg class="x-mark" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
            </svg>
            <span class="x-name">julian.mg</span>
          </a>
        </div>
        </div>
      </section>
    </main>
    <script>
      (function () {
        var copy = {
          en: {
            slogan: "The Basis for human-centric solutions",
            nameLeft: "Optimized",
            nameRight: "Consumption",
            language: "Language",
            days: "Days",
            hours: "Hours",
            minutes: "Minutes",
            seconds: "Seconds",
            release: "Release date"
          },
          de: {
            slogan: "Die Basis für menschenzentrierte Lösungen",
            nameLeft: "Optimized",
            nameRight: "Consumption",
            language: "Sprache",
            days: "Tage",
            hours: "Stunden",
            minutes: "Minuten",
            seconds: "Sekunden",
            release: "Release-Datum"
          }
        };

        var root = document.documentElement;
        var langSwitch = document.getElementById("lang-switch");
        var langButton = document.getElementById("lang-button");
        var langMenu = document.getElementById("lang-menu");
        var slogan = document.getElementById("slogan");
        var themeMeta = document.querySelector('meta[name="theme-color"]');

        function theme() {
          return root.dataset.theme === "black" ? "black" : "white";
        }

        function lang() {
          return root.dataset.lang === "de" ? "de" : "en";
        }

        function renderSlogan(text) {
          slogan.replaceChildren();
          text.split(/(Basis|basis)/).forEach(function (part) {
            if (!part) return;
            if (part === "Basis" || part === "basis") {
              var mark = document.createElement("span");
              mark.className = "slogan-mark";
              mark.textContent = part;
              slogan.appendChild(mark);
              return;
            }
            slogan.appendChild(document.createTextNode(part));
          });
        }

        function render() {
          var currentTheme = theme();
          var currentLang = lang();
          var text = copy[currentLang];

          root.lang = currentLang === "de" ? "de" : "en";
          renderSlogan(text.slogan);
          langMenu.querySelectorAll("button").forEach(function (button) {
            button.classList.toggle("is-active", button.dataset.langSet === currentLang);
          });
          document.querySelectorAll("[data-copy]").forEach(function (node) {
            node.textContent = text[node.dataset.copy];
          });

          if (themeMeta) {
            themeMeta.setAttribute("content", currentTheme === "black" ? "#111111" : "#ffffff");
          }

          fitSlogan();
          matchXWidget();
        }

        function matchXWidget() {
          var release = document.querySelector(".release-widget");
          var board = document.querySelector(".end-board");
          if (!release || !board) return;
          board.style.setProperty("--card-w", release.offsetWidth + "px");
          board.style.setProperty("--card-h", release.offsetHeight + "px");
        }

        function fitSlogan() {
          var slide = slogan.closest(".slide");
          var slideStyle = getComputedStyle(slide);
          var available =
            slide.clientWidth -
            parseFloat(slideStyle.paddingLeft) -
            parseFloat(slideStyle.paddingRight);

          var probe = slogan.cloneNode(true);
          probe.style.cssText =
            "position:fixed;left:0;top:0;visibility:hidden;width:max-content;max-width:none;white-space:nowrap;";
          document.body.appendChild(probe);
          var single = probe.getBoundingClientRect().width;
          probe.remove();

          if (single + 1 <= available) {
            slogan.style.width = Math.ceil(single + 1) + "px";
            return;
          }

          slogan.style.width = available + "px";
          var style = getComputedStyle(slogan);
          var pad = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
          var range = document.createRange();
          range.selectNodeContents(slogan);
          var wrapped = lineMetrics(range);
          if (!wrapped.widest) return;
          slogan.style.width = Math.min(Math.ceil(wrapped.widest + pad + 1), available) + "px";
        }

        function lineMetrics(range) {
          var rects = range.getClientRects();
          var lines = [];
          for (var i = 0; i < rects.length; i++) {
            var rect = rects[i];
            if (rect.width <= 0 || rect.height <= 0) continue;
            var line = null;
            for (var j = 0; j < lines.length; j++) {
              var overlap = Math.min(lines[j].bottom, rect.bottom) - Math.max(lines[j].top, rect.top);
              if (overlap > Math.min(lines[j].bottom - lines[j].top, rect.height) * 0.5) {
                line = lines[j];
                break;
              }
            }
            if (!line) {
              lines.push({ top: rect.top, bottom: rect.bottom, left: rect.left, right: rect.right });
              continue;
            }
            line.top = Math.min(line.top, rect.top);
            line.bottom = Math.max(line.bottom, rect.bottom);
            line.left = Math.min(line.left, rect.left);
            line.right = Math.max(line.right, rect.right);
          }
          var widest = 0;
          for (var k = 0; k < lines.length; k++) {
            var width = lines[k].right - lines[k].left;
            if (width > widest) widest = width;
          }
          return { widest: widest, count: lines.length };
        }

        window.addEventListener("resize", syncViewport);
        document.fonts.ready.then(function () {
          fitSlogan();
          matchXWidget();
        });
        new ResizeObserver(matchXWidget).observe(document.querySelector(".release-widget"));

        var viewportWidth = window.innerWidth;
        var viewportHeight = window.innerHeight;

        function syncViewport() {
          var width = window.innerWidth;
          var height = window.innerHeight;
          var widthChanged = width !== viewportWidth;
          if (widthChanged || Math.abs(height - viewportHeight) > 140) {
            viewportWidth = width;
            viewportHeight = height;
            root.style.setProperty("--app-height", height + "px");
          }
          if (widthChanged) {
            fitSlogan();
            matchXWidget();
          }
        }

        function setLangOpen(open) {
          langSwitch.classList.toggle("is-open", open);
          root.classList.toggle("lang-open", open);
          langButton.setAttribute("aria-expanded", String(open));
          langMenu.hidden = !open;
        }

        langButton.addEventListener("click", function (event) {
          event.stopPropagation();
          setLangOpen(langMenu.hidden);
        });

        langMenu.addEventListener("click", function (event) {
          var button = event.target.closest("button");
          if (!button) return;
          root.dataset.lang = button.dataset.langSet;
          localStorage.setItem("oc-lang", lang());
          setLangOpen(false);
          render();
        });

        document.addEventListener("click", function (event) {
          if (!langSwitch.contains(event.target)) setLangOpen(false);
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") setLangOpen(false);
        });

        render();

        var releaseAt = new Date(2027, 0, 1).getTime();

        function pad(value) {
          return value < 10 ? "0" + value : String(value);
        }

        function tick() {
          var remaining = Math.max(0, releaseAt - Date.now());
          var totalSeconds = Math.floor(remaining / 1000);
          document.getElementById("timer-days").textContent = String(Math.floor(totalSeconds / 86400));
          document.getElementById("timer-hours").textContent = pad(Math.floor(totalSeconds / 3600) % 24);
          document.getElementById("timer-minutes").textContent = pad(Math.floor(totalSeconds / 60) % 60);
          document.getElementById("timer-seconds").textContent = pad(totalSeconds % 60);
        }

        tick();
        setInterval(tick, 1000);
      })();
    </script>
  </body>
</html>
